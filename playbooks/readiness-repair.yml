---
- name: Repair Galera readiness agents without full site convergence
  hosts: librenms_db:!maintenance_nodes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    readiness_template_dir: "{{ playbook_dir }}/../roles/galera/templates"
  roles:
    - role: librenms_defaults
  tasks:
    - name: Load common OS-specific database variables
      ansible.builtin.include_vars:
        file: "{{ lookup('first_found', readiness_common_vars_lookup) }}"
      vars:
        readiness_common_vars_lookup:
          files:
            - "{{ ansible_facts.distribution | replace(' ', '') }}.yml"
            - "{{ ansible_facts.os_family }}.yml"
          paths:
            - "{{ playbook_dir }}/../roles/common/vars"

    - name: Require Galera mode for readiness repair
      ansible.builtin.assert:
        that:
          - librenms_db_mode == 'galera'
          - librenms_galera_readiness_agent_enabled | bool
        fail_msg: >-
          Readiness repair is only valid when librenms_db_mode=galera and the
          Galera readiness agent is enabled.

    - name: Deploy bounded Galera readiness agent
      ansible.builtin.template:
        src: "{{ readiness_template_dir }}/librenms-galera-readiness-agent.sh.j2"
        dest: "{{ librenms_galera_readiness_agent_path }}"
        owner: root
        group: root
        mode: "0750"
        validate: /bin/bash -n %s

    - name: Deploy persistent Galera readiness server
      ansible.builtin.template:
        src: "{{ readiness_template_dir }}/librenms-galera-readiness-agent-server.py.j2"
        dest: "{{ librenms_galera_readiness_agent_server_path }}"
        owner: root
        group: root
        mode: "0750"
        validate: /usr/bin/python3 -m py_compile %s

    - name: Deploy bounded Galera readiness agent reset helper
      ansible.builtin.template:
        src: "{{ readiness_template_dir }}/librenms-galera-readiness-agent-reset.sh.j2"
        dest: /usr/local/sbin/librenms-galera-readiness-agent-reset
        owner: root
        group: root
        mode: "0750"
        validate: /bin/bash -n %s

    - name: Deploy bounded Galera readiness socket unit
      ansible.builtin.template:
        src: "{{ readiness_template_dir }}/librenms-galera-readiness-agent.socket.j2"
        dest: "/etc/systemd/system/{{ librenms_galera_readiness_agent_socket_unit }}"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy persistent Galera readiness service unit
      ansible.builtin.template:
        src: "{{ readiness_template_dir }}/librenms-galera-readiness-agent.service.j2"
        dest: "/etc/systemd/system/{{ librenms_galera_readiness_agent_service_unit }}"
        owner: root
        group: root
        mode: "0644"

    - name: Remove legacy per-connection readiness worker template
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ librenms_galera_readiness_agent_legacy_service_unit }}"
        state: absent

    - name: Stop stale readiness workers before socket restart
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/librenms-galera-readiness-agent-reset
      changed_when: false

    - name: Restart Galera readiness socket
      ansible.builtin.systemd:
        name: "{{ librenms_galera_readiness_agent_socket_unit }}"
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Start persistent Galera readiness server after socket repair
      ansible.builtin.systemd:
        name: "{{ librenms_galera_readiness_agent_service_unit }}"
        state: started
        daemon_reload: true

    - name: Verify local readiness agent after repair
      ansible.builtin.shell: |-
        set +e
        response="$({
          timeout 5 bash -c '
            exec 3<>/dev/tcp/"$1"/"$2"
            IFS= read -r response <&3
            printf "%s\n" "${response}"
            [ "${response}" = up ]
          ' _ "{{ ansible_host | default(inventory_hostname) }}" "{{ librenms_galera_readiness_agent_port }}"
        })"
        probe_rc=$?
        printf 'readiness_response=%s\n' "${response}"
        printf 'readiness_probe_rc=%s\n' "${probe_rc}"
        exit "${probe_rc}"
      args:
        executable: /bin/bash
      register: readiness_repair_probe
      changed_when: false
      failed_when: false
      retries: "{{ librenms_galera_readiness_agent_probe_retries | int }}"
      delay: "{{ librenms_galera_readiness_agent_probe_delay | int }}"
      until: readiness_repair_probe.rc == 0

    - name: Capture direct readiness-agent result after failed socket probe
      ansible.builtin.command:
        argv:
          - timeout
          - "{{ librenms_galera_readiness_agent_probe_timeout | int }}"
          - "{{ librenms_galera_readiness_agent_path }}"
      register: readiness_repair_direct_probe
      changed_when: false
      failed_when: false
      when: readiness_repair_probe.rc != 0

    - name: Capture Galera state after failed readiness probe
      ansible.builtin.command:
        argv:
          - timeout
          - "{{ librenms_galera_readiness_agent_query_timeout | int }}"
          - mysql
          - --protocol=socket
          - "--socket={{ librenms_mariadb_socket }}"
          - -Nse
          - >-
            SHOW GLOBAL STATUS WHERE Variable_name IN
            ('wsrep_cluster_status','wsrep_ready','wsrep_local_state_comment');
      register: readiness_repair_galera_state
      changed_when: false
      failed_when: false
      when: readiness_repair_probe.rc != 0

    - name: Check for a local Galera backend drain marker after failed probe
      ansible.builtin.stat:
        path: "{{ librenms_galera_backend_drain_path }}"
      register: readiness_repair_backend_drain
      when: readiness_repair_probe.rc != 0

    - name: Capture readiness socket status after failed probe
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - "{{ librenms_galera_readiness_agent_socket_unit }}"
          - --no-pager
          - -l
      register: readiness_repair_socket_status
      changed_when: false
      failed_when: false
      when: readiness_repair_probe.rc != 0

    - name: Fail with readiness-agent diagnostics
      ansible.builtin.fail:
        msg: |-
          Local Galera readiness agent did not report "up" after repair on {{ inventory_hostname }}.

          Socket probe:
          {{ readiness_repair_probe.stdout | default('') }}
          {{ readiness_repair_probe.stderr | default('') }}

          Direct agent result:
          {{ readiness_repair_direct_probe.stdout | default('') }}
          {{ readiness_repair_direct_probe.stderr | default('') }}

          Galera state:
          {{ readiness_repair_galera_state.stdout | default('') }}
          {{ readiness_repair_galera_state.stderr | default('') }}

          Backend drain marker present:
          {{ readiness_repair_backend_drain.stat.exists | default(false) }}

          Readiness socket status:
          {{ readiness_repair_socket_status.stdout | default('') }}
          {{ readiness_repair_socket_status.stderr | default('') }}

          The repair deliberately leaves HAProxy protection enabled when the
          local Galera member is not Primary/ready/Synced. Do not bypass this
          check; resolve the reported Galera state or stale drain marker first.
      when: readiness_repair_probe.rc != 0
