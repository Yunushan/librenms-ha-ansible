---
- name: Bootstrap supported target runtimes
  ansible.builtin.import_playbook: platform-bootstrap.yml

- name: Common preparation on managed hosts
  hosts: librenms_nodes:librenms_db:librenms_redis:lb_nodes:gluster_nodes:!maintenance_nodes
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: common

- name: Configure database hosts
  hosts: librenms_db:!maintenance_nodes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: mariadb
      when: librenms_db_mode in ['local', 'galera']
    - role: galera
      when: librenms_db_mode == 'galera'

- name: Configure Redis hosts
  hosts: librenms_redis:!maintenance_nodes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: redis_sentinel
      when: librenms_redis_mode in ['local', 'sentinel', 'external']

- name: Configure Gluster-backed RRD storage
  hosts: gluster_nodes:!maintenance_nodes
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: glusterfs_rrd
      when: librenms_rrd_mode == 'glusterfs'

- name: Configure externally managed shared RRD storage
  hosts: librenms_nodes:!maintenance_nodes
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: external_rrd
      when: librenms_rrd_mode == 'external'

- name: Configure local SNMP agents
  hosts: librenms_nodes:!maintenance_nodes
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: snmpd
      when: librenms_manage_local_snmpd | bool

- name: Configure LibreNMS application nodes
  hosts: librenms_nodes:!maintenance_nodes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: librenms_app

- name: Configure load balancer and VIP hosts
  hosts: lb_nodes:!maintenance_nodes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: haproxy_keepalived
      when: librenms_vip_enabled | bool or (librenms_db_mode == 'galera') or ((librenms_active_web_nodes | default([])) | length > 1)

- name: Enforce explicitly configured host firewall policy
  hosts: librenms_nodes:librenms_db:librenms_redis:lb_nodes:gluster_nodes:!maintenance_nodes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: host_firewall
      when: (librenms_manage_host_firewall | default(false)) | bool
