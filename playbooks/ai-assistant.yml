---
- name: Configure the optional LibreNMS AI assistant plugin
  hosts: librenms_nodes:!maintenance_nodes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: librenms_ai_assistant
      when:
        - librenms_ai_assistant_enabled | bool
        - librenms_install_profile in ['full', 'web']
