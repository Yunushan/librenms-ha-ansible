---
librenms_mode: ha
librenms_install_profile: full
# site.yml bootstraps this interpreter before gathering facts. Keeping it in
# inventory also makes later status, backup, and recovery playbooks work on
# RHEL 8, whose platform Python is too old for the pinned ansible-core release.
ansible_python_interpreter: /opt/librenms-ha-ansible/python/bin/python
# Enable only after completing the production values below and before running
# playbooks/production-readiness.yml. This makes the readiness gate require
# TLS and the explicit source-restricted host firewall policy.
# librenms_production_profile: true

librenms_fqdn: librenms.example.com
librenms_timezone: Etc/UTC

librenms_app_key: CHANGE_ME_USE_GENERATE_SECRETS

# Production readiness checks this encrypted vault file by default. For secrets
# injected by AWX or another external system, set the source to external and
# document the provider plus credential reference instead.
# librenms_production_readiness_secret_source: ansible_vault
# librenms_production_readiness_ansible_vault_file: "{{ inventory_dir }}/group_vars/vault.yml"
# librenms_production_readiness_secret_source: external
# librenms_production_readiness_external_secret_provider: AWX credential
# librenms_production_readiness_external_secret_reference: LibreNMS HA secrets

librenms_db_mode: galera
librenms_db_name: librenms
librenms_db_user: librenms
librenms_db_password: CHANGE_ME_DB_PASSWORD
# Each sample web node is also a Galera member.  Use that local member at
# runtime so database VIP moves and HAProxy backend transitions cannot break
# active LibreNMS requests.  The deep web health check drains a node whenever
# its local member is no longer ready.
librenms_runtime_db_prefer_local_galera: true
librenms_db_bootstrap_host: lnms1

# MariaDB uses the Ubuntu 24.04 packages (10.11) by default. To use MariaDB
# Community Server for a fresh install instead, select one explicit series and
# pin the approved MariaDB repository setup script checksum. 11.4, 11.8, and
# 12.3 are supported for this HA Galera profile. MariaDB 12.3 also requires the
# separate official Galera package source and galera-4 provider version checked
# by the role. Follow the staged upgrade runbook; changing this value is
# intentionally not an in-place major upgrade switch.
# librenms_mariadb_repository_mode: upstream
# librenms_mariadb_upstream_series: "11.8" # supported: 11.4, 11.8, 12.3
# librenms_mariadb_upstream_repo_setup_checksum: sha256:REPLACE_WITH_64_HEX_CHARACTERS

librenms_galera_cluster_name: librenms_cluster

# HA daily maintenance takes its cluster-wide flock on the shared RRD mount.
# Do not move this lock to a local filesystem or replace it with a MariaDB named
# lock, because MariaDB GET_LOCK() is not replicated between Galera members.
# librenms_daily_global_lock_backend: shared_file
# librenms_daily_global_lock_shared_file: /opt/librenms/rrd/.librenms-daily-maintenance.lock

librenms_redis_mode: sentinel
librenms_redis_master_host: lnms1
librenms_redis_password: CHANGE_ME_REDIS_PASSWORD
librenms_redis_sentinel_password: CHANGE_ME_SENTINEL_PASSWORD
librenms_redis_sentinel_service: mymaster
# LibreNMS uses Redis for cache, sessions, locks, and queues. In HA Sentinel
# mode, keep Redis persistence disabled by default so RDB snapshots cannot make
# Redis restarts hang during deploys or automatic maintenance.
librenms_redis_persistence_enabled: false
librenms_redis_remove_persistence_files_when_disabled: true
librenms_redis_clear_stuck_stop_job: true
librenms_redis_manage_overcommit_memory: true
librenms_redis_systemd_timeout_start_sec: 30
librenms_redis_systemd_timeout_stop_sec: 30

# Ubuntu/Debian may use in-node Gluster. RHEL-family 8/9/10 full HA must replace
# this with external NFS/NFSv4 and set librenms_external_rrd_source plus fixed
# shared librenms_uid/librenms_gid values before the first deployment.
librenms_rrd_mode: glusterfs
librenms_gluster_bootstrap_host: lnms1
librenms_gluster_volume_name: librenms-rrd
librenms_gluster_brick_path: /gluster/brick1/librenms-rrd
librenms_gluster_mountpoint: /opt/librenms/rrd
librenms_gluster_manage_brick_device: false
librenms_gluster_brick_device: /dev/sdb1
# Recover a FUSE mount that remains in the mount table but no longer permits
# filesystem access. Healthy Gluster mounts are never detached by this repair.
librenms_gluster_recover_stale_client_mounts: true

librenms_vip_enabled: true
librenms_vip_ip: 10.10.10.10
librenms_vip_cidr: 24
librenms_vip_interface: ""
librenms_keepalived_auth_pass: CHANGE_ME_VRRP_PASSWORD
librenms_keepalived_vrid: 51

# Optional host firewall: keep disabled until the CIDRs are reviewed. The
# managed UFW policy first permits SSH from management and all trusted HA
# traffic from the cluster network, then denies other inbound traffic.
# librenms_manage_host_firewall: true
# librenms_host_firewall_management_sources:
#   - 10.4.92.0/24
# librenms_host_firewall_cluster_sources:
#   - 10.2.7.0/24
# librenms_host_firewall_web_sources:
#   - 10.4.92.0/24
# librenms_host_firewall_syslog_sources:
#   - 10.3.24.0/24
# librenms_host_firewall_snmp_sources:
#   - 10.2.7.0/24

# Domain/TLS through the HAProxy VIP. Point your DNS A record at
# librenms_vip_ip, then enable these values when you have certificate files.
#
# librenms_fqdn: librenms.example.com
# librenms_haproxy_tls_enabled: true
# librenms_haproxy_tls_manage_cert: true
# librenms_haproxy_tls_cert_src: "{{ playbook_dir }}/../files/librenms.crt"
# librenms_haproxy_tls_key_src: "{{ playbook_dir }}/../files/librenms.key.pem"
# librenms_haproxy_tls_chain_src: "{{ playbook_dir }}/../files/ca-chain.crt"

librenms_bootstrap_completed: false
librenms_manage_local_snmpd: true
# Auto-add hosts in librenms_nodes as monitored LibreNMS devices after bootstrap.
librenms_seed_cluster_devices: "{{ librenms_manage_local_snmpd | bool }}"

# Operational runbook toggles and examples.
# Leave these commented until you need the specific workflow.

# Enable live TCP listener checks for the HA network matrix during doctor runs:
# ansible-playbook -i inventories/ha/hosts.yml playbooks/doctor.yml \
#   --ask-become-pass \
#   -e librenms_doctor_network_tcp_checks_enabled=true
#
# librenms_doctor_network_tcp_checks_enabled: false
# librenms_doctor_network_check_gluster_brick_ports: false

# Fail the HA status playbook when any HA layer is degraded. This is useful for
# AWX schedules, monitoring hooks, and pre-maintenance gates.
#
# librenms_status_alert_fail_on_degraded: true
# librenms_status_alerts_enabled: true
# librenms_status_alert_webhook_url: https://hooks.example.com/librenms-ha
# librenms_status_alert_webhook_headers:
#   Authorization: "Bearer CHANGE_ME"
# librenms_status_alert_webhook_validate_certs: true

# Target optional failover drills. Empty values let the role choose safe
# defaults from the current inventory.
#
# librenms_failover_test_cases:
#   - web_backend
#   - keepalived_vip
#   - haproxy_service
#   - dispatcher_service
# librenms_failover_test_web_backend_host: lnms2
# librenms_failover_test_haproxy_host: lnms2
# librenms_failover_test_dispatcher_host: lnms2
# librenms_failover_test_redis_query_host: lnms2
# librenms_failover_test_galera_host: lnms3
# librenms_failover_test_post_recovery_validate: true
# librenms_failover_test_write_evidence: true
# librenms_failover_test_evidence_dir: /var/lib/librenms-ha/failover-evidence
# librenms_failover_test_evidence_retention_days: 90
# librenms_production_readiness_write_evidence: true
# librenms_production_readiness_evidence_dir: /var/lib/librenms-ha/production-readiness-evidence
# librenms_production_readiness_evidence_retention_days: 365

# Diagnostics bundle tuning for incident capture. Keep fetch enabled for normal
# controller-side archives; use keep_remote when controller fetch is unreliable.
#
# librenms_diagnostics_local_dir: diagnostics
# librenms_diagnostics_journal_lines: 500
# librenms_diagnostics_log_lines: 1000
# librenms_diagnostics_keep_remote: false
# librenms_diagnostics_fetch: true

# Restore-test input. Set this to a backup directory created by backup.yml when
# running playbooks/restore-test.yml.
#
# librenms_restore_test_backup_dir: /var/backups/librenms-ha/<timestamp>
# librenms_restore_test_host: ""
# librenms_restore_test_require_rrd: false

# Scheduled backups and automatic-update guardrails. By default site.yml deploys
# daily DB/config backups, weekly DB/config backups, and a required pre-upgrade
# backup before librenms-daily.timer runs daily.sh. RRD archives remain disabled
# by default because they can be very large in Gluster-backed HA deployments.
#
# librenms_manage_scheduled_backups: true
# librenms_backup_root: /var/backups/librenms-ha
# librenms_backup_scheduled_host: lnms1
# librenms_backup_daily_on_calendar: "*-*-* 02:30:00"
# librenms_backup_daily_retention: 7
# librenms_backup_weekly_on_calendar: "Sun *-*-* 02:00:00"
# librenms_backup_weekly_retention: 4
# librenms_backup_pre_upgrade_enabled: true
# librenms_backup_pre_upgrade_required: true
# librenms_backup_pre_upgrade_retention: 5
# librenms_backup_include_rrd: false
# librenms_daily_self_heal_git_lock_cleanup: true
# librenms_daily_self_heal_git_metadata_repair: true
# librenms_daily_self_heal_git_retry_after_repair: true
# librenms_daily_self_heal_clear_laravel_cache_after_daily: true
# librenms_daily_self_heal_treat_healthy_update_failure_as_success: true
# librenms_daily_self_heal_clear_healthy_update_failure_notification: true
# librenms_daily_self_heal_notification_cleanup_days: 30
# librenms_daily_ha_drain_enabled: true
# librenms_daily_ha_drain_delay: 15
# librenms_production_readiness_verify_database_restore: true
# HA defaults enable both guarded recovery paths. Set either override to false
# only when an external process manager owns PHP-FPM recovery.
# librenms_startup_repair_restart_php_fpm_on_db_gone_away: false
# librenms_startup_repair_reload_php_fpm_after_db_recovery: false
# All /validate/results/* requests use the dedicated HAProxy/Nginx validation
# path. Override this only if validation checks need a different upper bound.
# librenms_web_validation_timeout: 900s
# The older RRD-specific name remains supported for compatibility.
# librenms_web_validation_rrd_check_timeout: 900s
# librenms_haproxy_db_tcp_keepalive: true
# librenms_haproxy_db_shutdown_sessions_on_backend_down: false
# Keep this false in normal production. Backend state changes remain logged,
# while high-volume database connection logs are suppressed.
# librenms_haproxy_db_connection_logging_enabled: false
# Remove a web node immediately when its database-aware runtime probe fails,
# then require three successful probes before returning it to service.
librenms_haproxy_web_runtime_check_interval: 1s
librenms_haproxy_web_runtime_check_fall: 1
librenms_haproxy_web_runtime_check_rise: 3
# librenms_galera_readiness_agent_enabled: true
# librenms_galera_self_heal_enabled: true
# librenms_galera_self_heal_failure_threshold: 4
# librenms_galera_self_heal_restart_cooldown: 600
# A stopped local member may rejoin only when at least one remote member proves
# Primary/ready/synced. This is a normal rejoin and never bootstraps a cluster.
# librenms_galera_self_heal_min_healthy_peers: 1
# librenms_galera_self_heal_service_action_timeout: 180
# Buffer syslog while the local LibreNMS database sink is unavailable. The
# queue is disk-assisted and bounded; increase it only after sizing the spool.
# librenms_syslog_action_queue_enabled: true
# librenms_syslog_action_queue_max_disk_space: 1g
# librenms_syslog_action_resume_interval: 30
# Successful socket-activated Galera readiness probes otherwise create several
# local systemd messages per check. Failures remain logged when this is true.
# librenms_syslog_suppress_galera_readiness_lifecycle: true
# Existing clusters fail closed for a total Galera outage. Do not enable unsafe
# recovery without a reviewed recovery policy and current backups.
# librenms_galera_auto_recover_unsafe_bootstrap: false

# Galera recovery guard. Set both values only when there is no Galera Primary
# component and galera-recover.yml has reported the selected bootstrap host.
#
# librenms_galera_recover_confirm: false
# librenms_galera_recover_bootstrap_host: lnms2
# librenms_galera_recover_tie_breaker: manual

# Optional AWX controller deployment. See docs/awx-controller.md.
awx_controller_enabled: false

librenms_snmp_versions_enabled:
  - v1
  - v2c
  - v3

librenms_snmp_version_order:
  - v3
  - v2c
  - v1

librenms_snmp_v2c_community: CHANGE_ME_COMMUNITY

librenms_snmp_v3_users:
  - username: lnmsv3
    auth_protocol: SHA
    auth_password: CHANGE_ME_AUTH_PASSWORD
    priv_protocol: AES
    priv_password: CHANGE_ME_PRIV_PASSWORD
    access: ro

# Device map locations come from SNMP sysLocation or LibreNMS location maps.
# Use a real address, or provide fixed coordinates to avoid external geocoding.
#
# librenms_snmp_syslocation: "Istanbul, Turkiye"
# librenms_snmp_syslocation_latitude: "41.0082"
# librenms_snmp_syslocation_longitude: "28.9784"
#
# Optional external geocoder for devices that expose real postal addresses.
# Add a real key here; the role enables geoloc.engine=google automatically
# when this value is set.
librenms_geolocation_api_key: ""
# librenms_geolocation_engine: google

# Optional sysLocation rewrite maps. These let LibreNMS convert vague SNMP
# locations into full addresses or fixed coordinates before geocoding.
librenms_location_map: {}
librenms_location_map_regex: {}
librenms_location_map_regex_sub: {}
# Example:
# librenms_location_map:
#   "LibreNMS Node": "Istanbul, Turkiye [41.0082, 28.9784]"
# librenms_location_map_regex_sub:
#   "/DC1-Rack([0-9]+)/": "DC1 Rack $1, Istanbul, Turkiye [41.0082, 28.9784]"

# Topology map inputs. LibreNMS can only draw links discovered from LLDP/CDP/FDP
# or from MAC/ARP data exposed by monitored network devices.
librenms_network_map_show_on_worldmap: true
librenms_network_map_worldmap_show_disabled_alerts: true
librenms_network_map_worldmap_link_type: xdp
# librenms_network_map_items:
#   - mac
#   - xdp
