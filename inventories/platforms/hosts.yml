---
# Optional platform inventory. Keep this separate from inventories/ha so
# container and Kubernetes experiments cannot accidentally alter VM nodes.
# Add real hosts under the relevant group. Example:
# all:
#   children:
#     container_hosts:
#       hosts:
#         docker-host-1:
#           ansible_host: 192.0.2.10
#           ansible_user: operator
all:
  children:
    container_hosts:
      hosts: {}
    k3s_nodes:
      children:
        k3s_servers:
        k3s_agents:
    k3s_servers:
      hosts: {}
    k3s_agents:
      hosts: {}
    rke2_nodes:
      children:
        rke2_servers:
        rke2_agents:
    rke2_servers:
      hosts: {}
    rke2_agents:
      hosts: {}
    microk8s_nodes:
      children:
        microk8s_primaries:
        microk8s_joiners:
    microk8s_primaries:
      hosts: {}
    microk8s_joiners:
      hosts: {}
    okd_controllers:
      hosts: {}
    kubespray_controller:
      hosts: {}
    kubeone_controller:
      hosts: {}
    gardener_controller:
      hosts: {}
