---
librenms_mode: standalone
librenms_install_profile: full
ansible_python_interpreter: /opt/librenms-ha-ansible/python/bin/python
# Python 3.15 is supported after the controller uses stable ansible-core 2.22+.
# For a pre-release 2.22 compatibility test, set the preview flag as well as a
# reviewed preinstalled interpreter before bootstrapping the managed runtime:
# librenms_python_315_preview_enabled: true
# librenms_managed_python_system_binary: /usr/bin/python3.15

librenms_fqdn: librenms.example.com
librenms_timezone: Etc/UTC

librenms_app_key: CHANGE_ME_USE_GENERATE_SECRETS

# Optional read-only local-model assistant. See docs/ai-assistant.md.
# librenms_ai_assistant_enabled: true
# librenms_ai_assistant_providers:
#   - id: ollama
#     label: Local Ollama
#     driver: openai_compatible
#     base_url: http://127.0.0.1:11434/v1
#     local: true
#     auth: none
#     verify_tls: false
#     context_enabled: true
#     default_model: llama3.2
#     models:
#       - id: llama3.2
#         label: Llama 3.2
#         efforts: [none, low, medium, high]
#         default_effort: none

librenms_db_mode: local
librenms_db_name: librenms
librenms_db_user: librenms
librenms_db_password: CHANGE_ME_DB_PASSWORD
# Optional MariaDB Community Server selection for a fresh standalone install.
# Supported series: 11.4, 11.8, and 12.3. Pin the repository setup script
# checksum before enabling upstream mode.
# librenms_mariadb_repository_mode: upstream
# librenms_mariadb_upstream_series: "12.3"
# librenms_mariadb_upstream_repo_setup_checksum: sha256:REPLACE_WITH_64_HEX_CHARACTERS

librenms_redis_mode: local
librenms_redis_password: CHANGE_ME_REDIS_PASSWORD
librenms_redis_sentinel_password: CHANGE_ME_SENTINEL_PASSWORD

librenms_rrd_mode: local

librenms_vip_enabled: false

librenms_bootstrap_completed: false
librenms_manage_local_snmpd: true
# Auto-add hosts in librenms_nodes as monitored LibreNMS devices after bootstrap.
librenms_seed_cluster_devices: "{{ librenms_manage_local_snmpd | bool }}"

# Optional AWX controller deployment. See docs/awx-controller.md.
awx_controller_enabled: false

librenms_snmp_versions_enabled:
  - v2c
  - v3

librenms_snmp_version_order:
  - v3
  - v2c
  - v1

librenms_snmp_v2c_community: CHANGE_ME_COMMUNITY

librenms_snmp_v3_users:
  - username: lnmsv3
    auth_protocol: SHA
    auth_password: CHANGE_ME_AUTH_PASSWORD
    priv_protocol: AES
    priv_password: CHANGE_ME_PRIV_PASSWORD
    access: ro
