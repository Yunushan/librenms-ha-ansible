---
name: librenms-redis-sentinel-integration

x-redis-node: &redis-node
  image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99

x-redis-command: &redis-command
  - redis-server
  - --appendonly
  - "no"
  - --save
  - ""
  - --protected-mode
  - "no"
  - --bind
  - 0.0.0.0

x-sentinel: &sentinel
  image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
  command:
    - sh
    - -ec
    - |
      cat >/tmp/sentinel.conf <<'EOF'
      bind 0.0.0.0
      port 26379
      sentinel monitor mymaster 172.30.77.11 6379 2
      sentinel down-after-milliseconds mymaster 1000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1
      EOF
      exec redis-sentinel /tmp/sentinel.conf

services:
  redis-1:
    <<: *redis-node
    command: *redis-command
    networks:
      sentinel:
        ipv4_address: 172.30.77.11

  redis-2:
    <<: *redis-node
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "no"
      - --bind
      - 0.0.0.0
      - --replicaof
      - 172.30.77.11
      - "6379"
    networks:
      sentinel:
        ipv4_address: 172.30.77.12

  redis-3:
    <<: *redis-node
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "no"
      - --bind
      - 0.0.0.0
      - --replicaof
      - 172.30.77.11
      - "6379"
    networks:
      sentinel:
        ipv4_address: 172.30.77.13

  sentinel-1:
    <<: *sentinel
    networks:
      sentinel:
        ipv4_address: 172.30.77.21

  sentinel-2:
    <<: *sentinel
    networks:
      sentinel:
        ipv4_address: 172.30.77.22

  sentinel-3:
    <<: *sentinel
    networks:
      sentinel:
        ipv4_address: 172.30.77.23

networks:
  sentinel:
    ipam:
      config:
        - subnet: 172.30.77.0/24
