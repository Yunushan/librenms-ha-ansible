server {
    listen 80;

    location = /runtime {
        if (-f /tmp/runtime-unhealthy) {
            return 503;
        }
        add_header X-Backend web-1 always;
        return 200 "runtime-ok\n";
    }

    location = /application {
        add_header X-Backend web-1 always;
        return 200 "application-ok\n";
    }
}
