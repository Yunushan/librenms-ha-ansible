---
name: librenms-haproxy-web-integration

services:
  web-1:
    image: nginx:1.31.3-alpine3.24
    volumes:
      - ./web-1.conf:/etc/nginx/conf.d/default.conf:ro

  web-2:
    image: nginx:1.31.3-alpine3.24
    volumes:
      - ./web-2.conf:/etc/nginx/conf.d/default.conf:ro

  haproxy:
    image: haproxy:3.4.0-alpine3.23
    ports:
      - "${HAPROXY_WEB_TEST_PORT:-18080}:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
