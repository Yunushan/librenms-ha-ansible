---
name: librenms-haproxy-web-integration

services:
  web-1:
    image: nginx:1.31.3-alpine3.24@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes:
      - ./web-1.conf:/etc/nginx/conf.d/default.conf:ro

  web-2:
    image: nginx:1.31.3-alpine3.24@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes:
      - ./web-2.conf:/etc/nginx/conf.d/default.conf:ro

  haproxy:
    image: haproxy:3.4.0-alpine3.23@sha256:5614ec450485ce1f9f8c25d231cf7fbab9326302a395f2355e05cbbc2dd7468b
    ports:
      - "${HAPROXY_WEB_TEST_PORT:-18080}:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
