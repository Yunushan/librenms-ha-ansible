global
    log stdout format raw local0

defaults
    mode http
    timeout connect 2s
    timeout client 5s
    timeout server 5s

frontend web
    bind *:8080
    default_backend web_nodes

backend web_nodes
    option httpchk GET /runtime
    http-check expect status 200
    server web1 web-1:80 check inter 500ms fall 2 rise 1
    server web2 web-2:80 check inter 500ms fall 2 rise 1
