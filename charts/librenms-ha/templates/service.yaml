apiVersion: v1
kind: Service
metadata:
  name: {{ include "librenms-ha.fullname" . }}
  labels:
    {{- include "librenms-ha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "librenms-ha.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
