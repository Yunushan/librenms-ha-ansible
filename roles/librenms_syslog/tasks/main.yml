---
- name: Validate LibreNMS syslog backend
  assert:
    that:
      - librenms_syslog_backend == 'rsyslog'
      - librenms_syslog_listen_udp | bool or librenms_syslog_listen_tcp | bool
      - librenms_syslog_host_property in ['fromhost', 'fromhost-ip', 'hostname']
      - librenms_syslog_forward_protocol in ['udp', 'tcp']
      - not (librenms_syslog_forward_local_logs | bool) or librenms_syslog_forward_target | length > 0
      - not (librenms_syslog_forward_local_logs | bool) or librenms_syslog_forward_selector | length > 0
      - not (librenms_syslog_action_queue_enabled | bool) or librenms_syslog_action_queue_filename | length > 0
      - not (librenms_syslog_action_queue_enabled | bool) or librenms_syslog_action_queue_spool_dir | length > 0
      - (librenms_syslog_action_queue_size | int) > 0
      - (librenms_syslog_action_queue_worker_threads | int) > 0
      - (librenms_syslog_action_resume_interval | int) > 0
    fail_msg: "Only the rsyslog backend is currently supported for LibreNMS syslog ingestion."

- name: Refresh apt cache for syslog receiver packages
  apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install LibreNMS syslog receiver packages
  package:
    name: "{{ librenms_syslog_packages }}"
    state: present

- name: Gather service facts for syslog firewall detection
  service_facts:
  when: librenms_syslog_manage_firewall | bool

- name: Detect UFW availability on Debian syslog receivers
  command:
    argv:
      - ufw
      - status
  register: librenms_syslog_ufw_status
  changed_when: false
  failed_when: false
  when:
    - librenms_syslog_manage_firewall | bool
    - ansible_os_family == 'Debian'

- name: Allow LibreNMS syslog UDP port with UFW when available
  community.general.ufw:
    rule: allow
    port: "{{ librenms_syslog_udp_port }}"
    proto: udp
  when:
    - librenms_syslog_manage_firewall | bool
    - librenms_syslog_listen_udp | bool
    - ansible_os_family == 'Debian'
    - librenms_syslog_ufw_status is defined
    - librenms_syslog_ufw_status.rc == 0

- name: Allow LibreNMS syslog TCP port with UFW when available
  community.general.ufw:
    rule: allow
    port: "{{ librenms_syslog_tcp_port }}"
    proto: tcp
  when:
    - librenms_syslog_manage_firewall | bool
    - librenms_syslog_listen_tcp | bool
    - ansible_os_family == 'Debian'
    - librenms_syslog_ufw_status is defined
    - librenms_syslog_ufw_status.rc == 0

- name: Query LibreNMS syslog UDP port in persistent firewalld policy # noqa command-instead-of-module
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ librenms_host_firewall_firewalld_zone }}"
      - "--query-port={{ librenms_syslog_udp_port }}/udp"
  register: librenms_syslog_firewalld_udp_query
  changed_when: false
  failed_when: librenms_syslog_firewalld_udp_query.rc not in [0, 1]
  when:
    - librenms_syslog_manage_firewall | bool
    - librenms_syslog_listen_udp | bool
    - ansible_os_family == 'RedHat'
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'

- name: Allow LibreNMS syslog UDP port with firewalld when active # noqa command-instead-of-module
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ librenms_host_firewall_firewalld_zone }}"
      - "--add-port={{ librenms_syslog_udp_port }}/udp"
  when:
    - librenms_syslog_firewalld_udp_query is not skipped
    - librenms_syslog_firewalld_udp_query.rc == 1
  notify: Reload firewalld

- name: Query LibreNMS syslog TCP port in persistent firewalld policy # noqa command-instead-of-module
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ librenms_host_firewall_firewalld_zone }}"
      - "--query-port={{ librenms_syslog_tcp_port }}/tcp"
  register: librenms_syslog_firewalld_tcp_query
  changed_when: false
  failed_when: librenms_syslog_firewalld_tcp_query.rc not in [0, 1]
  when:
    - librenms_syslog_manage_firewall | bool
    - librenms_syslog_listen_tcp | bool
    - ansible_os_family == 'RedHat'
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'

- name: Allow LibreNMS syslog TCP port with firewalld when active # noqa command-instead-of-module
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ librenms_host_firewall_firewalld_zone }}"
      - "--add-port={{ librenms_syslog_tcp_port }}/tcp"
  when:
    - librenms_syslog_firewalld_tcp_query is not skipped
    - librenms_syslog_firewalld_tcp_query.rc == 1
  notify: Reload firewalld

- name: Check rsyslog runtime user
  getent:
    database: passwd
    key: "{{ librenms_syslog_runtime_user }}"
  register: librenms_syslog_runtime_user_getent
  failed_when: false
  changed_when: false
  when: librenms_syslog_runtime_user | length > 0

- name: Grant rsyslog runtime user access to LibreNMS files
  user:
    name: "{{ librenms_syslog_runtime_user }}"
    groups: "{{ librenms_group }}"
    append: true
  notify: Restart rsyslog
  when:
    - librenms_syslog_manage_runtime_user_group | bool
    - librenms_syslog_runtime_user | length > 0
    - (librenms_syslog_runtime_user_getent.ansible_facts.getent_passwd | default({})) | length > 0

- name: Ensure LibreNMS syslog action queue spool directory exists
  file:
    path: "{{ librenms_syslog_action_queue_spool_dir }}"
    state: directory
    owner: >-
      {{
        librenms_syslog_runtime_user
        if (
          librenms_syslog_runtime_user | length > 0
          and (librenms_syslog_runtime_user_getent.ansible_facts.getent_passwd | default({})) | length > 0
        )
        else 'root'
      }}
    group: root
    mode: "0750"
  notify: Restart rsyslog
  when: librenms_syslog_action_queue_enabled | bool

- name: Check LibreNMS syslog sink exists
  stat:
    path: "{{ librenms_install_dir }}/syslog.php"
  register: librenms_syslog_sink

- name: Check LibreNMS syslog PHP binary exists
  stat:
    path: "{{ librenms_syslog_php_binary }}"
  register: librenms_syslog_php_binary_stat

- name: Fail when LibreNMS syslog sink is missing
  fail:
    msg: >-
      {{ librenms_install_dir }}/syslog.php does not exist.
      Run the LibreNMS application deployment before enabling syslog ingestion.
  when: not (librenms_syslog_sink.stat.exists | default(false))

- name: Fail when LibreNMS syslog PHP binary is missing
  fail:
    msg: >-
      {{ librenms_syslog_php_binary }} does not exist.
      Set librenms_syslog_php_binary to the PHP CLI path on this host.
  when: not (librenms_syslog_php_binary_stat.stat.exists | default(false))

- name: Ensure the SELinux-compatible rsyslog helper directory exists
  file:
    path: "{{ librenms_syslog_selinux_wrapper_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: librenms_syslog_manage_selinux | bool

- name: Deploy the SELinux-compatible LibreNMS syslog helper
  template:
    src: librenms-syslog-wrapper.sh.j2
    dest: "{{ librenms_syslog_selinux_wrapper_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart rsyslog
  when: librenms_syslog_manage_selinux | bool

- name: Restore the vendor SELinux context on the LibreNMS syslog helper
  command:
    argv:
      - restorecon
      - -F
      - "{{ librenms_syslog_selinux_wrapper_path }}"
  register: librenms_syslog_selinux_wrapper_restorecon
  changed_when: >-
    (librenms_syslog_selinux_wrapper_restorecon.stdout | default('') | trim | length) > 0
  when: librenms_syslog_manage_selinux | bool

- name: Verify the LibreNMS syslog helper has the vendor SELinux context
  command:
    argv:
      - matchpathcon
      - -V
      - "{{ librenms_syslog_selinux_wrapper_path }}"
  changed_when: false
  when: librenms_syslog_manage_selinux | bool

- name: Persist the SELinux context for the rsyslog queue # noqa command-instead-of-module
  ansible.builtin.shell: |
    set -eu
    target={{ (librenms_syslog_action_queue_spool_dir ~ '(/.*)?') | quote }}
    setype=syslogd_var_lib_t
    current="$(
      semanage fcontext -l -C |
        awk -v target="${target}" '$1 == target { print $NF; exit }'
    )"

    case "${current}" in
      *:"${setype}":*) exit 0 ;;
    esac

    if [ -n "${current}" ]; then
      semanage fcontext -m -t "${setype}" "${target}"
    else
      semanage fcontext -a -t "${setype}" "${target}"
    fi
    printf '%s\n' LIBRENMS_SELINUX_FCONTEXT_CHANGED=1
  args:
    executable: /bin/bash
  register: librenms_syslog_queue_fcontext
  changed_when: >-
    'LIBRENMS_SELINUX_FCONTEXT_CHANGED=1'
    in (librenms_syslog_queue_fcontext.stdout | default(''))
  when:
    - librenms_syslog_manage_selinux | bool
    - librenms_syslog_action_queue_enabled | bool

- name: Apply the SELinux context to the rsyslog queue
  command:
    argv:
      - restorecon
      - -RF
      - "{{ librenms_syslog_action_queue_spool_dir }}"
  register: librenms_syslog_queue_restorecon
  changed_when: >-
    (librenms_syslog_queue_restorecon.stdout | default('') | trim | length) > 0
  when:
    - librenms_syslog_manage_selinux | bool
    - librenms_syslog_action_queue_enabled | bool

- name: Check rsyslog AppArmor profile exists
  stat:
    path: "{{ librenms_syslog_apparmor_profile_path }}"
  register: librenms_syslog_apparmor_profile
  when: librenms_syslog_manage_apparmor | bool

- name: Ensure rsyslog AppArmor local override directory exists
  file:
    path: "{{ librenms_syslog_apparmor_local_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - librenms_syslog_manage_apparmor | bool
    - librenms_syslog_apparmor_profile.stat.exists | default(false)

- name: Permit rsyslog omprog to execute LibreNMS syslog sink
  blockinfile:
    path: "{{ librenms_syslog_apparmor_local_path }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED LIBRENMS SYSLOG"
    block: |
      {{ librenms_syslog_php_binary }} ix,
      /etc/alternatives/php ix,
      /usr/bin/php* ix,
      /usr/bin/stty ix,
      {{ librenms_install_dir }}/syslog.php r,
      {{ librenms_install_dir }}/** r,
      {{ librenms_install_dir }}/logs/ rw,
      {{ librenms_install_dir }}/logs/** rwkl,
      {{ librenms_install_dir }}/storage/ rw,
      {{ librenms_install_dir }}/storage/** rwkl,
      {{ librenms_install_dir }}/storage/framework/cache/** rwkl,
      {{ librenms_install_dir }}/bootstrap/cache/** rwkl,
      /etc/php/** r,
      /etc/snmp/** r,
      /usr/share/php/** r,
      /usr/share/snmp/** r,
      /usr/lib/php/** mr,
  register: librenms_syslog_apparmor_local
  when:
    - librenms_syslog_manage_apparmor | bool
    - librenms_syslog_apparmor_profile.stat.exists | default(false)

- name: Reload rsyslog AppArmor profile
  command:
    argv:
      - apparmor_parser
      - -r
      - "{{ librenms_syslog_apparmor_profile_path }}"
  changed_when: librenms_syslog_apparmor_local.changed
  notify: Restart rsyslog
  when:
    - librenms_syslog_manage_apparmor | bool
    - librenms_syslog_apparmor_profile.stat.exists | default(false)
    - librenms_syslog_apparmor_local.changed

- name: Deploy rsyslog LibreNMS receiver configuration
  template:
    src: rsyslog-librenms.conf.j2
    dest: "{{ librenms_syslog_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Validate rsyslog configuration
  command:
    argv:
      - rsyslogd
      - -N1
  changed_when: false

- name: Read LibreNMS syslog ingestion state
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:get
      - enable_syslog
  become: true
  become_user: "{{ librenms_user }}"
  register: librenms_syslog_enabled_state
  changed_when: false
  failed_when: false

- name: Enable LibreNMS syslog ingestion on this node
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:set
      - enable_syslog
      - "true"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: true
  when: (librenms_syslog_enabled_state.stdout | default('') | trim | lower) != 'true'

- name: Configure LibreNMS syslog retention
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:set
      - syslog_purge
      - "{{ librenms_syslog_purge_days }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: true
  when:
    - (librenms_syslog_purge_days | int) > 0
    - inventory_hostname == (groups.get('librenms_primary', groups.get('librenms_nodes', [inventory_hostname])) | first)

- name: Enable LibreNMS syslog hooks
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:set
      - enable_syslog_hooks
      - "{{ librenms_syslog_enable_hooks | bool | ternary('true', 'false') }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: true
  when:
    - librenms_syslog_enable_hooks | bool
    - inventory_hostname == (groups.get('librenms_primary', groups.get('librenms_nodes', [inventory_hostname])) | first)

- name: Configure LibreNMS syslog hostname translations
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:set
      - syslog_xlate
      - "{{ librenms_syslog_xlate | to_json }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: true
  when:
    - (librenms_syslog_xlate | length) > 0
    - inventory_hostname == (groups.get('librenms_primary', groups.get('librenms_nodes', [inventory_hostname])) | first)

- name: Discover LibreNMS bootstrap cache files after syslog config
  find:
    paths: "{{ librenms_install_dir }}/bootstrap/cache"
    file_type: file
    excludes: ".gitignore"
  register: librenms_syslog_bootstrap_cache_files

- name: Remove LibreNMS bootstrap cache files after syslog config
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ librenms_syslog_bootstrap_cache_files.files | default([]) }}"

- name: Rebuild LibreNMS config cache after syslog config
  command:
    argv:
      - timeout
      - 60s
      - php
      - artisan
      - config:cache
      - --no-ansi
  args:
    chdir: "{{ librenms_install_dir }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: false

- name: Verify LibreNMS syslog ingestion is active on this node
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:get
      - enable_syslog
  become: true
  become_user: "{{ librenms_user }}"
  register: librenms_syslog_enabled_verify
  changed_when: false
  failed_when: (librenms_syslog_enabled_verify.stdout | default('') | trim | lower) != 'true'

- name: Enable and start rsyslog
  service:
    name: "{{ librenms_syslog_service_name }}"
    state: started
    enabled: true
