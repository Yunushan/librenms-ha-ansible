---
- name: Validate LibreNMS syslog backend
  assert:
    that:
      - librenms_syslog_backend == 'rsyslog'
      - librenms_syslog_listen_udp | bool or librenms_syslog_listen_tcp | bool
      - librenms_syslog_host_property in ['fromhost', 'fromhost-ip', 'hostname']
    fail_msg: "Only the rsyslog backend is currently supported for LibreNMS syslog ingestion."

- name: Refresh apt cache for syslog receiver packages
  apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install LibreNMS syslog receiver packages
  package:
    name: "{{ librenms_syslog_packages }}"
    state: present

- name: Gather service facts for syslog firewall detection
  service_facts:
  when: librenms_syslog_manage_firewall | bool

- name: Detect UFW availability on Debian syslog receivers
  command:
    argv:
      - ufw
      - status
  register: librenms_syslog_ufw_status
  changed_when: false
  failed_when: false
  when:
    - librenms_syslog_manage_firewall | bool
    - ansible_os_family == 'Debian'

- name: Allow LibreNMS syslog UDP port with UFW when available
  community.general.ufw:
    rule: allow
    port: "{{ librenms_syslog_udp_port }}"
    proto: udp
  when:
    - librenms_syslog_manage_firewall | bool
    - librenms_syslog_listen_udp | bool
    - ansible_os_family == 'Debian'
    - librenms_syslog_ufw_status is defined
    - librenms_syslog_ufw_status.rc == 0

- name: Allow LibreNMS syslog TCP port with UFW when available
  community.general.ufw:
    rule: allow
    port: "{{ librenms_syslog_tcp_port }}"
    proto: tcp
  when:
    - librenms_syslog_manage_firewall | bool
    - librenms_syslog_listen_tcp | bool
    - ansible_os_family == 'Debian'
    - librenms_syslog_ufw_status is defined
    - librenms_syslog_ufw_status.rc == 0

- name: Allow LibreNMS syslog UDP port with firewalld when active
  ansible.posix.firewalld:
    port: "{{ librenms_syslog_udp_port }}/udp"
    permanent: true
    immediate: true
    state: enabled
  when:
    - librenms_syslog_manage_firewall | bool
    - librenms_syslog_listen_udp | bool
    - ansible_os_family == 'RedHat'
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'

- name: Allow LibreNMS syslog TCP port with firewalld when active
  ansible.posix.firewalld:
    port: "{{ librenms_syslog_tcp_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when:
    - librenms_syslog_manage_firewall | bool
    - librenms_syslog_listen_tcp | bool
    - ansible_os_family == 'RedHat'
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'

- name: Check rsyslog runtime user
  getent:
    database: passwd
    key: "{{ librenms_syslog_runtime_user }}"
  register: librenms_syslog_runtime_user_getent
  failed_when: false
  changed_when: false
  when: librenms_syslog_runtime_user | length > 0

- name: Grant rsyslog runtime user access to LibreNMS files
  user:
    name: "{{ librenms_syslog_runtime_user }}"
    groups: "{{ librenms_group }}"
    append: true
  notify: Restart rsyslog
  when:
    - librenms_syslog_manage_runtime_user_group | bool
    - librenms_syslog_runtime_user | length > 0
    - (librenms_syslog_runtime_user_getent.ansible_facts.getent_passwd | default({})) | length > 0

- name: Check LibreNMS syslog sink exists
  stat:
    path: "{{ librenms_install_dir }}/syslog.php"
  register: librenms_syslog_sink

- name: Check LibreNMS syslog PHP binary exists
  stat:
    path: "{{ librenms_syslog_php_binary }}"
  register: librenms_syslog_php_binary_stat

- name: Fail when LibreNMS syslog sink is missing
  fail:
    msg: >-
      {{ librenms_install_dir }}/syslog.php does not exist.
      Run the LibreNMS application deployment before enabling syslog ingestion.
  when: not (librenms_syslog_sink.stat.exists | default(false))

- name: Fail when LibreNMS syslog PHP binary is missing
  fail:
    msg: >-
      {{ librenms_syslog_php_binary }} does not exist.
      Set librenms_syslog_php_binary to the PHP CLI path on this host.
  when: not (librenms_syslog_php_binary_stat.stat.exists | default(false))

- name: Check rsyslog AppArmor profile exists
  stat:
    path: "{{ librenms_syslog_apparmor_profile_path }}"
  register: librenms_syslog_apparmor_profile
  when: librenms_syslog_manage_apparmor | bool

- name: Ensure rsyslog AppArmor local override directory exists
  file:
    path: "{{ librenms_syslog_apparmor_local_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - librenms_syslog_manage_apparmor | bool
    - librenms_syslog_apparmor_profile.stat.exists | default(false)

- name: Permit rsyslog omprog to execute LibreNMS syslog sink
  blockinfile:
    path: "{{ librenms_syslog_apparmor_local_path }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED LIBRENMS SYSLOG"
    block: |
      {{ librenms_syslog_php_binary }} ix,
      /etc/alternatives/php ix,
      /usr/bin/php* ix,
      /usr/bin/stty ix,
      {{ librenms_install_dir }}/syslog.php r,
      {{ librenms_install_dir }}/** r,
      {{ librenms_install_dir }}/logs/ rw,
      {{ librenms_install_dir }}/logs/** rwkl,
      {{ librenms_install_dir }}/storage/ rw,
      {{ librenms_install_dir }}/storage/** rwkl,
      {{ librenms_install_dir }}/storage/framework/cache/** rwkl,
      {{ librenms_install_dir }}/bootstrap/cache/** rwkl,
      /etc/php/** r,
      /etc/snmp/** r,
      /usr/share/php/** r,
      /usr/share/snmp/** r,
      /usr/lib/php/** mr,
  register: librenms_syslog_apparmor_local
  when:
    - librenms_syslog_manage_apparmor | bool
    - librenms_syslog_apparmor_profile.stat.exists | default(false)

- name: Reload rsyslog AppArmor profile
  command:
    argv:
      - apparmor_parser
      - -r
      - "{{ librenms_syslog_apparmor_profile_path }}"
  changed_when: librenms_syslog_apparmor_local.changed
  notify: Restart rsyslog
  when:
    - librenms_syslog_manage_apparmor | bool
    - librenms_syslog_apparmor_profile.stat.exists | default(false)
    - librenms_syslog_apparmor_local.changed

- name: Deploy rsyslog LibreNMS receiver configuration
  template:
    src: rsyslog-librenms.conf.j2
    dest: "{{ librenms_syslog_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Validate rsyslog configuration
  command:
    argv:
      - rsyslogd
      - -N1
  changed_when: false

- name: Enable LibreNMS syslog ingestion
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:set
      - enable_syslog
      - "true"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: true
  when: inventory_hostname == (groups.get('librenms_primary', groups.get('librenms_nodes', [inventory_hostname])) | first)

- name: Configure LibreNMS syslog retention
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:set
      - syslog_purge
      - "{{ librenms_syslog_purge_days }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: true
  when:
    - (librenms_syslog_purge_days | int) > 0
    - inventory_hostname == (groups.get('librenms_primary', groups.get('librenms_nodes', [inventory_hostname])) | first)

- name: Enable LibreNMS syslog hooks
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:set
      - enable_syslog_hooks
      - "{{ librenms_syslog_enable_hooks | bool | ternary('true', 'false') }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: true
  when:
    - librenms_syslog_enable_hooks | bool
    - inventory_hostname == (groups.get('librenms_primary', groups.get('librenms_nodes', [inventory_hostname])) | first)

- name: Configure LibreNMS syslog hostname translations
  command:
    argv:
      - "{{ librenms_install_dir }}/lnms"
      - config:set
      - syslog_xlate
      - "{{ librenms_syslog_xlate | to_json }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: true
  when:
    - (librenms_syslog_xlate | length) > 0
    - inventory_hostname == (groups.get('librenms_primary', groups.get('librenms_nodes', [inventory_hostname])) | first)

- name: Discover LibreNMS bootstrap cache files after syslog config
  find:
    paths: "{{ librenms_install_dir }}/bootstrap/cache"
    file_type: file
    excludes: ".gitignore"
  register: librenms_syslog_bootstrap_cache_files

- name: Remove LibreNMS bootstrap cache files after syslog config
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ librenms_syslog_bootstrap_cache_files.files | default([]) }}"

- name: Rebuild LibreNMS config cache after syslog config
  command:
    argv:
      - timeout
      - 60s
      - php
      - artisan
      - config:cache
      - --no-ansi
  args:
    chdir: "{{ librenms_install_dir }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: false

- name: Enable and start rsyslog
  service:
    name: "{{ librenms_syslog_service_name }}"
    state: started
    enabled: true
