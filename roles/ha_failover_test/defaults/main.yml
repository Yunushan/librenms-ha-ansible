---
librenms_failover_test_confirm: false
librenms_failover_test_cases:
  - web_backend
  - keepalived_vip

librenms_failover_test_web_backend_host: ""
librenms_failover_test_haproxy_host: ""
librenms_failover_test_dispatcher_host: ""
librenms_failover_test_redis_query_host: ""
librenms_failover_test_galera_host: ""
librenms_failover_test_probe_delegate: ""
librenms_failover_test_restore_services: true

librenms_failover_test_http_path: "{{ librenms_app_probe_path }}"
librenms_failover_test_http_statuses: "{{ librenms_app_probe_success_statuses }}"
librenms_failover_test_http_timeout: "{{ librenms_app_probe_timeout }}"
librenms_failover_test_http_follow_redirects: "{{ librenms_app_probe_follow_redirects }}"
librenms_failover_test_probe_retries: 20
librenms_failover_test_probe_delay: 2
librenms_failover_test_validate_certs: "{{ librenms_vip_app_probe_validate_certs }}"

librenms_failover_test_wait_after_stop: 2
librenms_failover_test_wait_after_restore: 3
librenms_failover_test_redis_failover_retries: 20
librenms_failover_test_redis_failover_delay: 3
librenms_failover_test_galera_recovery_retries: 20
librenms_failover_test_galera_recovery_delay: 3
librenms_failover_test_max_recovery_seconds: 900

# A drill only passes after the restored cluster can serve LibreNMS again.
librenms_failover_test_post_recovery_validate: true

# Store compact, secret-free records of successful drills on the controller.
# Failed drill details remain in the Ansible or AWX job output.
librenms_failover_test_write_evidence: true
librenms_failover_test_evidence_dir: /var/lib/librenms-ha/failover-evidence
librenms_failover_test_evidence_retention_days: 90
librenms_failover_test_evidence_integrity_enabled: true
