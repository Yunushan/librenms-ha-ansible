---
- name: Discover LibreNMS bootstrap cache files
  find:
    paths: "{{ librenms_install_dir }}/bootstrap/cache"
    file_type: file
    excludes: ".gitignore"
  register: librenms_handler_bootstrap_cache_files
  listen: Clear LibreNMS bootstrap cache

- name: Remove LibreNMS bootstrap cache files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ librenms_handler_bootstrap_cache_files.files | default([]) }}"
  listen: Clear LibreNMS bootstrap cache

- name: Rebuild LibreNMS config cache
  command:
    argv:
      - timeout
      - 60s
      - php
      - artisan
      - config:cache
      - --no-ansi
  args:
    chdir: "{{ librenms_install_dir }}"
  become: true
  become_user: "{{ librenms_user }}"
  changed_when: false
  listen: Clear LibreNMS bootstrap cache
  when:
    - librenms_apply_post_bootstrap_config | bool

- name: Validate PHP-FPM configuration before restart
  ansible.builtin.command:
    argv:
      - "{{ librenms_php_fpm_binary_effective }}"
      - -t
  register: librenms_php_fpm_handler_config_test
  changed_when: false
  listen: Restart PHP-FPM

- name: Reset failed PHP-FPM unit state before restart
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - "{{ librenms_php_fpm_service_effective }}"
  changed_when: false
  failed_when: false
  listen: Restart PHP-FPM
  when:
    - ansible_facts.service_mgr == 'systemd'

- name: Restart PHP-FPM through systemd
  ansible.builtin.command:
    argv:
      - systemctl
      - restart
      - "{{ librenms_php_fpm_service_effective }}"
  register: librenms_php_fpm_handler_restart
  changed_when: librenms_php_fpm_handler_restart.rc == 0
  failed_when: false
  listen: Restart PHP-FPM
  when:
    - ansible_facts.service_mgr == 'systemd'

- name: Restart PHP-FPM without systemd
  ansible.builtin.service:
    name: "{{ librenms_php_fpm_service_effective }}"
    state: restarted
  listen: Restart PHP-FPM
  when:
    - ansible_facts.service_mgr != 'systemd'

- name: Capture PHP-FPM status after failed restart
  ansible.builtin.command:
    argv:
      - systemctl
      - status
      - "{{ librenms_php_fpm_service_effective }}"
      - --no-pager
      - -l
  register: librenms_php_fpm_handler_status
  changed_when: false
  failed_when: false
  listen: Restart PHP-FPM
  when:
    - ansible_facts.service_mgr == 'systemd'
    - librenms_php_fpm_handler_restart.rc | default(0) != 0

- name: Capture PHP-FPM journal after failed restart
  ansible.builtin.command:
    argv:
      - journalctl
      - -u
      - "{{ librenms_php_fpm_service_effective }}"
      - -n
      - "100"
      - --no-pager
  register: librenms_php_fpm_handler_journal
  changed_when: false
  failed_when: false
  listen: Restart PHP-FPM
  when:
    - ansible_facts.service_mgr == 'systemd'
    - librenms_php_fpm_handler_restart.rc | default(0) != 0

- name: Capture LibreNMS PHP-FPM socket owner after failed restart
  ansible.builtin.shell: |
    set -o pipefail
    ss -xlpn | grep -F -- {{ librenms_php_fpm_socket | quote }} || true
  args:
    executable: /bin/bash
  register: librenms_php_fpm_handler_socket_owner
  changed_when: false
  failed_when: false
  listen: Restart PHP-FPM
  when:
    - ansible_facts.service_mgr == 'systemd'
    - librenms_php_fpm_handler_restart.rc | default(0) != 0

- name: Fail with PHP-FPM restart diagnostics
  ansible.builtin.fail:
    msg: |-
      Failed to restart {{ librenms_php_fpm_service_effective }} on {{ inventory_hostname }}.

      PHP-FPM configuration test:
      {{ librenms_php_fpm_handler_config_test.stdout | default('') }}
      {{ librenms_php_fpm_handler_config_test.stderr | default('') }}

      systemctl restart:
      {{ librenms_php_fpm_handler_restart.stdout | default('') }}
      {{ librenms_php_fpm_handler_restart.stderr | default('') }}

      systemctl status:
      {{ librenms_php_fpm_handler_status.stdout | default('') }}
      {{ librenms_php_fpm_handler_status.stderr | default('') }}

      recent journal:
      {{ librenms_php_fpm_handler_journal.stdout | default('') }}

      listener for {{ librenms_php_fpm_socket }}:
      {{ librenms_php_fpm_handler_socket_owner.stdout | default('none') }}
  listen: Restart PHP-FPM
  when:
    - ansible_facts.service_mgr == 'systemd'
    - librenms_php_fpm_handler_restart.rc | default(0) != 0

- name: Validate nginx configuration before restart
  command:
    argv:
      - nginx
      - -t
  changed_when: false
  listen: Restart nginx

- name: Restart nginx
  service:
    name: "{{ librenms_nginx_service_name }}"
    state: restarted

- name: Restart rrdcached
  service:
    name: "{{ librenms_rrdcached_service_name }}"
    state: restarted

- name: Restart LibreNMS dispatcher service
  command:
    argv:
      - systemctl
      - restart
      - librenms.service
  register: librenms_dispatcher_restart
  retries: 5
  delay: 3
  until: librenms_dispatcher_restart.rc == 0
  listen: Restart LibreNMS dispatcher
  when:
    - librenms_manage_dispatcher | bool
    - ansible_facts.service_mgr == 'systemd'
    - librenms_bootstrap_completed_effective | bool

- name: Wait for LibreNMS dispatcher service after restart
  command:
    argv:
      - systemctl
      - is-active
      - librenms.service
  register: librenms_dispatcher_restart_active
  changed_when: false
  retries: 10
  delay: 3
  until: librenms_dispatcher_restart_active.stdout == 'active'
  listen: Restart LibreNMS dispatcher
  when:
    - librenms_manage_dispatcher | bool
    - ansible_facts.service_mgr == 'systemd'
    - librenms_bootstrap_completed_effective | bool

- name: Restart LibreNMS scheduler timer
  service:
    name: librenms-scheduler.timer
    state: restarted
    enabled: true
  when:
    - librenms_manage_scheduler | bool
    - ansible_facts.service_mgr == 'systemd'
    - librenms_bootstrap_completed_effective | bool

- name: Restart LibreNMS daily maintenance timer
  service:
    name: librenms-daily.timer
    state: restarted
    enabled: true
  when:
    - librenms_manage_daily_maintenance | bool
    - ansible_facts.service_mgr == 'systemd'
    - librenms_bootstrap_completed_effective | bool

- name: Restart LibreNMS backup timers
  service:
    name: "librenms-backup-{{ item.name }}.timer"
    state: restarted
    enabled: true
  loop:
    - name: daily
      enabled: "{{ librenms_backup_daily_enabled }}"
    - name: weekly
      enabled: "{{ librenms_backup_weekly_enabled }}"
  when:
    - librenms_manage_scheduled_backups | bool
    - item.enabled | bool
    - ansible_facts.service_mgr == 'systemd'
    - librenms_bootstrap_completed_effective | bool
    - inventory_hostname == librenms_backup_scheduled_host
