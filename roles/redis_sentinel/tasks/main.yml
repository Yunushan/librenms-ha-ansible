---
- name: Install Redis packages
  package:
    name: "{{ librenms_redis_packages }}"
    state: present
  when:
    - librenms_redis_mode in ['local', 'sentinel', 'external']
    - >-
      not (
        ansible_facts.os_family == 'RedHat'
        and ansible_facts.distribution_major_version | int == 8
        and (librenms_rhel8_package_cli_fallback | default(true) | bool)
      )

- name: Install Redis packages through native DNF on RHEL 8
  ansible.builtin.command:
    argv: >-
      {{ ['dnf', '-y', 'install'] + librenms_redis_packages }}
  register: librenms_rhel8_redis_package_install
  changed_when: >-
    'Nothing to do' not in
    ((librenms_rhel8_redis_package_install.stdout | default('')) ~
    (librenms_rhel8_redis_package_install.stderr | default('')))
  when:
    - librenms_redis_mode in ['local', 'sentinel', 'external']
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution_major_version | int == 8
    - librenms_rhel8_package_cli_fallback | default(true) | bool

- name: Verify Redis or Valkey runtime mapping for Sentinel
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ librenms_redis_server_binary }}"
    - "{{ librenms_redis_cli_binary }}"
  register: librenms_redis_sentinel_runtime_paths
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Verify native Redis or Valkey Sentinel unit exists
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --value
      - "{{ librenms_redis_sentinel_native_service_name }}.service"
  register: librenms_redis_sentinel_native_unit
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Determine whether the native Sentinel unit is usable
  ansible.builtin.set_fact:
    librenms_redis_sentinel_native_service_available: >-
      {{
        (librenms_redis_sentinel_native_unit.rc | default(1) | int) == 0
        and (librenms_redis_sentinel_native_unit.stdout | default('') | trim) == 'loaded'
      }}
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Select the native or project-managed Sentinel service
  ansible.builtin.set_fact:
    librenms_redis_sentinel_service_name_effective: >-
      {{
        librenms_redis_sentinel_native_service_name
        if librenms_redis_sentinel_native_service_available | bool
        else librenms_redis_sentinel_custom_service_name
      }}
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Fail early when Redis or Valkey Sentinel mapping is incomplete
  ansible.builtin.assert:
    that:
      - >-
        librenms_redis_sentinel_runtime_paths.results
        | selectattr('stat.exists', 'equalto', true)
        | list
        | length == 2
      - >-
        librenms_redis_sentinel_native_service_available | bool
        or librenms_redis_sentinel_allow_custom_service_fallback | bool
      - librenms_redis_sentinel_service_name_effective | length > 0
    fail_msg: >-
      The {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} Sentinel
      mapping is incomplete. Expected server={{ librenms_redis_server_binary }},
      cli={{ librenms_redis_cli_binary }}, service={{
      librenms_redis_sentinel_native_service_name }}. The native unit was
      {{ 'found' if librenms_redis_sentinel_native_service_available | bool else 'not found' }}.
      A project-managed fallback is {{
      'enabled' if librenms_redis_sentinel_allow_custom_service_fallback | bool else 'disabled' }}.
      Confirm the Redis/Valkey binaries and service policy for this exact OS.
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Ensure Redis config parent directory exists when needed
  file:
    path: "{{ librenms_redis_conf_path_effective | dirname }}"
    state: directory
    owner: "{{ librenms_redis_runtime_user if librenms_redis_mode == 'sentinel' else 'root' }}"
    group: "{{ librenms_redis_runtime_group if librenms_redis_mode == 'sentinel' else 'root' }}"
    mode: "{{ '0750' if librenms_redis_mode == 'sentinel' else '0755' }}"

- name: Ensure custom config directory exists
  file:
    path: /etc/librenms
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Redis data directory exists
  file:
    path: "{{ librenms_redis_data_dir }}"
    state: directory
    owner: "{{ librenms_redis_runtime_user }}"
    group: "{{ librenms_redis_runtime_group }}"
    mode: "0750"
  when:
    - librenms_redis_mode in ['local', 'sentinel']

- name: Ensure Redis data directory contents are owned correctly
  file:
    path: "{{ librenms_redis_data_dir }}"
    state: directory
    owner: "{{ librenms_redis_runtime_user }}"
    group: "{{ librenms_redis_runtime_group }}"
    recurse: true
  when:
    - librenms_redis_mode in ['local', 'sentinel']

- name: Enable memory overcommit for Redis
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    reload: true
  when:
    - librenms_redis_mode in ['local', 'sentinel']
    - librenms_redis_manage_overcommit_memory | bool

- name: Check Redis state before disabled persistence cleanup
  systemd:
    name: "{{ librenms_redis_service_name }}"
  register: librenms_redis_state_before_persistence_cleanup
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_mode in ['local', 'sentinel']
    - ansible_facts.service_mgr == 'systemd'
    - not (librenms_redis_persistence_enabled | bool)
    - librenms_redis_remove_persistence_files_when_disabled | bool

- name: Kill Redis while it is loading stale persistence data  # noqa: command-instead-of-module
  command: "systemctl kill -s SIGKILL {{ librenms_redis_service_name }}"
  register: librenms_redis_kill_for_persistence_cleanup
  changed_when: librenms_redis_kill_for_persistence_cleanup.rc == 0
  failed_when: false
  when:
    - librenms_redis_mode in ['local', 'sentinel']
    - ansible_facts.service_mgr == 'systemd'
    - not (librenms_redis_persistence_enabled | bool)
    - librenms_redis_remove_persistence_files_when_disabled | bool
    - >-
      (librenms_redis_state_before_persistence_cleanup.status.ActiveState
      | default('')) in ['activating', 'deactivating']

- name: Reset Redis failed state after persistence cleanup kill  # noqa: command-instead-of-module
  command: "systemctl reset-failed {{ librenms_redis_service_name }}"
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_kill_for_persistence_cleanup is defined
    - librenms_redis_kill_for_persistence_cleanup is changed

- name: Stop Redis after persistence cleanup kill
  service:
    name: "{{ librenms_redis_service_name }}"
    state: stopped
  failed_when: false
  when:
    - librenms_redis_kill_for_persistence_cleanup is defined
    - librenms_redis_kill_for_persistence_cleanup is changed

- name: Wait for Redis loading process to stop before persistence cleanup
  systemd:
    name: "{{ librenms_redis_service_name }}"
  register: librenms_redis_state_before_stale_file_removal
  changed_when: false
  failed_when: false
  retries: 6
  delay: 2
  until: >-
    (librenms_redis_state_before_stale_file_removal.status.ActiveState
    | default('')) not in ['activating', 'deactivating']
  when:
    - librenms_redis_kill_for_persistence_cleanup is defined
    - librenms_redis_kill_for_persistence_cleanup is changed

- name: Find stale Redis persistence files when persistence is disabled
  find:
    paths: "{{ librenms_redis_data_dir }}"
    file_type: any
    patterns:
      - dump.rdb
      - appendonly.aof
      - appendonlydir
  register: librenms_redis_stale_persistence_files
  when:
    - librenms_redis_mode in ['local', 'sentinel']
    - not (librenms_redis_persistence_enabled | bool)
    - librenms_redis_remove_persistence_files_when_disabled | bool

- name: Remove stale Redis persistence files when persistence is disabled
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ librenms_redis_stale_persistence_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart Redis
  when:
    - librenms_redis_mode in ['local', 'sentinel']
    - not (librenms_redis_persistence_enabled | bool)
    - librenms_redis_remove_persistence_files_when_disabled | bool

- name: Ensure Redis Sentinel config parent directory exists for managed systemd service
  file:
    path: "{{ librenms_redis_sentinel_conf_path_effective | dirname }}"
    state: directory
    owner: "{{ librenms_redis_runtime_user }}"
    group: "{{ librenms_redis_runtime_group }}"
    mode: "0750"
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Deploy Redis server config
  template:
    src: redis.conf.j2
    dest: "{{ librenms_redis_conf_path_effective }}"
    owner: "{{ librenms_redis_runtime_user if librenms_redis_mode == 'sentinel' else 'root' }}"
    group: "{{ librenms_redis_runtime_group if librenms_redis_mode == 'sentinel' else 'root' }}"
    mode: "{{ '0640' if librenms_redis_mode == 'sentinel' else '0644' }}"
  notify: Restart Redis
  when: librenms_redis_mode in ['local', 'sentinel']

- name: Ensure Redis server systemd override directory exists
  file:
    path: "{{ librenms_redis_systemd_override_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Deploy Redis server systemd override for Sentinel writable config
  template:
    src: librenms-redis-server-override.conf.j2
    dest: "{{ librenms_redis_systemd_override_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Redis
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Remove Redis server systemd override when Sentinel mode is disabled
  file:
    path: "{{ librenms_redis_systemd_override_path }}"
    state: absent
  notify: Restart Redis
  when:
    - librenms_redis_mode != 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Reload systemd after Redis server unit changes
  systemd:
    daemon_reload: true
  when:
    - librenms_redis_mode in ['local', 'sentinel']
    - ansible_facts.service_mgr == 'systemd'

- name: Check Redis server systemd state before service management
  systemd:
    name: "{{ librenms_redis_service_name }}"
  register: librenms_redis_server_systemd_state
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_mode in ['local', 'sentinel']
    - ansible_facts.service_mgr == 'systemd'

- name: Clear Redis server stuck stop job before service management  # noqa: command-instead-of-module
  command: "systemctl kill -s SIGKILL {{ librenms_redis_service_name }}"
  register: librenms_redis_clear_stuck_stop_job_result
  changed_when: librenms_redis_clear_stuck_stop_job_result.rc == 0
  failed_when: false
  when:
    - librenms_redis_mode in ['local', 'sentinel']
    - ansible_facts.service_mgr == 'systemd'
    - librenms_redis_clear_stuck_stop_job | bool
    - (librenms_redis_server_systemd_state.status.ActiveState | default('')) == 'deactivating'
    - (librenms_redis_server_systemd_state.status.SubState | default('')) == 'stop-sigterm'

- name: Reset Redis server failed state after clearing stuck stop job  # noqa: command-instead-of-module
  command: "systemctl reset-failed {{ librenms_redis_service_name }}"
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_clear_stuck_stop_job_result is defined
    - librenms_redis_clear_stuck_stop_job_result is changed

- name: Wait for Redis server stuck stop job to clear
  systemd:
    name: "{{ librenms_redis_service_name }}"
  register: librenms_redis_server_state_after_clear
  changed_when: false
  failed_when: false
  retries: 6
  delay: 2
  until: >-
    (librenms_redis_server_state_after_clear.status.ActiveState | default(''))
    != 'deactivating'
  when:
    - librenms_redis_clear_stuck_stop_job_result is defined
    - librenms_redis_clear_stuck_stop_job_result is changed

- name: Enable and start Redis server
  when: librenms_redis_mode in ['local', 'sentinel']
  block:
    - name: Enable and start Redis server service
      service:
        name: "{{ librenms_redis_service_name }}"
        state: started
        enabled: true
  rescue:
    - name: Capture Redis service status during enable/start
      command: "systemctl status {{ librenms_redis_service_name }} --no-pager -l"
      register: redis_start_service_status
      changed_when: false
      failed_when: false

    - name: Capture Redis service journal during enable/start
      command: "journalctl -u {{ librenms_redis_service_name }} -n 50 --no-pager"
      register: redis_start_service_journal
      changed_when: false
      failed_when: false

    - name: Fail with Redis enable/start diagnostics
      fail:
        msg: |-
          Failed to enable/start {{ librenms_redis_service_name }}.

          systemctl status:
          {{ redis_start_service_status.stdout | default('') }}
          {{ redis_start_service_status.stderr | default('') }}

          journalctl:
          {{ redis_start_service_journal.stdout | default('') }}
          {{ redis_start_service_journal.stderr | default('') }}

- name: Apply Redis config changes before configuring Sentinel
  meta: flush_handlers
  when: librenms_redis_mode == 'sentinel'

- name: Ensure Redis server dependency is started before configuring Sentinel
  service:
    name: "{{ librenms_redis_service_name }}"
    state: started
    enabled: true
  register: librenms_redis_server_dependency_start
  failed_when: false
  when: librenms_redis_mode == 'sentinel'

- name: Wait for Redis server dependency before configuring Sentinel
  systemd:
    name: "{{ librenms_redis_service_name }}"
  register: librenms_redis_server_dependency_state
  changed_when: false
  failed_when: false
  retries: 6
  delay: 2
  until: >-
    (librenms_redis_server_dependency_state.status.ActiveState | default(''))
    == 'active'
  when: librenms_redis_mode == 'sentinel'

- name: Capture Redis server dependency status before Sentinel
  command: "systemctl status {{ librenms_redis_service_name }} --no-pager -l"
  register: librenms_redis_server_dependency_status
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - >-
      (librenms_redis_server_dependency_state.status.ActiveState
      | default('')) != 'active'

- name: Capture Redis server dependency journal before Sentinel
  command: "journalctl -u {{ librenms_redis_service_name }} -n 50 --no-pager"
  register: librenms_redis_server_dependency_journal
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - >-
      (librenms_redis_server_dependency_state.status.ActiveState
      | default('')) != 'active'

- name: Fail when Redis server dependency is not active before Sentinel
  fail:
    msg: |-
      Cannot configure Redis Sentinel because {{ librenms_redis_service_name }}
      is not active.

      systemctl status:
      {{ librenms_redis_server_dependency_status.stdout | default('') }}
      {{ librenms_redis_server_dependency_status.stderr | default('') }}

      journalctl:
      {{ librenms_redis_server_dependency_journal.stdout | default('') }}
      {{ librenms_redis_server_dependency_journal.stderr | default('') }}
  when:
    - librenms_redis_mode == 'sentinel'
    - >-
      (librenms_redis_server_dependency_state.status.ActiveState
      | default('')) != 'active'

- name: Query local Redis replication state
  no_log: true
  command: >-
    {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 6379 INFO replication
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_password }}"
  register: librenms_redis_replication_state
  changed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - librenms_redis_sentinel_enforce_configured_master | bool

- name: Promote configured Redis master when needed
  no_log: true
  command: >-
    {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 6379 REPLICAOF NO ONE
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_password }}"
  register: librenms_redis_promote_configured_master
  changed_when: (librenms_redis_promote_configured_master.stdout | default('') | trim) == 'OK'
  when:
    - librenms_redis_mode == 'sentinel'
    - librenms_redis_sentinel_enforce_configured_master | bool
    - inventory_hostname == librenms_redis_master_host
    - (librenms_redis_replication_state.stdout | default('')) is not search('role:master')

- name: Point Redis replicas at the configured master
  no_log: true
  command: >-
    {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 6379
    REPLICAOF {{ hostvars[librenms_redis_master_host].ansible_host | default(librenms_redis_master_host) | quote }} 6379
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_password }}"
  register: librenms_redis_follow_configured_master
  changed_when: (librenms_redis_follow_configured_master.stdout | default('') | trim) == 'OK'
  when:
    - librenms_redis_mode == 'sentinel'
    - librenms_redis_sentinel_enforce_configured_master | bool
    - inventory_hostname != librenms_redis_master_host
    - >-
      (librenms_redis_replication_state.stdout | default('')) is not search('role:slave')
      or
      (librenms_redis_replication_state.stdout | default('')) is not search(
        'master_host:' ~ (hostvars[librenms_redis_master_host].ansible_host | default(librenms_redis_master_host))
      )

- name: Verify Redis server can persist replication configuration changes
  no_log: true
  command: >-
    {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 6379 CONFIG REWRITE
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_password }}"
  register: librenms_redis_config_rewrite
  changed_when: false
  failed_when: false
  retries: "{{ librenms_redis_config_rewrite_retries | int }}"
  delay: "{{ librenms_redis_config_rewrite_delay | int }}"
  until:
    - librenms_redis_config_rewrite.rc == 0
    - (librenms_redis_config_rewrite.stdout | default('') | trim) == 'OK'
  when: librenms_redis_mode == 'sentinel'

- name: Deploy Redis Sentinel config
  template:
    src: sentinel.conf.j2
    dest: "{{ librenms_redis_sentinel_conf_path_effective }}"
    owner: >-
      {{
        librenms_redis_runtime_user
        if ansible_facts.service_mgr == 'systemd'
        else ('redis' if ansible_facts.os_family == 'Debian' else 'root')
      }}
    group: >-
      {{
        librenms_redis_runtime_group
        if ansible_facts.service_mgr == 'systemd'
        else ('redis' if ansible_facts.os_family == 'Debian' else 'root')
      }}
    mode: "0640"
  notify: Restart Redis Sentinel
  when: librenms_redis_mode == 'sentinel'

- name: Ensure Redis Sentinel native systemd override directory exists
  file:
    path: "{{ librenms_redis_sentinel_systemd_override_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'
    - librenms_redis_sentinel_native_service_available | bool

- name: Deploy Redis Sentinel native systemd override
  template:
    src: librenms-redis-sentinel-override.conf.j2
    dest: "{{ librenms_redis_sentinel_systemd_override_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Redis Sentinel
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'
    - librenms_redis_sentinel_native_service_available | bool

- name: Stop legacy LibreNMS Redis Sentinel custom service before native takeover
  ansible.builtin.service:
    name: "{{ librenms_redis_sentinel_custom_service_name }}"
    state: stopped
    enabled: false
  register: librenms_redis_sentinel_custom_service_stop
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'
    - librenms_redis_sentinel_native_service_available | bool

- name: Wait for legacy custom Sentinel listener to stop before native takeover
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 26379
    state: stopped
    timeout: "{{ librenms_redis_sentinel_takeover_timeout | int }}"
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'
    - librenms_redis_sentinel_native_service_available | bool
    - librenms_redis_sentinel_custom_service_stop is changed

- name: Remove legacy LibreNMS Redis Sentinel custom unit
  file:
    path: "/etc/systemd/system/{{ librenms_redis_sentinel_custom_service_name }}.service"
    state: absent
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'
    - librenms_redis_sentinel_native_service_available | bool

- name: Deploy project-managed Redis Sentinel unit when native unit is unavailable
  ansible.builtin.template:
    src: librenms-redis-sentinel.service.j2
    dest: "/etc/systemd/system/{{ librenms_redis_sentinel_custom_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Redis Sentinel
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'
    - not (librenms_redis_sentinel_native_service_available | bool)

- name: Stop native Redis Sentinel service before project-managed takeover
  ansible.builtin.service:
    name: "{{ librenms_redis_sentinel_native_service_name }}"
    state: stopped
    enabled: false
  register: librenms_redis_sentinel_native_service_stop
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'
    - not (librenms_redis_sentinel_native_service_available | bool)

- name: Wait for native Sentinel listener to stop before project-managed takeover
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 26379
    state: stopped
    timeout: "{{ librenms_redis_sentinel_takeover_timeout | int }}"
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'
    - not (librenms_redis_sentinel_native_service_available | bool)
    - librenms_redis_sentinel_native_service_stop is changed

- name: Reload systemd after sentinel unit changes
  systemd:
    daemon_reload: true
  when:
    - librenms_redis_mode == 'sentinel'
    - ansible_facts.service_mgr == 'systemd'

- name: Enable and start Redis Sentinel service
  when: librenms_redis_mode == 'sentinel'
  block:
    - name: Enable and start Redis Sentinel managed service
      service:
        name: "{{ librenms_redis_sentinel_service_name_effective }}"
        state: started
        enabled: true
  rescue:
    - name: Capture Redis Sentinel status during enable/start
      command: "systemctl status {{ librenms_redis_sentinel_service_name_effective }} --no-pager -l"
      register: redis_sentinel_native_start_service_status
      changed_when: false
      failed_when: false

    - name: Capture Redis Sentinel journal during enable/start
      command: "journalctl -u {{ librenms_redis_sentinel_service_name_effective }} -n 50 --no-pager"
      register: redis_sentinel_native_start_service_journal
      changed_when: false
      failed_when: false

    - name: Fail with Redis Sentinel enable/start diagnostics
      fail:
        msg: |-
          Failed to enable/start {{ librenms_redis_sentinel_service_name_effective }}.

          systemctl status:
          {{ redis_sentinel_native_start_service_status.stdout | default('') }}
          {{ redis_sentinel_native_start_service_status.stderr | default('') }}

          journalctl:
          {{ redis_sentinel_native_start_service_journal.stdout | default('') }}
          {{ redis_sentinel_native_start_service_journal.stderr | default('') }}

- name: Apply Redis Sentinel config changes before validation
  meta: flush_handlers
  when: librenms_redis_mode == 'sentinel'

- name: Verify Redis Sentinel can persist configuration changes
  no_log: true
  command: >-
    {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 26379
    {% if librenms_redis_sentinel_username | length > 0 %}
    --user {{ librenms_redis_sentinel_username | quote }}
    {% endif %}
    SENTINEL FLUSHCONFIG
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
  register: librenms_redis_sentinel_flushconfig
  changed_when: false
  failed_when: false
  retries: "{{ librenms_redis_sentinel_flushconfig_retries | int }}"
  delay: "{{ librenms_redis_sentinel_flushconfig_delay | int }}"
  until:
    - librenms_redis_sentinel_flushconfig.rc == 0
    - (librenms_redis_sentinel_flushconfig.stdout | default('') | trim) == 'OK'
  when: librenms_redis_mode == 'sentinel'

- name: Reset Redis Sentinel state for the managed service
  no_log: true
  command: >-
    {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 26379
    {% if librenms_redis_sentinel_username | length > 0 %}
    --user {{ librenms_redis_sentinel_username | quote }}
    {% endif %}
    SENTINEL reset {{ librenms_redis_sentinel_service | quote }}
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
  register: librenms_redis_sentinel_reset
  changed_when: (librenms_redis_sentinel_reset.stdout | default('0') | int) > 0
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - librenms_redis_sentinel_enforce_configured_master | bool

- name: Query Redis Sentinel for the current master endpoint
  no_log: true
  command: >-
    {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 26379
    {% if librenms_redis_sentinel_username | length > 0 %}
    --user {{ librenms_redis_sentinel_username | quote }}
    {% endif %}
    SENTINEL get-master-addr-by-name {{ librenms_redis_sentinel_service | quote }}
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
  register: librenms_redis_sentinel_master_query
  changed_when: false
  failed_when: false
  retries: 12
  delay: 5
  until:
    - librenms_redis_sentinel_master_query.rc == 0
    - (librenms_redis_sentinel_master_query.stdout_lines | default([]) | length) >= 2
  when: librenms_redis_mode == 'sentinel'

- name: Set discovered Redis Sentinel master endpoint
  set_fact:
    librenms_redis_sentinel_master_host_effective: >-
      {{ (librenms_redis_sentinel_master_query.stdout_lines | default([]))[0] | default('') }}
    librenms_redis_sentinel_master_port_effective: >-
      {{ (librenms_redis_sentinel_master_query.stdout_lines | default([]))[1] | default('6379') }}
  when: librenms_redis_mode == 'sentinel'

- name: Verify Redis Sentinel discovered a master endpoint
  assert:
    that:
      - librenms_redis_sentinel_master_host_effective | length > 0
      - librenms_redis_sentinel_master_port_effective | string | length > 0
    fail_msg: >-
      Redis Sentinel did not return a master endpoint for
      {{ librenms_redis_sentinel_service }} on {{ inventory_hostname }}.
  when: librenms_redis_mode == 'sentinel'

- name: Probe Redis Sentinel reported master accepts cache writes
  no_log: true
  shell: |-
    set -euo pipefail

    attempts={{ librenms_redis_sentinel_write_check_retries | int }}
    delay={{ librenms_redis_sentinel_write_check_delay | int }}
    attempt=1

    while [ "${attempt}" -le "${attempts}" ]; do
      result=$(
        {{ librenms_redis_cli_binary }} \
          -h {{ librenms_redis_sentinel_master_host_effective | quote }} \
          -p {{ librenms_redis_sentinel_master_port_effective | quote }} \
        {% if librenms_redis_username | length > 0 %}
          --user {{ librenms_redis_username | quote }} \
        {% endif %}
          SET librenms:sentinel-write-check {{ inventory_hostname | quote }} EX 30 \
          2>/dev/null || true
      )

      if [ "${result}" = "OK" ]; then
        exit 0
      fi

      if [ "${attempt}" -lt "${attempts}" ]; then
        sleep "${delay}"
      fi
      attempt=$((attempt + 1))
    done

    exit 1
  args:
    executable: /bin/bash
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_password }}"
  register: librenms_redis_sentinel_write_check
  changed_when: false
  failed_when: false
  when: librenms_redis_mode == 'sentinel'

- name: Confirm Redis Sentinel writable master
  debug:
    msg: >-
      Redis Sentinel {{ librenms_redis_sentinel_service }} reports writable
      master {{ librenms_redis_sentinel_master_host_effective }}:{{
      librenms_redis_sentinel_master_port_effective }} on {{ inventory_hostname }}.
  when:
    - librenms_redis_mode == 'sentinel'
    - (librenms_redis_sentinel_write_check.rc | default(1) | int) == 0

- name: Report Redis Sentinel local master is still converging
  debug:
    msg: >-
      Redis Sentinel {{ librenms_redis_sentinel_service }} on
      {{ inventory_hostname }} currently reports
      {{ librenms_redis_sentinel_master_host_effective }}:{{
      librenms_redis_sentinel_master_port_effective }}, but that endpoint is
      not writable yet. Continuing to quorum consensus validation.
  when:
    - librenms_redis_mode == 'sentinel'
    - (librenms_redis_sentinel_write_check.rc | default(0) | int) != 0

- name: Determine Redis Sentinel consensus query nodes
  set_fact:
    librenms_redis_sentinel_consensus_query_nodes: >-
      {{
        groups.get('librenms_redis', [])
        | difference(librenms_inactive_inventory_nodes | default([]))
        | list
      }}
    librenms_redis_sentinel_consensus_controller_candidates: >-
      {{
        (
          groups.get('librenms_redis', [])
          | difference(librenms_inactive_inventory_nodes | default([]))
          | intersect(ansible_play_hosts_all | default([]))
          | list
        )
        if (ansible_play_hosts_all | default([]) | length > 0)
        else []
      }}
    librenms_redis_sentinel_consensus_inactive_nodes: >-
      {{
        groups.get('librenms_redis', [])
        | intersect(librenms_inactive_inventory_nodes | default([]))
        | list
      }}
  when:
    - librenms_redis_mode == 'sentinel'

- name: Select Redis Sentinel consensus controller host
  set_fact:
    librenms_redis_sentinel_consensus_controller_host: >-
      {{
        (
          librenms_redis_sentinel_consensus_controller_candidates
          if (librenms_redis_sentinel_consensus_controller_candidates | length > 0)
          else librenms_redis_sentinel_consensus_query_nodes
        )
        | last
      }}
  when:
    - librenms_redis_mode == 'sentinel'

- name: Validate Redis Sentinel consensus query node quorum
  assert:
    that:
      - >-
        (librenms_redis_sentinel_consensus_query_nodes | length)
        >= (librenms_redis_quorum | int)
    fail_msg: >-
      Redis Sentinel quorum cannot be checked safely. The active query-node set
      contains {{ librenms_redis_sentinel_consensus_query_nodes | length }} node(s),
      but quorum requires {{ librenms_redis_quorum }}. Query nodes:
      {{ librenms_redis_sentinel_consensus_query_nodes | join(', ') }}.
      Inventory Redis nodes:
      {{ groups.get('librenms_redis', []) | join(', ') }}.
      Inactive/excluded Redis nodes:
      {{ librenms_redis_sentinel_consensus_inactive_nodes | default([]) | join(', ') | default('none', true) }}.
      Hosts no longer participating in this site play:
       {{
         librenms_redis_sentinel_consensus_query_nodes
         | difference(ansible_play_hosts_all | default([]))
         | join(', ')
         | default('none', true)
       }}.
      Check the librenms_redis inventory group and remove unintended entries
      from maintenance_nodes or decommission_nodes.
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Query reachable Redis Sentinels for a shared master endpoint
  no_log: true
  command: >-
    {{ librenms_redis_cli_binary }}
    -h 127.0.0.1
    -p 26379
    {% if librenms_redis_sentinel_username | length > 0 %}
    --user {{ librenms_redis_sentinel_username | quote }}
    {% endif %}
    SENTINEL get-master-addr-by-name {{ librenms_redis_sentinel_service | quote }}
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
  loop: "{{ librenms_redis_sentinel_consensus_query_nodes }}"
  delegate_to: "{{ item }}"
  ignore_unreachable: true
  register: librenms_redis_sentinel_consensus_queries
  changed_when: false
  failed_when: false
  until:
    - (librenms_redis_sentinel_consensus_queries.rc | default(1) | int) == 0
    - >-
      (librenms_redis_sentinel_consensus_queries.stdout_lines | default([]) | length)
      >= 2
  retries: "{{ librenms_redis_sentinel_consensus_retries | int }}"
  delay: "{{ librenms_redis_sentinel_consensus_delay | int }}"
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Initialize Redis Sentinel consensus reports
  set_fact:
    librenms_redis_sentinel_consensus_master_reports: []
    librenms_redis_sentinel_consensus_query_failures: []
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Collect reachable Redis Sentinel consensus reports
  set_fact:
    librenms_redis_sentinel_consensus_master_reports: >-
      {{
        librenms_redis_sentinel_consensus_master_reports
        + [item.stdout_lines[0] ~ ':' ~ item.stdout_lines[1]]
      }}
  loop: "{{ librenms_redis_sentinel_consensus_queries.results | default([]) }}"
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - item.rc == 0
    - (item.stdout_lines | default([]) | length) >= 2

- name: Collect Redis Sentinel consensus query failures
  set_fact:
    librenms_redis_sentinel_consensus_query_failures: >-
      {{
        librenms_redis_sentinel_consensus_query_failures
        + [
          {
            'host': item.item | default('unknown'),
            'rc': item.rc | default('unreachable'),
            'stdout': item.stdout | default(''),
            'stderr': item.stderr | default(''),
            'msg': item.msg | default('')
          }
        ]
      }}
  loop: "{{ librenms_redis_sentinel_consensus_queries.results | default([]) }}"
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - >-
      (
        (item.rc | default(1)) != 0
        or (item.stdout_lines | default([]) | length) < 2
      )

- name: Determine Redis Sentinel consensus master
  set_fact:
    librenms_redis_sentinel_consensus_masters: >-
      {{
        librenms_redis_sentinel_consensus_master_reports
        | unique
        | list
      }}
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Determine whether Redis Sentinel consensus is currently healthy
  set_fact:
    librenms_redis_sentinel_consensus_initial_ok: >-
      {{
        (librenms_redis_sentinel_consensus_master_reports | length)
        >= (librenms_redis_quorum | int)
        and librenms_redis_sentinel_consensus_masters | length == 1
        and (librenms_redis_sentinel_consensus_masters | first | length > 0)
        and (':' in (librenms_redis_sentinel_consensus_masters | first))
      }}
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Report Redis Sentinel consensus convergence before repair
  debug:
    msg: >-
      Redis Sentinel {{ librenms_redis_sentinel_service }} is not yet at a
      safe quorum. Automatic configured-master repair will run before the
      deployment continues. Reported masters:
      {{ librenms_redis_sentinel_consensus_master_reports | default([]) | join(', ') }}.
      Query nodes:
      {{ librenms_redis_sentinel_consensus_query_nodes | default([]) | join(', ') }}.
      Inventory Redis nodes:
      {{ groups.get('librenms_redis', []) | join(', ') }}.
      Inactive/excluded Redis nodes:
      {{ librenms_redis_sentinel_consensus_inactive_nodes | default([]) | join(', ') | default('none', true) }}.
      Query failures:
      {{ librenms_redis_sentinel_consensus_query_failures | default([]) }}.
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - not (librenms_redis_sentinel_consensus_initial_ok | bool)

- name: Set Redis Sentinel consensus endpoint
  set_fact:
    librenms_redis_sentinel_consensus_master_host: >-
      {{
        (
          (librenms_redis_sentinel_consensus_masters | first).split(':')[0]
          if librenms_redis_sentinel_consensus_initial_ok | bool
          else hostvars[librenms_redis_master_host].ansible_host | default(librenms_redis_master_host)
        )
      }}
    librenms_redis_sentinel_consensus_master_port: >-
      {{
        (
          (librenms_redis_sentinel_consensus_masters | first).split(':')[1]
          if librenms_redis_sentinel_consensus_initial_ok | bool
          else '6379'
        )
      }}
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Verify Redis Sentinel consensus master accepts cache writes
  no_log: true
  shell: |-
    set -euo pipefail

    attempts={{ librenms_redis_sentinel_consensus_retries | int }}
    delay={{ librenms_redis_sentinel_consensus_delay | int }}
    attempt=1

    while [ "${attempt}" -le "${attempts}" ]; do
      result=$(
        {{ librenms_redis_cli_binary }} \
          -h {{ librenms_redis_sentinel_consensus_master_host | quote }} \
          -p {{ librenms_redis_sentinel_consensus_master_port | quote }} \
        {% if librenms_redis_username | length > 0 %}
          --user {{ librenms_redis_username | quote }} \
        {% endif %}
          SET librenms:sentinel-consensus-write-check {{ inventory_hostname | quote }} EX 30 \
          2>/dev/null || true
      )

      if [ "${result}" = "OK" ]; then
        exit 0
      fi

      if [ "${attempt}" -lt "${attempts}" ]; then
        sleep "${delay}"
      fi
      attempt=$((attempt + 1))
    done

    exit 1
  args:
    executable: /bin/bash
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_password }}"
  register: librenms_redis_sentinel_consensus_write_check
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Initialize Redis Sentinel consensus repair state
  set_fact:
    librenms_redis_sentinel_repair_attempted: false
    librenms_redis_sentinel_repair_consensus_ok: false
    librenms_redis_sentinel_repair_write_ok: false
    librenms_redis_sentinel_consensus_needs_repair: false
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Determine whether Redis Sentinel repair is required
  set_fact:
    librenms_redis_sentinel_consensus_needs_repair: >-
      {{
        not (librenms_redis_sentinel_consensus_initial_ok | bool)
        or (librenms_redis_sentinel_consensus_write_check.rc | default(1) | int) != 0
      }}
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host

- name: Set Redis Sentinel configured repair endpoint
  set_fact:
    librenms_redis_sentinel_repair_attempted: true
    librenms_redis_sentinel_repair_master_host: "{{ librenms_redis_master_host }}"
    librenms_redis_sentinel_repair_master_addr: >-
      {{ hostvars[librenms_redis_master_host].ansible_host | default(librenms_redis_master_host) }}
    librenms_redis_sentinel_repair_master_port: "6379"
    librenms_redis_sentinel_repair_expected_master: >-
      {{ hostvars[librenms_redis_master_host].ansible_host | default(librenms_redis_master_host) }}:6379
    librenms_redis_sentinel_repair_non_master_nodes: >-
      {{
        librenms_redis_sentinel_consensus_query_nodes
        | difference([librenms_redis_master_host])
      }}
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - librenms_redis_sentinel_consensus_needs_repair | bool
    - librenms_redis_sentinel_enforce_configured_master | bool

- name: Set Redis Sentinel repair replica nodes
  set_fact:
    librenms_redis_sentinel_repair_replica_nodes: >-
      {{
        librenms_redis_sentinel_repair_non_master_nodes
        | intersect(librenms_redis_sentinel_consensus_query_nodes)
      }}
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - librenms_redis_sentinel_consensus_needs_repair | bool
    - librenms_redis_sentinel_enforce_configured_master | bool

- name: Repair Redis Sentinel consensus master after failed quorum or write check
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - librenms_redis_sentinel_consensus_needs_repair | bool
    - librenms_redis_sentinel_enforce_configured_master | bool
  block:
    - name: Promote configured Redis master after failed consensus write
      no_log: true
      command: >-
        {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 6379
        REPLICAOF NO ONE
      environment:
        REDISCLI_AUTH: "{{ librenms_redis_password }}"
      delegate_to: "{{ librenms_redis_sentinel_repair_master_host }}"
      register: librenms_redis_sentinel_repair_promote_master
      changed_when: >-
        (librenms_redis_sentinel_repair_promote_master.stdout
        | default('') | trim) == 'OK'
      failed_when: false

    - name: Point Redis replicas at configured master after failed consensus write
      no_log: true
      command: >-
        {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 6379
        REPLICAOF {{ librenms_redis_sentinel_repair_master_addr | quote }}
        {{ librenms_redis_sentinel_repair_master_port | quote }}
      environment:
        REDISCLI_AUTH: "{{ librenms_redis_password }}"
      loop: "{{ librenms_redis_sentinel_repair_replica_nodes }}"
      delegate_to: "{{ item }}"
      ignore_unreachable: true
      register: librenms_redis_sentinel_repair_follow_master
      changed_when: >-
        (librenms_redis_sentinel_repair_follow_master.stdout
        | default('') | trim) == 'OK'
      failed_when: false

    - name: Reset Redis Sentinel state after failed consensus write
      no_log: true
      command: >-
        {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 26379
        {% if librenms_redis_sentinel_username | length > 0 %}
        --user {{ librenms_redis_sentinel_username | quote }}
        {% endif %}
        SENTINEL reset {{ librenms_redis_sentinel_service | quote }}
      environment:
        REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
      loop: "{{ librenms_redis_sentinel_consensus_query_nodes }}"
      delegate_to: "{{ item }}"
      ignore_unreachable: true
      register: librenms_redis_sentinel_repair_reset
      changed_when: >-
        (librenms_redis_sentinel_repair_reset.stdout | default('0') | int) > 0
      failed_when: false

    - name: Flush Redis Sentinel config after failed consensus write
      no_log: true
      command: >-
        {{ librenms_redis_cli_binary }} -h 127.0.0.1 -p 26379
        {% if librenms_redis_sentinel_username | length > 0 %}
        --user {{ librenms_redis_sentinel_username | quote }}
        {% endif %}
        SENTINEL FLUSHCONFIG
      environment:
        REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
      loop: "{{ librenms_redis_sentinel_consensus_query_nodes }}"
      delegate_to: "{{ item }}"
      ignore_unreachable: true
      register: librenms_redis_sentinel_repair_flushconfig
      changed_when: false
      failed_when: false

    - name: Verify Redis Sentinels report configured master after repair
      no_log: true
      shell: |-
        set -euo pipefail

        attempts={{ librenms_redis_sentinel_consensus_retries | int }}
        delay={{ librenms_redis_sentinel_consensus_delay | int }}
        expected={{ librenms_redis_sentinel_repair_expected_master | quote }}
        attempt=1
        reported=":"

        while [ "${attempt}" -le "${attempts}" ]; do
          mapfile -t lines < <(
            {{ librenms_redis_cli_binary }} \
              -h 127.0.0.1 \
              -p 26379 \
        {% if librenms_redis_sentinel_username | length > 0 %}
              --user {{ librenms_redis_sentinel_username | quote }} \
        {% endif %}
              SENTINEL get-master-addr-by-name {{ librenms_redis_sentinel_service | quote }} \
              2>/dev/null || true
          )

          reported="${lines[0]:-}:${lines[1]:-}"
          if [ "${reported}" = "${expected}" ]; then
            echo "${reported}"
            exit 0
          fi

          if [ "${attempt}" -lt "${attempts}" ]; then
            sleep "${delay}"
          fi
          attempt=$((attempt + 1))
        done

        echo "${reported}"
        exit 1
      args:
        executable: /bin/bash
      environment:
        REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
      loop: "{{ librenms_redis_sentinel_consensus_query_nodes }}"
      delegate_to: "{{ item }}"
      ignore_unreachable: true
      register: librenms_redis_sentinel_repair_consensus_queries
      changed_when: false
      failed_when: false

    - name: Verify configured Redis master accepts cache writes after repair
      no_log: true
      shell: |-
        set -euo pipefail

        attempts={{ librenms_redis_sentinel_consensus_retries | int }}
        delay={{ librenms_redis_sentinel_consensus_delay | int }}
        attempt=1

        while [ "${attempt}" -le "${attempts}" ]; do
          result=$(
            {{ librenms_redis_cli_binary }} \
              -h {{ librenms_redis_sentinel_repair_master_addr | quote }} \
              -p {{ librenms_redis_sentinel_repair_master_port | quote }} \
        {% if librenms_redis_username | length > 0 %}
              --user {{ librenms_redis_username | quote }} \
        {% endif %}
              SET librenms:sentinel-repair-write-check {{ inventory_hostname | quote }} EX 30 \
              2>/dev/null || true
          )

          if [ "${result}" = "OK" ]; then
            exit 0
          fi

          if [ "${attempt}" -lt "${attempts}" ]; then
            sleep "${delay}"
          fi
          attempt=$((attempt + 1))
        done

        exit 1
      args:
        executable: /bin/bash
      environment:
        REDISCLI_AUTH: "{{ librenms_redis_password }}"
      register: librenms_redis_sentinel_repair_write_check
      changed_when: false
      failed_when: false

    - name: Set Redis Sentinel consensus repair result
      set_fact:
        librenms_redis_sentinel_repair_consensus_ok: >-
          {{
            (
              librenms_redis_sentinel_repair_consensus_queries.results
              | default([])
              | selectattr('rc', 'equalto', 0)
              | list
              | length
            ) >= (librenms_redis_quorum | int)
          }}
        librenms_redis_sentinel_repair_write_ok: >-
          {{ (librenms_redis_sentinel_repair_write_check.rc | default(1) | int) == 0 }}

- name: Prefer configured Redis master after successful Sentinel repair
  set_fact:
    librenms_redis_sentinel_consensus_master_host: >-
      {{ librenms_redis_sentinel_repair_master_addr }}
    librenms_redis_sentinel_consensus_master_port: >-
      {{ librenms_redis_sentinel_repair_master_port }}
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - librenms_redis_sentinel_repair_consensus_ok | default(false) | bool
    - librenms_redis_sentinel_repair_write_ok | default(false) | bool

- name: Fail when Redis Sentinel cannot converge on a writable quorum
  fail:
    msg: |-
      Redis Sentinel {{ librenms_redis_sentinel_service }} did not converge
      on a safe, writable quorum.

      Initial consensus was healthy:
      {{ librenms_redis_sentinel_consensus_initial_ok | default(false) }}

      Redis Sentinel endpoint tested:
      {{ librenms_redis_sentinel_consensus_master_host }}:{{
      librenms_redis_sentinel_consensus_master_port }}, but that endpoint did
      not accept cache writes after {{ librenms_redis_sentinel_consensus_retries }}
      attempts.

      Automatic configured-master repair attempted:
      {{ librenms_redis_sentinel_repair_attempted | default(false) }}

      Configured Redis master:
      {{ librenms_redis_sentinel_repair_expected_master | default('not set') }}

      Reported Sentinel masters:
      {{ librenms_redis_sentinel_consensus_master_reports | default([]) | join(', ') }}

      Sentinel query failures:
      {{ librenms_redis_sentinel_consensus_query_failures | default([]) }}

      The playbook stops here because LibreNMS cache writes would be unsafe.
      After Redis/Sentinel is writable, rerun playbooks/site.yml; the later
      LibreNMS app role will also re-enable and start librenms-scheduler.timer.
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - librenms_redis_sentinel_consensus_needs_repair | bool
    - >-
      not (
        librenms_redis_sentinel_repair_consensus_ok | default(false) | bool
        and librenms_redis_sentinel_repair_write_ok | default(false) | bool
      )

- name: Confirm Redis Sentinel consensus writable master
  debug:
    msg: >-
      Redis Sentinel {{ librenms_redis_sentinel_service }} has a writable
      cache master at {{ librenms_redis_sentinel_consensus_master_host }}:{{
      librenms_redis_sentinel_consensus_master_port }}.
  when:
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == librenms_redis_sentinel_consensus_controller_host
    - >-
      (librenms_redis_sentinel_consensus_write_check.rc | default(1) | int) == 0
      or
      (
        librenms_redis_sentinel_repair_consensus_ok | default(false) | bool
        and librenms_redis_sentinel_repair_write_ok | default(false) | bool
      )
