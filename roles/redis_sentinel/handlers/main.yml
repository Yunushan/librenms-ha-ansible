---
- name: Restart Redis service
  service:
    name: "{{ librenms_redis_service_name }}"
    state: restarted
  register: redis_restart_result
  failed_when: false
  listen: Restart Redis

- name: Wait for Redis service to become active after restart
  systemd:
    name: "{{ librenms_redis_service_name }}"
  register: redis_service_state_after_restart
  changed_when: false
  failed_when: false
  retries: 6
  delay: 2
  until: >-
    (redis_service_state_after_restart.status.ActiveState | default(''))
    == 'active'
  listen: Restart Redis

- name: Capture Redis service status
  command: "systemctl status {{ librenms_redis_service_name }} --no-pager -l"
  register: redis_service_status
  changed_when: false
  failed_when: false
  when: >-
    (redis_service_state_after_restart.status.ActiveState | default(''))
    != 'active'
  listen: Restart Redis

- name: Capture Redis service journal
  command: "journalctl -u {{ librenms_redis_service_name }} -n 50 --no-pager"
  register: redis_service_journal
  changed_when: false
  failed_when: false
  when: >-
    (redis_service_state_after_restart.status.ActiveState | default(''))
    != 'active'
  listen: Restart Redis

- name: Fail with Redis service diagnostics
  fail:
    msg: |-
      Failed to restart {{ librenms_redis_service_name }}.

      systemctl status:
      {{ redis_service_status.stdout | default('') }}
      {{ redis_service_status.stderr | default('') }}

      journalctl:
      {{ redis_service_journal.stdout | default('') }}
      {{ redis_service_journal.stderr | default('') }}
  when: >-
    (redis_service_state_after_restart.status.ActiveState | default(''))
    != 'active'
  listen: Restart Redis

- name: Restart Redis Sentinel service
  service:
    name: "{{ librenms_redis_sentinel_service_name_effective }}"
    state: restarted
  register: redis_sentinel_restart_result
  failed_when: false
  when: librenms_redis_mode == 'sentinel'
  listen: Restart Redis Sentinel

- name: Wait for Redis Sentinel service to become active after restart
  systemd:
    name: "{{ librenms_redis_sentinel_service_name_effective }}"
  register: redis_sentinel_service_state_after_restart
  changed_when: false
  failed_when: false
  retries: 6
  delay: 2
  until: >-
    (redis_sentinel_service_state_after_restart.status.ActiveState | default(''))
    == 'active'
  when: librenms_redis_mode == 'sentinel'
  listen: Restart Redis Sentinel

- name: Capture Redis Sentinel service status
  command: "systemctl status {{ librenms_redis_sentinel_service_name_effective }} --no-pager -l"
  register: redis_sentinel_service_status
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - >-
      (redis_sentinel_service_state_after_restart.status.ActiveState
      | default('')) != 'active'
  listen: Restart Redis Sentinel

- name: Capture Redis Sentinel service journal
  command: "journalctl -u {{ librenms_redis_sentinel_service_name_effective }} -n 50 --no-pager"
  register: redis_sentinel_service_journal
  changed_when: false
  failed_when: false
  when:
    - librenms_redis_mode == 'sentinel'
    - >-
      (redis_sentinel_service_state_after_restart.status.ActiveState
      | default('')) != 'active'
  listen: Restart Redis Sentinel

- name: Fail with Redis Sentinel service diagnostics
  fail:
    msg: |-
      Failed to restart {{ librenms_redis_sentinel_service_name_effective }}.

      systemctl status:
      {{ redis_sentinel_service_status.stdout | default('') }}
      {{ redis_sentinel_service_status.stderr | default('') }}

      journalctl:
      {{ redis_sentinel_service_journal.stdout | default('') }}
      {{ redis_sentinel_service_journal.stderr | default('') }}
  when:
    - librenms_redis_mode == 'sentinel'
    - >-
      (redis_sentinel_service_state_after_restart.status.ActiveState
      | default('')) != 'active'
  listen: Restart Redis Sentinel
