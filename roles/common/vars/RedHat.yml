---
librenms_curl_package: >-
  {{ 'curl-minimal' if (ansible_distribution_major_version | int) >= 9 else 'curl' }}

librenms_base_packages:
  - acl
  - bash-completion
  - ca-certificates
  - cronie
  - "{{ librenms_curl_package }}"
  - fping
  - git
  - graphviz
  - ImageMagick
  - iproute
  - mtr
  - net-snmp
  - net-snmp-utils
  - nginx
  - nmap
  - php-fpm
  - php-cli
  - php-common
  - php-curl
  - php-gd
  - php-gmp
  - php-mbstring
  - php-opcache
  - php-process
  - php-snmp
  - php-xml
  - php-pecl-zip
  - php-mysqlnd
  - python3
  - python3-pip
  - python3-psutil
  - python3-systemd
  - firewalld
  - policycoreutils-python-utils
  - rrdtool
  - rsync
  - traceroute
  - unzip
  - util-linux
  - whois

librenms_db_packages:
  - mariadb-server
  - mariadb
  - python3-PyMySQL

librenms_galera_packages:
  - mariadb-server-galera
  - rsync

librenms_redis_packages: >-
  {{
    ['valkey']
    if (ansible_distribution_major_version | int) >= 10
    else ['redis', 'python3-redis']
  }}

librenms_gluster_packages:
  - glusterfs-server
  - xfsprogs

librenms_lb_packages:
  - haproxy
  - keepalived

librenms_mariadb_service_name: mariadb
librenms_mariadb_socket: /var/lib/mysql/mysql.sock
librenms_mariadb_tuning_conf: /etc/my.cnf.d/librenms.cnf
librenms_galera_conf_path: /etc/my.cnf.d/galera.cnf

librenms_nginx_service_name: nginx
librenms_nginx_conf_path: /etc/nginx/conf.d/librenms.conf
librenms_web_runtime_user: nginx
librenms_web_runtime_group: nginx

librenms_php_cli_ini_path: /etc/php.ini
librenms_php_fpm_ini_path: /etc/php.ini
librenms_php_fpm_pool_dir: /etc/php-fpm.d
librenms_php_fpm_service_name: php-fpm

librenms_redis_runtime_user: >-
  {{ 'valkey' if (ansible_distribution_major_version | int) >= 10 else 'redis' }}
librenms_redis_runtime_group: "{{ librenms_redis_runtime_user }}"
librenms_redis_runtime_dir: >-
  {{ '/run/valkey' if (ansible_distribution_major_version | int) >= 10 else '/run/redis' }}
librenms_redis_data_dir: >-
  {{ '/var/lib/valkey' if (ansible_distribution_major_version | int) >= 10 else '/var/lib/redis' }}
librenms_redis_server_binary: >-
  {{ '/usr/bin/valkey-server' if (ansible_distribution_major_version | int) >= 10 else '/usr/bin/redis-server' }}
librenms_redis_cli_binary: >-
  {{ '/usr/bin/valkey-cli' if (ansible_distribution_major_version | int) >= 10 else '/usr/bin/redis-cli' }}
librenms_redis_service_name: >-
  {{ 'valkey' if (ansible_distribution_major_version | int) >= 10 else 'redis' }}
librenms_redis_conf_path: >-
  {{
    '/etc/valkey/valkey.conf'
    if (ansible_distribution_major_version | int) >= 10
    else (
      '/etc/redis/redis.conf'
      if (ansible_distribution_major_version | int) >= 9
      else '/etc/redis.conf'
    )
  }}
librenms_redis_sentinel_conf_path: >-
  {{
    '/etc/valkey/sentinel.conf'
    if (ansible_distribution_major_version | int) >= 10
    else (
      '/etc/redis/sentinel.conf'
      if (ansible_distribution_major_version | int) >= 9
      else '/etc/redis-sentinel.conf'
    )
  }}
librenms_redis_sentinel_native_service_name: >-
  {{ 'valkey-sentinel' if (ansible_distribution_major_version | int) >= 10 else 'redis-sentinel' }}

librenms_snmpd_service_name: snmpd
librenms_snmpd_conf_path: /etc/snmp/snmpd.conf
librenms_snmp_persistent_config_candidates:
  - /var/lib/net-snmp/snmpd.conf
  - /var/lib/snmp/snmpd.conf

librenms_haproxy_service_name: haproxy
librenms_keepalived_service_name: keepalived
librenms_glusterd_service_name: glusterd
