---
- name: Check whether Ubuntu deb822 sources already include universe
  ansible.builtin.shell: |
    if [ ! -f /etc/apt/sources.list.d/ubuntu.sources ]; then
      exit 1
    fi
    awk '
      /^Suites:/ {
        suite = ($0 ~ /(^|[[:space:]]){{ ansible_facts.distribution_release }}([[:space:]]|$)/)
      }
      /^Components:/ && suite && $0 ~ /(^|[[:space:]])universe([[:space:]]|$)/ {
        found = 1
      }
      END { exit found ? 0 : 1 }
    ' /etc/apt/sources.list.d/ubuntu.sources
  args:
    executable: /bin/bash
  register: librenms_ubuntu_sources_universe
  changed_when: false
  failed_when: false
  when: librenms_enable_extra_repos | bool

- name: Validate explicit Ubuntu PHP stream selection
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - (ansible_facts.distribution_major_version | int) in [22, 24, 26]
      - librenms_enable_extra_repos | bool
      - librenms_ubuntu_php_repository_enabled | bool
      - >-
        (
          librenms_php_version
          if librenms_php_selection_mode == 'specific'
          else librenms_ubuntu_php_version_override
        ) | default('') | trim in librenms_supported_php_versions
    fail_msg: >-
      The selected Ubuntu PHP stream must be supported on Ubuntu 22.04, 24.04,
      or 26.04, and the verified PHP repository must remain enabled. Selected
      value: >-
        {{
          (
            librenms_php_version
            if librenms_php_selection_mode == 'specific'
            else librenms_ubuntu_php_version_override
          ) | default('')
        }}.
  when:
    - librenms_php_selection_mode == 'specific'
      or (librenms_ubuntu_php_version_override | default('') | trim | length > 0)

- name: Determine whether the Ubuntu PHP repository is required
  ansible.builtin.set_fact:
    librenms_ubuntu_php_repository_required: >-
      {{
        ansible_facts.distribution == 'Ubuntu'
        and (
          (ansible_facts.distribution_major_version | int) == 22
          or librenms_php_selection_mode == 'specific'
          or (librenms_ubuntu_php_version_override | default('') | trim | length > 0)
        )
      }}

- name: Check for legacy Ubuntu universe source file
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/archive_ubuntu_com_ubuntu.list
  register: librenms_ubuntu_legacy_universe_source
  when: librenms_enable_extra_repos | bool

- name: Remove duplicate Ubuntu universe source when deb822 already provides it
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/archive_ubuntu_com_ubuntu.list
    regexp: "^deb\\s+https?://archive\\.ubuntu\\.com/ubuntu\\s+{{ ansible_facts.distribution_release }}\\s+universe\\s*$"
    state: absent
  when:
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) == 0
    - librenms_ubuntu_legacy_universe_source.stat.exists | default(false)

- name: Install deb822 repository management dependency
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: false
  when:
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) != 0

- name: Configure Ubuntu universe repository
  ansible.builtin.deb822_repository:
    name: librenms-ubuntu-universe
    types:
      - deb
    uris: http://archive.ubuntu.com/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components:
      - universe
    state: present
  when:
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) != 0

- name: Install Ubuntu PHP repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: false
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Ensure the Ubuntu PHP APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Remove the legacy Ondrej PHP trusted key import
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/ondrej-ubuntu-php.gpg
    state: absent
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Find legacy Ondrej PHP source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*ondrej*php*'
    file_type: file
  register: librenms_ubuntu_php_legacy_sources
  changed_when: false
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Remove legacy Ondrej PHP source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ librenms_ubuntu_php_legacy_sources.files | default([]) }}"
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool
    - item.path != librenms_ubuntu_php_repository_source_file

- name: Install the verified Ondrej PHP signing key
  ansible.builtin.get_url:
    url: "{{ librenms_ubuntu_php_repository_key_url }}"
    dest: "{{ librenms_ubuntu_php_repository_keyring }}"
    owner: root
    group: root
    mode: '0644'
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Read the Ondrej PHP signing-key fingerprint
  ansible.builtin.shell: |
    set -o pipefail
    gpg --batch --show-keys --with-colons "{{ librenms_ubuntu_php_repository_keyring }}" |
      awk -F: '$1 == "fpr" { print toupper($10); exit }'
  args:
    executable: /bin/bash
  register: librenms_ubuntu_php_key_fingerprint
  changed_when: false
  check_mode: false
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Validate the Ondrej PHP signing-key fingerprint
  ansible.builtin.assert:
    that:
      - librenms_ubuntu_php_key_fingerprint.stdout | trim == librenms_ubuntu_php_repository_key_fingerprint
    fail_msg: >-
      The downloaded Ondrej PHP signing key fingerprint does not match the pinned
      fingerprint. Refusing to configure the PHP repository.
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Configure the supported PHP stream for Ubuntu 22 or an explicit override
  ansible.builtin.copy:
    dest: "{{ librenms_ubuntu_php_repository_source_file }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: {{ librenms_ubuntu_php_repository_uri }}
      Suites: {{ ansible_facts.distribution_release }}
      Components: main
      Signed-By: {{ librenms_ubuntu_php_repository_keyring }}
  when:
    - librenms_ubuntu_php_repository_required | bool
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool
