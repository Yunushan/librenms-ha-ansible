---
- name: Load OS-specific variables
  include_vars:
    file: "{{ lookup('first_found', lookup_params) }}"
  vars:
    lookup_params:
      files:
        - "{{ ansible_distribution | replace(' ', '') }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Ensure OS family is supported
  assert:
    that:
      - ansible_os_family in librenms_allowed_os_families
    fail_msg: "Unsupported OS family {{ ansible_os_family }} for this repo."

- name: Set support tier fact
  set_fact:
    librenms_support_tier: >-
      {{
        librenms_support_tier_map.get(
          ansible_distribution,
          librenms_support_tier_map.get(ansible_os_family, 'best-effort')
        )
      }}

- name: Build active inventory host lists
  set_fact:
    librenms_active_web_nodes: >-
      {{
        groups.get('librenms_web', groups.get('librenms_nodes', []))
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_db_nodes: >-
      {{
        groups.get('librenms_db', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_redis_nodes: >-
      {{
        groups.get('librenms_redis', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_lb_nodes: >-
      {{
        groups.get('lb_nodes', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_gluster_nodes: >-
      {{
        groups.get('gluster_nodes', [])
        | difference(librenms_inactive_inventory_nodes)
      }}

- name: Determine effective HAProxy web health-check host
  set_fact:
    librenms_haproxy_web_check_host_effective: >-
      {{
        librenms_haproxy_web_check_host
        if librenms_haproxy_web_check_host | length > 0
        else
        (
          librenms_fqdn
          if librenms_fqdn | length > 0 and librenms_fqdn != librenms_default_fqdn_placeholder
          else (
            librenms_vip_ip
            if librenms_vip_enabled and librenms_vip_ip | length > 0
            else inventory_hostname
          )
        )
      }}

- name: Validate APP_KEY has been set
  assert:
    that:
      - librenms_app_key != 'CHANGE_ME'
      - (librenms_app_key | length) > 8
    fail_msg: "Set librenms_app_key before running the playbook."

- name: Validate Galera node count when enabled
  assert:
    that:
      - (librenms_active_db_nodes | length) >= 3
    fail_msg: "Galera mode expects at least 3 active DB nodes."
  when: librenms_db_mode == 'galera'

- name: Validate Redis Sentinel node count when enabled
  assert:
    that:
      - (librenms_active_redis_nodes | length) >= 3
    fail_msg: "Redis Sentinel mode expects at least 3 active Redis nodes."
  when: librenms_redis_mode == 'sentinel'

- name: Validate DB access pattern for Galera
  assert:
    that:
      - librenms_db_host | length > 0 or librenms_vip_enabled | bool or (librenms_active_lb_nodes | length) > 0
    fail_msg: "Galera mode requires an explicit DB host, VIP, or lb_nodes frontend."
  when: librenms_db_mode == 'galera'

- name: Check whether Ubuntu deb822 sources already include universe
  shell: |
    if [ ! -f /etc/apt/sources.list.d/ubuntu.sources ]; then
      exit 1
    fi
    awk '
      /^Suites:/ {
        suite = ($0 ~ /(^|[[:space:]]){{ ansible_distribution_release }}([[:space:]]|$)/)
      }
      /^Components:/ && suite && $0 ~ /(^|[[:space:]])universe([[:space:]]|$)/ {
        found = 1
      }
      END { exit found ? 0 : 1 }
    ' /etc/apt/sources.list.d/ubuntu.sources
  args:
    executable: /bin/bash
  register: librenms_ubuntu_sources_universe
  changed_when: false
  failed_when: false
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool

- name: Check for legacy Ubuntu universe source file
  stat:
    path: /etc/apt/sources.list.d/archive_ubuntu_com_ubuntu.list
  register: librenms_ubuntu_legacy_universe_source
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool

- name: Remove duplicate Ubuntu universe source when deb822 already provides it
  lineinfile:
    path: /etc/apt/sources.list.d/archive_ubuntu_com_ubuntu.list
    regexp: "^deb\\s+https?://archive\\.ubuntu\\.com/ubuntu\\s+{{ ansible_distribution_release }}\\s+universe\\s*$"
    state: absent
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) == 0
    - librenms_ubuntu_legacy_universe_source.stat.exists | default(false)

- name: Install deb822 repository management dependency
  apt:
    name: python3-debian
    state: present
    update_cache: false
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) != 0

- name: Configure Ubuntu universe repository
  deb822_repository:
    name: librenms-ubuntu-universe
    types:
      - deb
    uris: http://archive.ubuntu.com/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components:
      - universe
    state: present
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) != 0

- name: Refresh apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Configure RedHat-family supplemental repositories
  include_tasks: redhat_repos.yml
  when:
    - ansible_os_family == 'RedHat'
    - librenms_enable_extra_repos | bool

- name: Install base packages
  package:
    name: "{{ librenms_base_packages + librenms_common_extra_packages }}"
    state: present

- name: Validate supported operating-system and runtime versions
  include_tasks: runtime_support.yml
  when: librenms_runtime_support_enabled | bool

- name: Detect hardware clock utility
  ansible.builtin.stat:
    path: /usr/sbin/hwclock
  register: librenms_hwclock_probe

- name: Detect timedatectl utility
  ansible.builtin.stat:
    path: /usr/bin/timedatectl
  register: librenms_timedatectl_probe

- name: Set system timezone with community timezone module
  community.general.timezone:
    name: "{{ librenms_timezone }}"
    hwclock: "{{ librenms_timezone_hwclock | default(omit, true) }}"
  when: librenms_hwclock_probe.stat.exists

- name: Read current system timezone without hardware clock utility
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=Timezone
      - --value
  register: librenms_current_timezone
  changed_when: false
  failed_when: false
  when:
    - not librenms_hwclock_probe.stat.exists
    - librenms_timedatectl_probe.stat.exists

- name: Set system timezone with timedatectl
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ librenms_timezone }}"
  register: librenms_timedatectl_set
  changed_when: librenms_timedatectl_set.rc == 0
  failed_when: false
  when:
    - not librenms_hwclock_probe.stat.exists
    - librenms_timedatectl_probe.stat.exists
    - librenms_current_timezone.stdout | trim != librenms_timezone

- name: Validate timezone data for direct timezone fallback
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ librenms_timezone }}"
  register: librenms_timezone_file
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Require timezone data for direct timezone fallback
  ansible.builtin.assert:
    that:
      - librenms_timezone_file.stat.exists
    fail_msg: "Timezone data was not found for {{ librenms_timezone }}."
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Set system timezone with direct localtime fallback
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ librenms_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Ensure state directory exists
  file:
    path: "{{ librenms_galera_bootstrap_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
