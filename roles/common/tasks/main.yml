---
- name: Load OS-specific variables
  include_vars:
    file: "{{ lookup('first_found', lookup_params) }}"
  vars:
    lookup_params:
      files:
        - "{{ ansible_facts.distribution | replace(' ', '') }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Ensure OS family is supported
  assert:
    that:
      - ansible_facts.os_family in librenms_allowed_os_families
    fail_msg: "Unsupported OS family {{ ansible_facts.os_family }} for this repo."

- name: Set support tier fact
  set_fact:
    librenms_support_tier: >-
      {{
        librenms_support_tier_map.get(
          ansible_facts.distribution,
          librenms_support_tier_map.get(ansible_facts.os_family, 'best-effort')
        )
      }}

- name: Validate production platform baseline before package changes
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in librenms_supported_distribution_major_versions
      - librenms_support_tier == 'primary'
      - >-
        (ansible_facts.distribution_major_version | string)
        in (librenms_supported_distribution_major_versions[ansible_facts.distribution] | default([]))
      - >-
        librenms_platform_min_version | length == 0
        or ansible_facts.distribution_version
        is version(librenms_platform_min_version, '>=')
      - ansible_facts.architecture in librenms_supported_architectures
    fail_msg: >-
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} on
      {{ ansible_facts.architecture }} is outside the declared production platform
      matrix. Supported primary distributions and minimum versions are:
      {{ librenms_supported_distribution_min_versions }}. This check runs
      before repository or package changes. Set
      librenms_production_profile: false only for a reviewed lab or
      vendor-supported exception.
  vars:
    librenms_platform_min_version: >-
      {{
        librenms_supported_distribution_min_versions
        .get(ansible_facts.distribution, {})
        .get(ansible_facts.distribution_major_version | string, '')
      }}
  when: librenms_production_profile | bool

- name: Validate explicit Nginx repository and version selectors
  ansible.builtin.assert:
    that:
      - librenms_nginx_repository_mode in ['distro', 'official']
      - librenms_nginx_channel in ['distro', 'stable', 'mainline']
      - >-
        (
          librenms_nginx_repository_mode == 'distro'
          and librenms_nginx_channel == 'distro'
        ) or (
          librenms_nginx_repository_mode == 'official'
          and librenms_nginx_channel in ['stable', 'mainline']
        )
      - >-
        librenms_nginx_repository_mode != 'official'
        or librenms_enable_extra_repos | bool
      - >-
        librenms_nginx_repository_mode != 'official'
        or (librenms_nginx_official_repository_key_fingerprint | string | trim)
        is match('^[A-Fa-f0-9]{40}$')
      - >-
        librenms_nginx_expected_series | default('') | trim | length == 0
        or librenms_nginx_expected_series in librenms_supported_nginx_series
      - librenms_nginx_package_state in ['present', 'latest']
      - >-
        (librenms_nginx_package_version | string | trim | length == 0)
        or librenms_nginx_package_state == 'present'
    fail_msg: >-
      Nginx selector configuration is invalid. Use repository mode distro or
      official with channel distro or stable/mainline respectively, and an
      exact 40-character signing-key fingerprint for the official repository.
      Package state must be present or latest; an exact package version is
      applied with state present.
  when: librenms_manage_nginx | bool

- name: Validate explicit PHP selector policy
  ansible.builtin.assert:
    that:
      - librenms_php_selection_mode in ['distro', 'specific', 'latest']
      - >-
        librenms_php_selection_mode != 'specific'
        or (librenms_php_version | string | trim) in librenms_supported_php_versions
      - >-
        librenms_php_selection_mode != 'specific'
        or (librenms_php_version | string | trim | length) > 0
    fail_msg: >-
      PHP selection must be distro, latest, or specific. Specific selection
      requires librenms_php_version to be one of the supported PHP streams:
      {{ librenms_supported_php_versions | join(', ') }}.
  when: librenms_manage_php_fpm | bool

- name: Reject exact PHP selection on the native EL10 path
  ansible.builtin.assert:
    that:
      - not (
          ansible_facts.os_family == 'RedHat'
          and (ansible_facts.distribution_major_version | int) >= 10
          and librenms_php_selection_mode == 'specific'
        )
    fail_msg: >-
      Exact PHP stream selection is not implemented for EL10 in this role.
      EL10 uses its native PHP package stream; use PHP selection mode distro or
      latest, or provide and review a separate EL10 package contract first.
  when: librenms_manage_php_fpm | bool

- name: Validate explicit Debian PHP repository policy
  ansible.builtin.assert:
    that:
      - librenms_enable_extra_repos | bool
      - librenms_debian_php_repository_enabled | bool
      - >-
        (librenms_debian_php_repository_key_fingerprint | string | trim)
        is match('^[A-Fa-f0-9]{40}$')
    fail_msg: >-
      Debian specific/latest PHP selection requires the explicitly enabled
      signed PHP repository and its pinned 40-character signing-key fingerprint.
      Review the repository key before setting
      librenms_debian_php_repository_enabled=true.
  when:
    - ansible_facts.distribution == 'Debian'
    - librenms_manage_php_fpm | bool
    - librenms_php_selection_mode in ['specific', 'latest']

- name: Configure Debian PHP repository for explicit PHP selection
  ansible.builtin.include_tasks: debian_repos.yml
  when:
    - ansible_facts.distribution == 'Debian'
    - librenms_manage_php_fpm | bool
    - librenms_php_selection_mode in ['specific', 'latest']

- name: Fail early when RHEL-family storage mode is unsupported
  ansible.builtin.assert:
    that:
      - librenms_rrd_mode != 'glusterfs'
    fail_msg: >-
      RHEL-family hosts cannot use the in-node GlusterFS RRD mode because the
      supported RHEL repositories do not provide a production-supported
      glusterfs-server package. Use librenms_rrd_mode: external with a
      reviewed NFS/NFSv4 source for HA, or local RRD storage for standalone
      deployments.
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_rrd_mode == 'glusterfs'

- name: Require shared NFS RRD storage for RHEL-family HA
  ansible.builtin.assert:
    that:
      - librenms_rrd_mode == 'external'
      - librenms_external_rrd_fstype in ['nfs', 'nfs4']
    fail_msg: >-
      RHEL-family HA deployments require externally managed NFS/NFSv4 RRD
      storage. Local RRD storage cannot be shared safely by multiple LibreNMS
      web nodes. Set librenms_rrd_mode: external, provide a reviewed
      librenms_external_rrd_source, and keep librenms_uid/librenms_gid identical
      on every node.
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_mode == 'ha'

- name: Build active inventory host lists
  set_fact:
    librenms_active_web_nodes: >-
      {{
        groups.get('librenms_web', groups.get('librenms_nodes', []))
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_db_nodes: >-
      {{
        groups.get('librenms_db', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_redis_nodes: >-
      {{
        groups.get('librenms_redis', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_lb_nodes: >-
      {{
        groups.get('lb_nodes', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_gluster_nodes: >-
      {{
        groups.get('gluster_nodes', [])
        | difference(librenms_inactive_inventory_nodes)
      }}

- name: Determine effective HAProxy web health-check host
  set_fact:
    librenms_haproxy_web_check_host_effective: >-
      {{
        librenms_haproxy_web_check_host
        if librenms_haproxy_web_check_host | length > 0
        else
        (
          librenms_fqdn
          if librenms_fqdn | length > 0 and librenms_fqdn != librenms_default_fqdn_placeholder
          else (
            librenms_vip_ip
            if librenms_vip_enabled and librenms_vip_ip | length > 0
            else inventory_hostname
          )
        )
      }}

- name: Validate APP_KEY has been set
  assert:
    that:
      - librenms_app_key != 'CHANGE_ME'
      - (librenms_app_key | length) > 8
    fail_msg: "Set librenms_app_key before running the playbook."

- name: Validate Galera node count when enabled
  assert:
    that:
      - (librenms_active_db_nodes | length) >= 3
    fail_msg: "Galera mode expects at least 3 active DB nodes."
  when: librenms_db_mode == 'galera'

- name: Validate Redis Sentinel node count when enabled
  assert:
    that:
      - (librenms_active_redis_nodes | length) >= 3
    fail_msg: "Redis Sentinel mode expects at least 3 active Redis nodes."
  when: librenms_redis_mode == 'sentinel'

- name: Validate DB access pattern for Galera
  assert:
    that:
      - librenms_db_host | length > 0 or librenms_vip_enabled | bool or (librenms_active_lb_nodes | length) > 0
    fail_msg: "Galera mode requires an explicit DB host, VIP, or lb_nodes frontend."
  when: librenms_db_mode == 'galera'

- name: Configure Ubuntu repositories for universe and PHP
  ansible.builtin.include_tasks: ubuntu_repos.yml
  when:
    - ansible_facts.os_family == 'Debian'
    - ansible_facts.distribution == 'Ubuntu'

- name: Configure Nginx package repository policy
  ansible.builtin.include_tasks: nginx_repos.yml
  when: librenms_manage_nginx | bool

- name: Refresh apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Configure RedHat-family supplemental repositories
  include_tasks: redhat_repos.yml
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_enable_extra_repos | bool

- name: Install base packages
  package:
    name: "{{ librenms_base_packages + librenms_common_extra_packages }}"
    state: present
  when: >-
    not (
      ansible_facts.os_family == 'RedHat'
      and (ansible_facts.distribution_major_version | int) == 8
      and (librenms_rhel8_package_cli_fallback | default(true) | bool)
    )

- name: Install base packages through native DNF on RHEL 8
  ansible.builtin.command:
    argv: >-
      {{
        ['dnf', '-y', 'install']
        + (librenms_base_packages + librenms_common_extra_packages)
      }}
  register: librenms_rhel8_base_package_install
  changed_when: >-
    'Nothing to do' not in
    ((librenms_rhel8_base_package_install.stdout | default('')) ~
    (librenms_rhel8_base_package_install.stderr | default('')))
  when: >-
    ansible_facts.os_family == 'RedHat'
    and (ansible_facts.distribution_major_version | int) == 8
    and (librenms_rhel8_package_cli_fallback | default(true) | bool)

- name: Update selected Debian PHP packages within the configured repository policy
  ansible.builtin.apt:
    name: "{{ librenms_php_package_names }}"
    state: latest
    update_cache: false
  when:
    - ansible_facts.os_family == 'Debian'
    - librenms_manage_php_fpm | bool
    - librenms_php_selection_mode == 'latest'

- name: Update selected RedHat PHP packages within the configured stream
  ansible.builtin.package:
    name: "{{ librenms_php_package_names }}"
    state: latest
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_manage_php_fpm | bool
    - librenms_php_selection_mode == 'latest'
    - >-
      not (
        ansible_facts.distribution_major_version | int == 8
        and librenms_rhel8_package_cli_fallback | default(true) | bool
      )

- name: Update selected RedHat PHP packages through native DNF on EL 8
  ansible.builtin.command:
    argv: >-
      {{ ['dnf', '-y', 'upgrade'] + librenms_php_package_names }}
  register: librenms_rhel8_php_package_update
  changed_when: >-
    'Nothing to do' not in
    ((librenms_rhel8_php_package_update.stdout | default('')) ~
    (librenms_rhel8_php_package_update.stderr | default('')))
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution_major_version | int == 8
    - librenms_manage_php_fpm | bool
    - librenms_php_selection_mode == 'latest'
    - librenms_rhel8_package_cli_fallback | default(true) | bool

- name: Install the exact Debian Nginx package version when requested
  ansible.builtin.apt:
    name: "{{ librenms_nginx_package_name }}={{ librenms_nginx_package_version }}"
    state: present
    update_cache: false
  when:
    - ansible_facts.os_family == 'Debian'
    - librenms_manage_nginx | bool
    - librenms_nginx_package_version | string | trim | length > 0

- name: Install the exact RedHat Nginx package version when requested
  ansible.builtin.package:
    name: "{{ librenms_nginx_package_name }}-{{ librenms_nginx_package_version }}"
    state: present
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_manage_nginx | bool
    - librenms_nginx_package_version | string | trim | length > 0
    - >-
      not (
        ansible_facts.distribution_major_version | int == 8
        and librenms_rhel8_package_cli_fallback | default(true) | bool
      )

- name: Install the exact RedHat Nginx package version through native DNF on EL 8
  ansible.builtin.command:
    argv:
      - dnf
      - -y
      - install
      - "{{ librenms_nginx_package_name }}-{{ librenms_nginx_package_version }}"
  register: librenms_rhel8_nginx_version_install
  changed_when: >-
    'Nothing to do' not in
    ((librenms_rhel8_nginx_version_install.stdout | default('')) ~
    (librenms_rhel8_nginx_version_install.stderr | default('')))
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution_major_version | int == 8
    - librenms_manage_nginx | bool
    - librenms_nginx_package_version | string | trim | length > 0
    - librenms_rhel8_package_cli_fallback | default(true) | bool

- name: Update Debian Nginx package within the configured repository policy
  ansible.builtin.apt:
    name: "{{ librenms_nginx_package_name }}"
    state: latest
    update_cache: false
  when:
    - ansible_facts.os_family == 'Debian'
    - librenms_manage_nginx | bool
    - librenms_nginx_package_version | string | trim | length == 0
    - librenms_nginx_package_state == 'latest'

- name: Update RedHat Nginx package within the configured repository policy
  ansible.builtin.package:
    name: "{{ librenms_nginx_package_name }}"
    state: latest
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_manage_nginx | bool
    - librenms_nginx_package_version | string | trim | length == 0
    - librenms_nginx_package_state == 'latest'
    - >-
      not (
        ansible_facts.distribution_major_version | int == 8
        and librenms_rhel8_package_cli_fallback | default(true) | bool
      )

- name: Update RedHat Nginx package through native DNF on EL 8
  ansible.builtin.command:
    argv:
      - dnf
      - -y
      - upgrade
      - "{{ librenms_nginx_package_name }}"
  register: librenms_rhel8_nginx_package_update
  changed_when: >-
    'Nothing to do' not in
    ((librenms_rhel8_nginx_package_update.stdout | default('')) ~
    (librenms_rhel8_nginx_package_update.stderr | default('')))
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution_major_version | int == 8
    - librenms_manage_nginx | bool
    - librenms_nginx_package_version | string | trim | length == 0
    - librenms_nginx_package_state == 'latest'
    - librenms_rhel8_package_cli_fallback | default(true) | bool

- name: Inspect selected Ubuntu PHP CLI alternative
  ansible.builtin.command:
    argv:
      - update-alternatives
      - --query
      - php
  register: librenms_ubuntu_php_alternative_query
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.os_family == 'Debian'
    - >-
      librenms_ubuntu_php_versioned | bool
      or librenms_php_versioned | bool

- name: Select the configured Ubuntu PHP CLI stream
  ansible.builtin.command:
    argv:
      - update-alternatives
      - --set
      - php
      - "/usr/bin/php{{ librenms_ubuntu_php_version_effective }}"
  register: librenms_ubuntu_php_alternative
  changed_when: true
  when:
    - ansible_facts.os_family == 'Debian'
    - >-
      librenms_ubuntu_php_versioned | bool
      or librenms_php_versioned | bool
    - >-
      ('Value: /usr/bin/php' ~ librenms_ubuntu_php_version_effective)
      not in (librenms_ubuntu_php_alternative_query.stdout | default(''))

- name: Validate supported operating-system and runtime versions
  include_tasks: runtime_support.yml
  when: librenms_runtime_support_enabled | bool

- name: Detect hardware clock utility
  ansible.builtin.stat:
    path: /usr/sbin/hwclock
  register: librenms_hwclock_probe

- name: Detect timedatectl utility
  ansible.builtin.stat:
    path: /usr/bin/timedatectl
  register: librenms_timedatectl_probe

- name: Set system timezone with community timezone module
  community.general.timezone:
    name: "{{ librenms_timezone }}"
    hwclock: "{{ librenms_timezone_hwclock | default(omit, true) }}"
  when: librenms_hwclock_probe.stat.exists

- name: Read current system timezone without hardware clock utility
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=Timezone
      - --value
  register: librenms_current_timezone
  changed_when: false
  failed_when: false
  when:
    - not librenms_hwclock_probe.stat.exists
    - librenms_timedatectl_probe.stat.exists

- name: Set system timezone with timedatectl
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ librenms_timezone }}"
  register: librenms_timedatectl_set
  changed_when: librenms_timedatectl_set.rc == 0
  failed_when: false
  when:
    - not librenms_hwclock_probe.stat.exists
    - librenms_timedatectl_probe.stat.exists
    - librenms_current_timezone.stdout | trim != librenms_timezone

- name: Validate timezone data for direct timezone fallback
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ librenms_timezone }}"
  register: librenms_timezone_file
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Require timezone data for direct timezone fallback
  ansible.builtin.assert:
    that:
      - librenms_timezone_file.stat.exists
    fail_msg: "Timezone data was not found for {{ librenms_timezone }}."
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Set system timezone with direct localtime fallback
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ librenms_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Ensure state directory exists
  file:
    path: "{{ librenms_galera_bootstrap_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
