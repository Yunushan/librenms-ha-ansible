---
- name: Load OS-specific variables
  include_vars:
    file: "{{ lookup('first_found', lookup_params) }}"
  vars:
    lookup_params:
      files:
        - "{{ ansible_distribution | replace(' ', '') }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Ensure OS family is supported
  assert:
    that:
      - ansible_os_family in librenms_allowed_os_families
    fail_msg: "Unsupported OS family {{ ansible_os_family }} for this repo."

- name: Set support tier fact
  set_fact:
    librenms_support_tier: >-
      {{
        librenms_support_tier_map.get(
          ansible_distribution,
          librenms_support_tier_map.get(ansible_os_family, 'best-effort')
        )
      }}

- name: Validate production platform baseline before package changes
  ansible.builtin.assert:
    that:
      - ansible_distribution in librenms_supported_distribution_major_versions
      - librenms_support_tier == 'primary'
      - >-
        (ansible_distribution_major_version | string)
        in (librenms_supported_distribution_major_versions[ansible_distribution] | default([]))
      - >-
        librenms_platform_min_version | length == 0
        or ansible_distribution_version
        is version(librenms_platform_min_version, '>=')
      - ansible_architecture in librenms_supported_architectures
    fail_msg: >-
      {{ ansible_distribution }} {{ ansible_distribution_version }} on
      {{ ansible_architecture }} is outside the declared production platform
      matrix. Supported primary distributions and minimum versions are:
      {{ librenms_supported_distribution_min_versions }}. This check runs
      before repository or package changes. Set
      librenms_production_profile: false only for a reviewed lab or
      vendor-supported exception.
  vars:
    librenms_platform_min_version: >-
      {{
        librenms_supported_distribution_min_versions
        .get(ansible_distribution, {})
        .get(ansible_distribution_major_version | string, '')
      }}
  when: librenms_production_profile | bool

- name: Fail early when RHEL-family storage mode is unsupported
  ansible.builtin.assert:
    that:
      - librenms_rrd_mode != 'glusterfs'
    fail_msg: >-
      RHEL-family hosts cannot use the in-node GlusterFS RRD mode because the
      supported RHEL repositories do not provide a production-supported
      glusterfs-server package. Use librenms_rrd_mode: external with a
      reviewed NFS/NFSv4 source for HA, or local RRD storage for standalone
      deployments.
  when:
    - ansible_os_family == 'RedHat'
    - librenms_rrd_mode == 'glusterfs'

- name: Require shared NFS RRD storage for RHEL-family HA
  ansible.builtin.assert:
    that:
      - librenms_rrd_mode == 'external'
      - librenms_external_rrd_fstype in ['nfs', 'nfs4']
    fail_msg: >-
      RHEL-family HA deployments require externally managed NFS/NFSv4 RRD
      storage. Local RRD storage cannot be shared safely by multiple LibreNMS
      web nodes. Set librenms_rrd_mode: external, provide a reviewed
      librenms_external_rrd_source, and keep librenms_uid/librenms_gid identical
      on every node.
  when:
    - ansible_os_family == 'RedHat'
    - librenms_mode == 'ha'

- name: Build active inventory host lists
  set_fact:
    librenms_active_web_nodes: >-
      {{
        groups.get('librenms_web', groups.get('librenms_nodes', []))
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_db_nodes: >-
      {{
        groups.get('librenms_db', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_redis_nodes: >-
      {{
        groups.get('librenms_redis', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_lb_nodes: >-
      {{
        groups.get('lb_nodes', [])
        | difference(librenms_inactive_inventory_nodes)
      }}
    librenms_active_gluster_nodes: >-
      {{
        groups.get('gluster_nodes', [])
        | difference(librenms_inactive_inventory_nodes)
      }}

- name: Determine effective HAProxy web health-check host
  set_fact:
    librenms_haproxy_web_check_host_effective: >-
      {{
        librenms_haproxy_web_check_host
        if librenms_haproxy_web_check_host | length > 0
        else
        (
          librenms_fqdn
          if librenms_fqdn | length > 0 and librenms_fqdn != librenms_default_fqdn_placeholder
          else (
            librenms_vip_ip
            if librenms_vip_enabled and librenms_vip_ip | length > 0
            else inventory_hostname
          )
        )
      }}

- name: Validate APP_KEY has been set
  assert:
    that:
      - librenms_app_key != 'CHANGE_ME'
      - (librenms_app_key | length) > 8
    fail_msg: "Set librenms_app_key before running the playbook."

- name: Validate Galera node count when enabled
  assert:
    that:
      - (librenms_active_db_nodes | length) >= 3
    fail_msg: "Galera mode expects at least 3 active DB nodes."
  when: librenms_db_mode == 'galera'

- name: Validate Redis Sentinel node count when enabled
  assert:
    that:
      - (librenms_active_redis_nodes | length) >= 3
    fail_msg: "Redis Sentinel mode expects at least 3 active Redis nodes."
  when: librenms_redis_mode == 'sentinel'

- name: Validate DB access pattern for Galera
  assert:
    that:
      - librenms_db_host | length > 0 or librenms_vip_enabled | bool or (librenms_active_lb_nodes | length) > 0
    fail_msg: "Galera mode requires an explicit DB host, VIP, or lb_nodes frontend."
  when: librenms_db_mode == 'galera'

- name: Check whether Ubuntu deb822 sources already include universe
  shell: |
    if [ ! -f /etc/apt/sources.list.d/ubuntu.sources ]; then
      exit 1
    fi
    awk '
      /^Suites:/ {
        suite = ($0 ~ /(^|[[:space:]]){{ ansible_distribution_release }}([[:space:]]|$)/)
      }
      /^Components:/ && suite && $0 ~ /(^|[[:space:]])universe([[:space:]]|$)/ {
        found = 1
      }
      END { exit found ? 0 : 1 }
    ' /etc/apt/sources.list.d/ubuntu.sources
  args:
    executable: /bin/bash
  register: librenms_ubuntu_sources_universe
  changed_when: false
  failed_when: false
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool

- name: Check for legacy Ubuntu universe source file
  stat:
    path: /etc/apt/sources.list.d/archive_ubuntu_com_ubuntu.list
  register: librenms_ubuntu_legacy_universe_source
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool

- name: Remove duplicate Ubuntu universe source when deb822 already provides it
  lineinfile:
    path: /etc/apt/sources.list.d/archive_ubuntu_com_ubuntu.list
    regexp: "^deb\\s+https?://archive\\.ubuntu\\.com/ubuntu\\s+{{ ansible_distribution_release }}\\s+universe\\s*$"
    state: absent
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) == 0
    - librenms_ubuntu_legacy_universe_source.stat.exists | default(false)

- name: Install deb822 repository management dependency
  apt:
    name: python3-debian
    state: present
    update_cache: false
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) != 0

- name: Configure Ubuntu universe repository
  deb822_repository:
    name: librenms-ubuntu-universe
    types:
      - deb
    uris: http://archive.ubuntu.com/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components:
      - universe
    state: present
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution == 'Ubuntu'
    - librenms_enable_extra_repos | bool
    - (librenms_ubuntu_sources_universe.rc | default(1)) != 0

- name: Install Ubuntu 22 PHP repository prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: false
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Ensure the Ubuntu PHP APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Remove the legacy Ondrej PHP trusted key import
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/ondrej-ubuntu-php.gpg
    state: absent
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Find legacy Ondrej PHP source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*ondrej*php*'
    file_type: file
  register: librenms_ubuntu_php_legacy_sources
  changed_when: false
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Remove legacy Ondrej PHP source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ librenms_ubuntu_php_legacy_sources.files | default([]) }}"
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool
    - item.path != librenms_ubuntu_php_repository_source_file

- name: Install the verified Ondrej PHP signing key
  ansible.builtin.get_url:
    url: "{{ librenms_ubuntu_php_repository_key_url }}"
    dest: "{{ librenms_ubuntu_php_repository_keyring }}"
    owner: root
    group: root
    mode: '0644'
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Read the Ondrej PHP signing-key fingerprint
  ansible.builtin.shell: |
    set -o pipefail
    gpg --batch --show-keys --with-colons "{{ librenms_ubuntu_php_repository_keyring }}" |
      awk -F: '$1 == "fpr" { print toupper($10); exit }'
  args:
    executable: /bin/bash
  register: librenms_ubuntu_php_key_fingerprint
  changed_when: false
  check_mode: false
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Validate the Ondrej PHP signing-key fingerprint
  ansible.builtin.assert:
    that:
      - librenms_ubuntu_php_key_fingerprint.stdout | trim == librenms_ubuntu_php_repository_key_fingerprint
    fail_msg: >-
      The downloaded Ondrej PHP signing key fingerprint does not match the pinned
      fingerprint. Refusing to configure the PHP repository.
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Configure the supported PHP stream for Ubuntu 22
  ansible.builtin.copy:
    dest: "{{ librenms_ubuntu_php_repository_source_file }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: {{ librenms_ubuntu_php_repository_uri }}
      Suites: {{ ansible_distribution_release }}
      Components: main
      Signed-By: {{ librenms_ubuntu_php_repository_keyring }}
  when:
    - ansible_distribution == 'Ubuntu'
    - (ansible_distribution_major_version | int) == 22
    - librenms_enable_extra_repos | bool
    - librenms_ubuntu_php_repository_enabled | bool

- name: Refresh apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Configure RedHat-family supplemental repositories
  include_tasks: redhat_repos.yml
  when:
    - ansible_os_family == 'RedHat'
    - librenms_enable_extra_repos | bool

- name: Install base packages
  package:
    name: "{{ librenms_base_packages + librenms_common_extra_packages }}"
    state: present
  when: >-
    not (
      ansible_os_family == 'RedHat'
      and (ansible_distribution_major_version | int) == 8
      and (librenms_rhel8_package_cli_fallback | default(true) | bool)
    )

- name: Install base packages through native DNF on RHEL 8
  ansible.builtin.command:
    argv: >-
      {{
        ['dnf', '-y', 'install']
        + (librenms_base_packages + librenms_common_extra_packages)
      }}
  register: librenms_rhel8_base_package_install
  changed_when: >-
    'Nothing to do' not in
    ((librenms_rhel8_base_package_install.stdout | default('')) ~
    (librenms_rhel8_base_package_install.stderr | default('')))
  when: >-
    ansible_os_family == 'RedHat'
    and (ansible_distribution_major_version | int) == 8
    and (librenms_rhel8_package_cli_fallback | default(true) | bool)

- name: Validate supported operating-system and runtime versions
  include_tasks: runtime_support.yml
  when: librenms_runtime_support_enabled | bool

- name: Detect hardware clock utility
  ansible.builtin.stat:
    path: /usr/sbin/hwclock
  register: librenms_hwclock_probe

- name: Detect timedatectl utility
  ansible.builtin.stat:
    path: /usr/bin/timedatectl
  register: librenms_timedatectl_probe

- name: Set system timezone with community timezone module
  community.general.timezone:
    name: "{{ librenms_timezone }}"
    hwclock: "{{ librenms_timezone_hwclock | default(omit, true) }}"
  when: librenms_hwclock_probe.stat.exists

- name: Read current system timezone without hardware clock utility
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=Timezone
      - --value
  register: librenms_current_timezone
  changed_when: false
  failed_when: false
  when:
    - not librenms_hwclock_probe.stat.exists
    - librenms_timedatectl_probe.stat.exists

- name: Set system timezone with timedatectl
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ librenms_timezone }}"
  register: librenms_timedatectl_set
  changed_when: librenms_timedatectl_set.rc == 0
  failed_when: false
  when:
    - not librenms_hwclock_probe.stat.exists
    - librenms_timedatectl_probe.stat.exists
    - librenms_current_timezone.stdout | trim != librenms_timezone

- name: Validate timezone data for direct timezone fallback
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ librenms_timezone }}"
  register: librenms_timezone_file
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Require timezone data for direct timezone fallback
  ansible.builtin.assert:
    that:
      - librenms_timezone_file.stat.exists
    fail_msg: "Timezone data was not found for {{ librenms_timezone }}."
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Set system timezone with direct localtime fallback
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ librenms_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when:
    - not librenms_hwclock_probe.stat.exists
    - >-
      not librenms_timedatectl_probe.stat.exists
      or (librenms_timedatectl_set.rc | default(0)) != 0

- name: Ensure state directory exists
  file:
    path: "{{ librenms_galera_bootstrap_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
