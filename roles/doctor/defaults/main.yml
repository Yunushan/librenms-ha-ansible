---
librenms_doctor_fail_on_warnings: false
librenms_doctor_fail_on_time_unsync: true
librenms_doctor_min_memory_mb: >-
  {{
    4096
    if librenms_mode in ['cluster', 'ha']
    else 2048
  }}
librenms_doctor_min_root_free_mb: 5120
librenms_doctor_min_librenms_free_mb: 10240
librenms_doctor_primary_support_tiers:
  - primary
  - primary-ish
  - strong-best-effort
librenms_doctor_best_effort_support_tiers:
  - best-effort
librenms_doctor_placeholder_patterns:
  - CHANGE_ME
  - CHANGEME
  - librenms.example.com
  - example.com
librenms_doctor_required_commands:
  - ip
  - ss
  - df
librenms_doctor_required_systemd_commands:
  - systemctl
  - timedatectl

librenms_doctor_network_route_checks_enabled: true
librenms_doctor_network_tcp_checks_enabled: false
librenms_doctor_network_check_timeout: 3
librenms_doctor_network_web_backend_port: 80
# Galera's 4444 SST and 4568 IST listeners are transfer-scoped: they are
# normally closed and are opened when a state transfer is negotiated. Keep
# the live doctor matrix limited to persistent listeners; add the transfer
# ports explicitly for a deliberate, time-bounded SST/IST observation.
librenms_doctor_network_galera_tcp_ports:
  - 3306
  - 4567
librenms_doctor_network_redis_tcp_ports:
  - 6379
  - 26379
# Gluster's persistent TCP management listener is 24007. TCP/24008 is used
# for RDMA-capable deployments and is not a listener on this project's normal
# TCP-only Gluster nodes; add it explicitly when that transport is configured.
librenms_doctor_network_gluster_tcp_ports:
  - 24007
librenms_doctor_network_check_gluster_brick_ports: false
librenms_doctor_network_gluster_brick_probe_ports:
  - 49152
  - 49251

librenms_doctor_ha_required_lb_nodes: 2
librenms_doctor_ha_required_app_nodes: 2
librenms_doctor_ha_required_db_nodes: 3
librenms_doctor_ha_required_redis_nodes: 3
librenms_doctor_ha_required_gluster_nodes: 3
