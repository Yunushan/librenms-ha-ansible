---
# This role is intentionally opt-in. It is a runtime recovery tool, not a
# replacement for site.yml or galera-recover.yml.
librenms_fast_repair_confirm: false
librenms_fast_repair_command_timeout: 20
librenms_fast_repair_probe_timeout: 5
librenms_fast_repair_poll_delay: 1
librenms_fast_repair_max_attempts: 20
librenms_fast_repair_manager_attempts: 12
librenms_fast_repair_manager_probe_timeout: 10
librenms_fast_repair_mount_repair_enabled: true
librenms_fast_repair_lazy_unmount_enabled: true
librenms_fast_repair_rrd_mountpoint: "{{ librenms_gluster_mountpoint | default(librenms_install_dir ~ '/rrd') }}"
librenms_fast_repair_rrd_mode: "{{ librenms_rrd_mode | default('local') }}"
librenms_fast_repair_rrdcached_service: "{{ librenms_rrdcached_service_name | default('rrdcached') }}"
librenms_fast_repair_rrdcached_pidfile: "{{ librenms_rrdcached_pidfile | default('/run/rrdcached.pid') }}"
librenms_fast_repair_rrdcached_socket: "{{ librenms_rrdcached_socket | default('/run/rrdcached.sock') }}"
librenms_fast_repair_rrdcached_stable_attempts: 5
librenms_fast_repair_rrdcached_required: >-
  {{
    librenms_manage_rrdcached | default(true) | bool
    and (
      librenms_rrdcached_scope | default('all') == 'all'
      or (
        librenms_rrdcached_scope | default('all') == 'primary'
        and inventory_hostname == (
          groups.get('librenms_nodes', [])
          | difference(librenms_inactive_inventory_nodes | default([]))
          | first
          | default('')
        )
      )
    )
  }}
librenms_fast_repair_user: "{{ librenms_user | default('librenms') }}"
librenms_fast_repair_install_dir: "{{ librenms_install_dir | default('/opt/librenms') }}"
librenms_fast_repair_env_path: "{{ librenms_fast_repair_install_dir }}/.env"
librenms_fast_repair_runtime_wait_path: "{{ librenms_dispatcher_runtime_wait_path | default('/usr/local/sbin/librenms-ha-runtime-wait') }}"
librenms_fast_repair_dispatcher_recover_path: /usr/local/sbin/librenms-dispatcher-ha-recover
librenms_fast_repair_dispatcher_recovery_attempts: 3
librenms_fast_repair_dispatcher_recovery_delay: 3
librenms_fast_repair_dispatcher_recovery_enabled: >-
  {{
    librenms_manage_dispatcher | default(true) | bool
    and librenms_dispatcher_failover_recovery_enabled | default(true) | bool
  }}
librenms_fast_repair_dispatcher_prune_unreachable_nodes: >-
  {{ librenms_dispatcher_failover_prune_unreachable_nodes | default(false) | bool }}
librenms_fast_repair_runtime_gate_timeout: 45
librenms_fast_repair_local_galera_runtime: >-
  {{
    librenms_db_mode | default('local') == 'galera'
    and librenms_db_host | default('') | length == 0
    and librenms_runtime_db_prefer_local_galera | default(false) | bool
    and inventory_hostname in groups.get('librenms_db', [])
    and inventory_hostname not in groups.get('maintenance_nodes', [])
    and inventory_hostname not in groups.get('decommission_nodes', [])
  }}
librenms_fast_repair_reconcile_runtime_db_endpoint: >-
  {{ librenms_fast_repair_local_galera_runtime | bool }}
librenms_fast_repair_db_host: >-
  {{
    librenms_db_host
    if librenms_db_host | default('') | length > 0
    else
    (
      '127.0.0.1'
      if librenms_db_mode | default('local') == 'local'
      else
      (
        ansible_host | default(inventory_hostname)
        if librenms_fast_repair_local_galera_runtime | bool
        else
        (
          librenms_vip_ip
          if (
            librenms_db_mode | default('local') == 'galera'
            and librenms_vip_enabled | default(false) | bool
            and librenms_vip_ip | default('') | length > 0
          )
          else (
            hostvars[(groups.get('librenms_db', []) | first)].ansible_host
            | default(groups.get('librenms_db', []) | first)
            if (groups.get('librenms_db', []) | length > 0)
            else (ansible_host | default(inventory_hostname))
          )
        )
      )
    )
  }}
librenms_fast_repair_db_port: "{{ librenms_db_port | default(3306) }}"
librenms_fast_repair_readiness_host: "{{ ansible_host | default(inventory_hostname) }}"
librenms_fast_repair_readiness_port: "{{ librenms_galera_readiness_agent_port | default(9201) }}"
librenms_fast_repair_readiness_path: >-
  {{ librenms_galera_readiness_agent_path | default('/usr/local/sbin/librenms-galera-readiness-agent') }}
librenms_fast_repair_readiness_reset_path: /usr/local/sbin/librenms-galera-readiness-agent-reset
librenms_fast_repair_readiness_socket_unit: >-
  {{ librenms_galera_readiness_agent_socket_unit | default('librenms-galera-readiness-agent.socket') }}
