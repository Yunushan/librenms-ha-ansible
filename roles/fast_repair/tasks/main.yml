---
- name: Run bounded LibreNMS HA runtime repair without database bootstrap
  ansible.builtin.raw: |
    set -u

    REPAIR_TIMEOUT={{ librenms_fast_repair_command_timeout | int }}
    PROBE_TIMEOUT={{ librenms_fast_repair_probe_timeout | int }}
    POLL_DELAY={{ librenms_fast_repair_poll_delay | int }}
    MAX_ATTEMPTS={{ librenms_fast_repair_max_attempts | int }}
    MANAGER_ATTEMPTS={{ librenms_fast_repair_manager_attempts | int }}
    MANAGER_PROBE_TIMEOUT={{ librenms_fast_repair_manager_probe_timeout | int }}
    RRD_PATH={{ librenms_fast_repair_rrd_mountpoint | quote }}
    GLUSTER_VOLUME={{ librenms_gluster_volume_name | default('librenms-rrd') | quote }}
    RRD_MODE={{ librenms_fast_repair_rrd_mode | quote }}
    RRDCACHED_SERVICE={{ librenms_fast_repair_rrdcached_service | quote }}
    RRDCACHED_PIDFILE={{ librenms_fast_repair_rrdcached_pidfile | quote }}
    RRDCACHED_SOCKET={{ librenms_fast_repair_rrdcached_socket | quote }}
    RRDCACHED_STABLE_ATTEMPTS={{ librenms_fast_repair_rrdcached_stable_attempts | int }}
    RRDCACHED_REQUIRED={{ librenms_fast_repair_rrdcached_required | bool | ternary('true', 'false') | quote }}
    LIBRENMS_USER={{ librenms_fast_repair_user | quote }}
    LIBRENMS_DIR={{ librenms_fast_repair_install_dir | quote }}
    LIBRENMS_ENV_PATH={{ librenms_fast_repair_env_path | quote }}
    REPAIR_MOUNT={{ librenms_fast_repair_mount_repair_enabled | bool | ternary('true', 'false') | quote }}
    LAZY_UNMOUNT={{ librenms_fast_repair_lazy_unmount_enabled | bool | ternary('true', 'false') | quote }}
    CONFIRM={{ librenms_fast_repair_confirm | bool | ternary('true', 'false') | quote }}
    DB_MODE={{ librenms_db_mode | default('local') | quote }}
    DB_HOST={{ librenms_fast_repair_db_host | quote }}
    DB_PORT={{ librenms_fast_repair_db_port | int }}
    RECONCILE_RUNTIME_DB={{ librenms_fast_repair_reconcile_runtime_db_endpoint | bool | ternary('true', 'false') | quote }}
    REDIS_MODE={{ librenms_redis_mode | default('local') | quote }}
    RUNTIME_WAIT_PATH={{ librenms_fast_repair_runtime_wait_path | quote }}
    DISPATCHER_RECOVER_PATH={{ librenms_fast_repair_dispatcher_recover_path | quote }}
    DISPATCHER_RECOVERY_ATTEMPTS={{ librenms_fast_repair_dispatcher_recovery_attempts | int }}
    DISPATCHER_RECOVERY_DELAY={{ librenms_fast_repair_dispatcher_recovery_delay | int }}
    DISPATCHER_RECOVERY_ENABLED={{ librenms_fast_repair_dispatcher_recovery_enabled | bool | ternary('true', 'false') | quote }}
    DISPATCHER_PRUNE_UNREACHABLE={{ librenms_fast_repair_dispatcher_prune_unreachable_nodes | bool | ternary('True', 'False') | quote }}
    RUNTIME_GATE_TIMEOUT={{ librenms_fast_repair_runtime_gate_timeout | int }}
    READINESS_HOST={{ librenms_fast_repair_readiness_host | quote }}
    READINESS_PORT={{ librenms_fast_repair_readiness_port | int }}
    READINESS_PATH={{ librenms_fast_repair_readiness_path | quote }}
    READINESS_RESET_PATH={{ librenms_fast_repair_readiness_reset_path | quote }}
    READINESS_SOCKET_UNIT={{ librenms_fast_repair_readiness_socket_unit | quote }}
    CGROUP_ROOT=/sys/fs/cgroup

    REPAIR_FAILURE=0
    REPAIR_CHANGED=0
    RRD_MOUNT_CHANGED=0
    RRD_SHARED=false
    RRD_READY=false
    RRDCACHED_READY=false
    GALERA_READY=true
    DB_ENDPOINT_READY=true
    RUNTIME_READY=false
    LIBRENMS_READY=false
    RUNTIME_DB_CHANGED=0
    RUNTIME_ENV_CHANGED=0
    LAST_REPLACE_CHANGED=0
    case "${RRD_MODE}" in
      glusterfs|external|external_nfs|nfs) RRD_SHARED=true ;;
    esac

    bounded() {
      timeout --foreground --kill-after=5s "${REPAIR_TIMEOUT}s" "$@"
    }

    probe() {
      timeout --foreground --kill-after=2s "${PROBE_TIMEOUT}s" "$@"
    }

    manager_ready() {
      timeout --foreground --kill-after=2s "${MANAGER_PROBE_TIMEOUT}s" \
        systemctl show --property=Version --value >/dev/null 2>&1
    }

    wait_for_manager() {
      attempt=1
      while [ "${attempt}" -le "${MANAGER_ATTEMPTS}" ]; do
        if manager_ready; then
          return 0
        fi
        sleep "${POLL_DELAY}"
        attempt=$((attempt + 1))
      done
      return 1
    }

    systemctl_bounded() {
      if ! wait_for_manager; then
        echo "systemd manager did not become responsive before: systemctl $*" >&2
        return 124
      fi
      bounded systemctl "$@"
    }

    unit_exists() {
      unit_name="$1"
      unit_load_state="$(
        probe systemctl show "${unit_name}" --property=LoadState --value 2>/dev/null |
          tr -d '[:space:]' || true
      )"

      if [ -z "${unit_load_state}" ] || [ "${unit_load_state}" = not-found ]; then
        case "${unit_name}" in
          *.*) return 1 ;;
        esac
        unit_load_state="$(
          probe systemctl show "${unit_name}.service" --property=LoadState --value 2>/dev/null |
            tr -d '[:space:]' || true
        )"
      fi

      [ -n "${unit_load_state}" ] && [ "${unit_load_state}" != not-found ]
    }

    unit_state() {
      state="$(probe systemctl show "$1" --property=ActiveState --value 2>/dev/null || true)"
      printf '%s\n' "${state:-unknown}"
    }

    unit_is_active() {
      [ "$(unit_state "$1")" = active ]
    }

    wait_until_active() {
      attempt=1
      while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
        state="$(unit_state "$1")"
        case "${state}" in
          active) return 0 ;;
          failed|inactive|unknown) return 1 ;;
        esac
        sleep "${POLL_DELAY}"
        attempt=$((attempt + 1))
      done
      return 1
    }

    wait_until_stably_active() {
      stable_unit="$1"
      stable_attempts="$2"
      stable_attempt=1
      while [ "${stable_attempt}" -le "${stable_attempts}" ]; do
        [ "$(unit_state "${stable_unit}")" = active ] || return 1
        [ "${stable_attempt}" -lt "${stable_attempts}" ] && sleep "${POLL_DELAY}"
        stable_attempt=$((stable_attempt + 1))
      done
      return 0
    }

    unit_stop_snapshot() {
      probe systemctl show "$1" --no-pager \
        --property=ActiveState,SubState,MainPID,ControlPID,ControlGroup 2>/dev/null |
        awk -F= '
          $1 == "ActiveState" { active_state=$2 }
          $1 == "SubState" { sub_state=$2 }
          $1 == "MainPID" { main_pid=$2 }
          $1 == "ControlPID" { control_pid=$2 }
          $1 == "ControlGroup" { control_group=$2 }
          END {
            printf "%s|%s|%s|%s|%s\n", active_state, sub_state, main_pid, control_pid, control_group
          }
        '
    }

    unit_cgroup_has_processes() {
      unit_control_group="$1"
      case "${unit_control_group}" in
        /system.slice/*) ;;
        *) return 1 ;;
      esac

      cgroup_events_file="${CGROUP_ROOT}${unit_control_group}/cgroup.events"
      if [ -r "${cgroup_events_file}" ]; then
        grep -Eq '^populated[[:space:]]+1$' "${cgroup_events_file}"
        return $?
      fi

      for cgroup_process_file in \
        "${CGROUP_ROOT}${unit_control_group}/cgroup.procs" \
        "${CGROUP_ROOT}/systemd${unit_control_group}/tasks"; do
        [ -r "${cgroup_process_file}" ] || continue
        grep -Eq '^[[:space:]]*[0-9]+[[:space:]]*$' "${cgroup_process_file}"
        return $?
      done
      return 1
    }

    wait_until_stopped() {
      stopped_unit="$1"
      stopped_attempts="$2"
      stopped_attempt=1
      while [ "${stopped_attempt}" -le "${stopped_attempts}" ]; do
        stopped_snapshot="$(unit_stop_snapshot "${stopped_unit}")"
        stopped_state="${stopped_snapshot%%|*}"
        stopped_remainder="${stopped_snapshot#*|}"
        stopped_substate="${stopped_remainder%%|*}"
        stopped_remainder="${stopped_remainder#*|}"
        stopped_main_pid="${stopped_remainder%%|*}"
        stopped_remainder="${stopped_remainder#*|}"
        stopped_control_pid="${stopped_remainder%%|*}"
        stopped_control_group="${stopped_remainder#*|}"

        if [ "${stopped_state}" = inactive ] && \
           [ "${stopped_main_pid}" = 0 ] && \
           [ "${stopped_control_pid}" = 0 ]; then
          if unit_cgroup_has_processes "${stopped_control_group}"; then
            # MainPID can already be zero while a daemon left behind by a
            # generated SysV unit is still alive in the service cgroup.
            # Let stop_stuck_service escalate against that cgroup before any
            # PID or socket file is removed.
            return 1
          fi
          return 0
        fi

        case "${stopped_state}:${stopped_substate}" in
          failed:*|*:auto-restart)
            # A failed unit with Restart=on-failure is not stopped yet. Cancel
            # the queued restart and clear the failed transition before retrying.
            systemctl_bounded stop --no-block "${stopped_unit}" >/dev/null 2>&1 || true
            systemctl_bounded reset-failed "${stopped_unit}" >/dev/null 2>&1 || true
            ;;
        esac
        sleep "${POLL_DELAY}"
        stopped_attempt=$((stopped_attempt + 1))
      done
      return 1
    }

    print_unit_diagnostics() {
      unit="$1"
      echo "--- ${unit} properties ---" >&2
      probe systemctl show "${unit}" --no-pager \
        --property=ActiveState,SubState,Result,ControlPID,MainPID,ExecMainCode,ExecMainStatus >&2 || true
      echo "--- ${unit} status ---" >&2
      probe systemctl status "${unit}" --no-pager --full >&2 || true
      echo "--- ${unit} recent journal ---" >&2
      probe journalctl -u "${unit}" --since=-10min --no-pager -n 80 >&2 || true
      if [ "${unit}" = librenms.service ] && [ -x "${RUNTIME_WAIT_PATH}" ]; then
        echo "--- librenms.service runtime gate ---" >&2
        runtime_gate_output="$(bounded "${RUNTIME_WAIT_PATH}" 2>&1)"
        runtime_gate_rc=$?
        [ -z "${runtime_gate_output}" ] || printf '%s\n' "${runtime_gate_output}" >&2
        echo "runtime gate rc=${runtime_gate_rc}" >&2
      fi
    }

    local_galera_state() {
      probe mysql --protocol=socket --batch --skip-column-names -e \
        "SHOW GLOBAL STATUS WHERE Variable_name IN ('wsrep_cluster_status','wsrep_local_state_comment');" \
        2>/dev/null | awk '
          $1 == "wsrep_cluster_status" { cluster_status=$2 }
          $1 == "wsrep_local_state_comment" { local_state=$2 }
          END {
            if (cluster_status != "" && local_state != "") {
              print cluster_status "|" local_state
            }
          }
        '
    }

    wait_for_local_galera() {
      wsrep=""
      attempt=1
      while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
        wsrep="$(local_galera_state || true)"
        if [ "${wsrep}" = 'Primary|Synced' ]; then
          echo "Galera local state: Primary|Synced"
          return 0
        fi
        [ "${attempt}" -lt "${MAX_ATTEMPTS}" ] && sleep "${POLL_DELAY}"
        attempt=$((attempt + 1))
      done

      echo "Galera is not Primary/Synced after ${MAX_ATTEMPTS} bounded probes;" \
        "fast repair will not bootstrap it (state: ${wsrep:-unavailable})" >&2
      return 1
    }

    preserve_replacement_metadata() {
      source_path="$1"
      replacement_path="$2"

      chmod --reference="${source_path}" "${replacement_path}" || return 1
      chown --reference="${source_path}" "${replacement_path}" || return 1
      if command -v chcon >/dev/null 2>&1; then
        chcon --reference="${source_path}" "${replacement_path}" >/dev/null 2>&1 || true
      fi
    }

    replace_shell_assignment() {
      assignment_path="$1"
      assignment_key="$2"
      assignment_value="$3"
      LAST_REPLACE_CHANGED=0

      [ -f "${assignment_path}" ] || {
        echo "runtime configuration file is missing: ${assignment_path}" >&2
        return 1
      }
      replacement_dir="$(dirname -- "${assignment_path}")"
      replacement_base="$(basename -- "${assignment_path}")"
      replacement_path="$(mktemp "${replacement_dir}/.${replacement_base}.fast-repair.XXXXXX")" || return 1

      if ! awk -v key="${assignment_key}" -v value="${assignment_value}" '
        BEGIN { matches=0 }
        $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
          print key "=" value
          matches++
          next
        }
        { print }
        END { if (matches != 1) exit 42 }
      ' "${assignment_path}" > "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        echo "could not locate one ${assignment_key} assignment in ${assignment_path}" >&2
        return 1
      fi

      if cmp -s -- "${assignment_path}" "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        return 0
      fi
      if ! preserve_replacement_metadata "${assignment_path}" "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        return 1
      fi
      mv -f -- "${replacement_path}" "${assignment_path}" || return 1
      LAST_REPLACE_CHANGED=1
      REPAIR_CHANGED=1
    }

    upsert_shell_assignment_after() {
      assignment_path="$1"
      assignment_key="$2"
      assignment_value="$3"
      anchor_key="$4"
      LAST_REPLACE_CHANGED=0

      [ -f "${assignment_path}" ] || {
        echo "runtime configuration file is missing: ${assignment_path}" >&2
        return 1
      }

      assignment_count="$(awk -v key="${assignment_key}" '
        $0 ~ "^[[:space:]]*" key "[[:space:]]*=" { matches++ }
        END { print matches + 0 }
      ' "${assignment_path}")" || return 1
      case "${assignment_count}" in
        1)
          replace_shell_assignment \
            "${assignment_path}" "${assignment_key}" "${assignment_value}"
          return $?
          ;;
        0)
          ;;
        *)
          echo "found duplicate ${assignment_key} assignments in ${assignment_path}" >&2
          return 1
          ;;
      esac

      anchor_count="$(awk -v key="${anchor_key}" '
        $0 ~ "^[[:space:]]*" key "[[:space:]]*=" { matches++ }
        END { print matches + 0 }
      ' "${assignment_path}")" || return 1
      if [ "${anchor_count}" -ne 1 ]; then
        echo "could not locate one ${anchor_key} anchor in ${assignment_path}" >&2
        return 1
      fi

      replacement_dir="$(dirname -- "${assignment_path}")"
      replacement_base="$(basename -- "${assignment_path}")"
      replacement_path="$(mktemp "${replacement_dir}/.${replacement_base}.fast-repair.XXXXXX")" || return 1
      if ! awk \
        -v anchor="${anchor_key}" \
        -v key="${assignment_key}" \
        -v value="${assignment_value}" '
        $0 ~ "^[[:space:]]*" anchor "[[:space:]]*=" {
          print
          print key "=" value
          inserted++
          next
        }
        { print }
        END { if (inserted != 1) exit 42 }
      ' "${assignment_path}" > "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        echo "could not insert ${assignment_key} in ${assignment_path}" >&2
        return 1
      fi
      if ! preserve_replacement_metadata "${assignment_path}" "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        return 1
      fi
      mv -f -- "${replacement_path}" "${assignment_path}" || return 1
      LAST_REPLACE_CHANGED=1
      REPAIR_CHANGED=1
    }

    replace_python_string_assignment() {
      assignment_path="$1"
      assignment_key="$2"
      assignment_value="$3"
      LAST_REPLACE_CHANGED=0

      [ -f "${assignment_path}" ] || return 0
      replacement_dir="$(dirname -- "${assignment_path}")"
      replacement_base="$(basename -- "${assignment_path}")"
      replacement_path="$(mktemp "${replacement_dir}/.${replacement_base}.fast-repair.XXXXXX")" || return 1

      if ! awk -v key="${assignment_key}" -v value="${assignment_value}" '
        BEGIN { matches=0 }
        $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
          print key " = \"" value "\""
          matches++
          next
        }
        { print }
        END { if (matches != 1) exit 42 }
      ' "${assignment_path}" > "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        echo "could not locate one ${assignment_key} assignment in ${assignment_path}" >&2
        return 1
      fi

      if cmp -s -- "${assignment_path}" "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        return 0
      fi
      if ! preserve_replacement_metadata "${assignment_path}" "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        return 1
      fi
      mv -f -- "${replacement_path}" "${assignment_path}" || return 1
      LAST_REPLACE_CHANGED=1
      REPAIR_CHANGED=1
    }

    replace_python_bool_assignment() {
      assignment_path="$1"
      assignment_key="$2"
      assignment_value="$3"
      LAST_REPLACE_CHANGED=0

      case "${assignment_value}" in
        True|False) ;;
        *)
          echo "refusing invalid Python boolean for ${assignment_key}: ${assignment_value}" >&2
          return 1
          ;;
      esac
      [ -f "${assignment_path}" ] || {
        echo "dispatcher recovery helper is missing: ${assignment_path}" >&2
        return 1
      }
      replacement_dir="$(dirname -- "${assignment_path}")"
      replacement_base="$(basename -- "${assignment_path}")"
      replacement_path="$(mktemp "${replacement_dir}/.${replacement_base}.fast-repair.XXXXXX")" || return 1

      if ! awk -v key="${assignment_key}" -v value="${assignment_value}" '
        BEGIN { matches=0 }
        $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
          print key " = " value
          matches++
          next
        }
        { print }
        END { if (matches != 1) exit 42 }
      ' "${assignment_path}" > "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        echo "could not locate one ${assignment_key} assignment in ${assignment_path}" >&2
        return 1
      fi

      if cmp -s -- "${assignment_path}" "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        return 0
      fi
      if ! preserve_replacement_metadata "${assignment_path}" "${replacement_path}"; then
        rm -f -- "${replacement_path}"
        return 1
      fi
      mv -f -- "${replacement_path}" "${assignment_path}" || return 1
      LAST_REPLACE_CHANGED=1
      REPAIR_CHANGED=1
    }

    reconcile_dispatcher_recovery_policy() {
      [ "${DISPATCHER_RECOVERY_ENABLED}" = true ] || return 0
      [ -x "${DISPATCHER_RECOVER_PATH}" ] || {
        echo "dispatcher recovery helper is missing or not executable: ${DISPATCHER_RECOVER_PATH}" >&2
        return 1
      }
      replace_python_bool_assignment \
        "${DISPATCHER_RECOVER_PATH}" \
        PRUNE_UNREACHABLE_NODES \
        "${DISPATCHER_PRUNE_UNREACHABLE}"
    }

    reconcile_runtime_db_endpoint() {
      [ "${RECONCILE_RUNTIME_DB}" = true ] || return 0
      [ "${DB_MODE}" = galera ] || return 0
      [ "${GALERA_READY}" = true ] || return 1

      case "${DB_HOST}" in
        ''|*[!A-Za-z0-9_.:-]*)
          echo "refusing unsafe runtime database host value: ${DB_HOST:-<empty>}" >&2
          return 1
          ;;
      esac

      echo "reconciling LibreNMS runtime database endpoint to ${DB_HOST}:${DB_PORT}"
      replace_shell_assignment "${RUNTIME_WAIT_PATH}" DB_HOST "${DB_HOST}" || return 1
      [ "${LAST_REPLACE_CHANGED}" -eq 0 ] || RUNTIME_DB_CHANGED=1
      upsert_shell_assignment_after \
        "${RUNTIME_WAIT_PATH}" REQUIRE_LOCAL_GALERA_READY 1 DB_HOST || return 1
      [ "${LAST_REPLACE_CHANGED}" -eq 0 ] || RUNTIME_DB_CHANGED=1
      replace_shell_assignment "${LIBRENMS_ENV_PATH}" DB_HOST "${DB_HOST}" || return 1
      if [ "${LAST_REPLACE_CHANGED}" -ne 0 ]; then
        RUNTIME_DB_CHANGED=1
        RUNTIME_ENV_CHANGED=1
      fi
      replace_python_string_assignment "${DISPATCHER_RECOVER_PATH}" DB_HOST "${DB_HOST}" || return 1
      [ "${LAST_REPLACE_CHANGED}" -eq 0 ] || RUNTIME_DB_CHANGED=1

      if [ "${RUNTIME_ENV_CHANGED}" -ne 0 ]; then
        config_cache_path="${LIBRENMS_DIR}/bootstrap/cache/config.php"
        case "${config_cache_path}" in
          /opt/librenms/bootstrap/cache/config.php|*/librenms/bootstrap/cache/config.php)
            if [ -f "${config_cache_path}" ]; then
              rm -f -- "${config_cache_path}" || return 1
              echo "cleared stale LibreNMS configuration cache"
            fi
            ;;
          *)
            echo "refusing unsafe LibreNMS config cache path: ${config_cache_path}" >&2
            return 1
            ;;
        esac
      fi
    }

    probe_readiness_socket() {
      response="$(probe bash -c '
        exec 3<>/dev/tcp/"$1"/"$2"
        IFS= read -r response <&3
        printf "%s\n" "${response}"
      ' _ "${READINESS_HOST}" "${READINESS_PORT}" 2>/dev/null || true)"
      [ "${response}" = up ]
    }

    print_database_path_diagnostics() {
      echo "--- local Galera readiness command ---" >&2
      probe "${READINESS_PATH}" >&2 || true
      echo "--- local Galera readiness socket ---" >&2
      socket_response="$(probe bash -c '
        exec 3<>/dev/tcp/"$1"/"$2"
        IFS= read -r response <&3
        printf "%s\n" "${response}"
      ' _ "${READINESS_HOST}" "${READINESS_PORT}" 2>/dev/null || true)"
      printf 'response=%s host=%s port=%s\n' \
        "${socket_response:-<empty>}" "${READINESS_HOST}" "${READINESS_PORT}" >&2
      echo "--- readiness socket unit ---" >&2
      probe systemctl status "${READINESS_SOCKET_UNIT}" --no-pager --full >&2 || true
      echo "--- configured runtime database TCP path ---" >&2
      if probe bash -c 'exec 3<>/dev/tcp/"$1"/"$2"' _ "${DB_HOST}" "${DB_PORT}"; then
        echo "TCP connect succeeded: ${DB_HOST}:${DB_PORT}" >&2
      else
        echo "TCP connect failed: ${DB_HOST}:${DB_PORT}" >&2
      fi
      echo "--- HAProxy Galera backend events ---" >&2
      probe journalctl -u haproxy --since=-10min --no-pager -n 80 >&2 || true
    }

    repair_local_readiness() {
      [ "${DB_MODE}" = galera ] || return 0
      [ "${GALERA_READY}" = true ] || return 1

      if probe_readiness_socket; then
        return 0
      fi

      echo "repairing local Galera readiness listener at ${READINESS_HOST}:${READINESS_PORT}"
      if [ ! -x "${READINESS_RESET_PATH}" ]; then
        echo "readiness reset helper is missing: ${READINESS_RESET_PATH}" >&2
        return 1
      fi
      if ! bounded "${READINESS_RESET_PATH}"; then
        echo "readiness reset helper failed" >&2
        return 1
      fi
      if ! systemctl_bounded daemon-reload >/dev/null 2>&1; then
        echo "systemd daemon-reload failed before readiness restart" >&2
        return 1
      fi
      if ! ensure_started "${READINESS_SOCKET_UNIT}"; then
        echo "failed to start ${READINESS_SOCKET_UNIT}" >&2
        return 1
      fi

      attempt=1
      while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
        if probe_readiness_socket; then
          REPAIR_CHANGED=1
          return 0
        fi
        sleep "${POLL_DELAY}"
        attempt=$((attempt + 1))
      done

      echo "local Galera readiness listener did not report up after repair" >&2
      print_database_path_diagnostics
      return 1
    }

    refresh_php_fpm_for_runtime_db_change() {
      [ "${RUNTIME_DB_CHANGED}" -ne 0 ] || return 0

      for php_unit in ${php_units}; do
        unit_is_active "${php_unit}" || continue
        echo "gracefully reloading ${php_unit} after runtime database endpoint change"
        if ! systemctl_bounded reload "${php_unit}" >/dev/null 2>&1; then
          echo "failed to reload ${php_unit} after runtime database endpoint change" >&2
          return 1
        fi
      done
    }

    runtime_gate_ready() {
      [ -x "${RUNTIME_WAIT_PATH}" ] || {
        echo "runtime dependency gate is missing: ${RUNTIME_WAIT_PATH}" >&2
        return 1
      }

      runtime_gate_output="$(
        timeout --foreground --kill-after=5s "${RUNTIME_GATE_TIMEOUT}s" \
          "${RUNTIME_WAIT_PATH}" 2>&1
      )"
      runtime_gate_rc=$?
      if [ "${runtime_gate_rc}" -eq 0 ]; then
        return 0
      fi
      [ -z "${runtime_gate_output}" ] || printf '%s\n' "${runtime_gate_output}" >&2
      echo "runtime dependency gate failed (rc=${runtime_gate_rc})" >&2
      return 1
    }

    ensure_started() {
      unit="$1"
      unit_exists "${unit}" || return 0
      enabled_state="$(probe systemctl is-enabled "${unit}" 2>/dev/null || true)"
      case "${enabled_state}" in
        enabled|enabled-runtime|static|indirect|alias)
          ;;
        *)
          echo "enabling ${unit}"
          if ! systemctl_bounded enable "${unit}" >/dev/null 2>&1; then
            echo "failed to enable ${unit}" >&2
            return 1
          fi
          REPAIR_CHANGED=1
          ;;
      esac
      state="$(unit_state "${unit}")"
      case "${state}" in
        active) return 0 ;;
        activating)
          if wait_until_active "${unit}"; then
            return 0
          fi
          ;;
      esac
      if [ "${state}" = failed ]; then
        systemctl_bounded reset-failed "${unit}" >/dev/null 2>&1 || true
      fi
      echo "starting ${unit}"
      if ! systemctl_bounded start --no-block "${unit}"; then
        if wait_until_active "${unit}"; then
          REPAIR_CHANGED=1
          return 0
        fi
        echo "failed to start ${unit}" >&2
        print_unit_diagnostics "${unit}"
        if [ "${unit}" = librenms.service ]; then
          stop_stuck_service "${unit}" || true
        fi
        return 1
      fi
      REPAIR_CHANGED=1
      if ! wait_until_active "${unit}"; then
        echo "${unit} did not become active after startup" >&2
        print_unit_diagnostics "${unit}"
        if [ "${unit}" = librenms.service ]; then
          stop_stuck_service "${unit}" || true
        fi
        return 1
      fi
    }

    print_jobs() {
      probe systemctl list-jobs --no-legend --no-pager 2>/dev/null |
        awk '$2 ~ /^(librenms-(scheduler|dispatcher-ha-recover|ha-startup-repair)\\.(service|timer)|librenms\\.service)$/ {print}' || true
    }

    cancel_stale_jobs() {
      jobs="$(print_jobs)"
      [ -n "${jobs}" ] || return 0
      echo "stale LibreNMS systemd jobs before repair:"
      printf '%s\n' "${jobs}"
      REPAIR_CHANGED=1
      printf '%s\n' "${jobs}" | while read -r job _rest; do
        [ -n "${job}" ] || continue
        systemctl_bounded cancel "${job}" >/dev/null 2>&1 || true
      done
    }

    stop_stuck_service() {
      stop_unit="$1"

      systemctl_bounded stop --no-block "${stop_unit}" >/dev/null 2>&1 || true
      if wait_until_stopped "${stop_unit}" "${MAX_ATTEMPTS}"; then
        systemctl_bounded reset-failed "${stop_unit}" >/dev/null 2>&1 || true
        return 0
      fi

      echo "${stop_unit} remained stuck; sending SIGTERM to its service cgroup" >&2
      systemctl_bounded kill --kill-whom=all --signal=TERM "${stop_unit}" >/dev/null 2>&1 || true
      if wait_until_stopped "${stop_unit}" 5; then
        systemctl_bounded reset-failed "${stop_unit}" >/dev/null 2>&1 || true
        return 0
      fi

      echo "${stop_unit} did not stop after SIGTERM; sending SIGKILL to its service cgroup" >&2
      systemctl_bounded kill --kill-whom=all --signal=KILL "${stop_unit}" >/dev/null 2>&1 || true
      systemctl_bounded stop --no-block "${stop_unit}" >/dev/null 2>&1 || true
      if wait_until_stopped "${stop_unit}" 5; then
        systemctl_bounded reset-failed "${stop_unit}" >/dev/null 2>&1 || true
        return 0
      fi

      echo "failed to quiesce stuck ${stop_unit}; refusing to restart over its unresolved systemd job" >&2
      print_unit_diagnostics "${stop_unit}"
      return 1
    }

    quiesce_stuck_units() {
      quiesce_failed=0
      for unit in \
        librenms.service \
        librenms-scheduler.service \
        librenms-dispatcher-ha-recover.service \
        librenms-ha-startup-repair.service; do
        unit_exists "${unit}" || continue
        state="$(unit_state "${unit}")"
        case "${state}" in
          activating|deactivating)
            echo "stopping stuck ${unit} (${state})"
            REPAIR_CHANGED=1
            if ! stop_stuck_service "${unit}"; then
              quiesce_failed=1
            fi
            ;;
        esac
        systemctl_bounded reset-failed "${unit}" >/dev/null 2>&1 || true
      done
      return "${quiesce_failed}"
    }

    cleanup_stale_rrdcached_runtime() {
      pgrep_rc=0
      probe pgrep -x rrdcached >/dev/null 2>&1 || pgrep_rc=$?
      case "${pgrep_rc}" in
        0)
          echo "rrdcached still has a live process; refusing to remove runtime files" >&2
          return 1
          ;;
        1) ;;
        *)
          echo "could not prove that rrdcached has no live process (pgrep rc=${pgrep_rc})" >&2
          return 1
          ;;
      esac

      for runtime_path in "${RRDCACHED_PIDFILE}" "${RRDCACHED_SOCKET}"; do
        case "${runtime_path}" in
          /run/*|/var/run/*) ;;
          *)
            echo "refusing unsafe RRDCacheD runtime path: ${runtime_path}" >&2
            return 1
            ;;
        esac
        if [ -e "${runtime_path}" ] || [ -L "${runtime_path}" ]; then
          echo "removing stale RRDCacheD runtime file ${runtime_path}"
          rm -f -- "${runtime_path}" || return 1
          REPAIR_CHANGED=1
        fi
      done
    }

    ensure_rrdcached_started() {
      unit_exists "${RRDCACHED_SERVICE}" || {
        echo "required RRDCacheD unit is missing: ${RRDCACHED_SERVICE}" >&2
        return 1
      }

      if ensure_started "${RRDCACHED_SERVICE}" && \
         wait_until_stably_active "${RRDCACHED_SERVICE}" "${RRDCACHED_STABLE_ATTEMPTS}"; then
        return 0
      fi

      echo "${RRDCACHED_SERVICE} did not remain active; retrying after bounded runtime cleanup" >&2
      stop_stuck_service "${RRDCACHED_SERVICE}" || return 1
      cleanup_stale_rrdcached_runtime || return 1
      systemctl_bounded reset-failed "${RRDCACHED_SERVICE}" >/dev/null 2>&1 || true

      if ensure_started "${RRDCACHED_SERVICE}" && \
         wait_until_stably_active "${RRDCACHED_SERVICE}" "${RRDCACHED_STABLE_ATTEMPTS}"; then
        return 0
      fi

      echo "${RRDCACHED_SERVICE} failed its bounded stability check after cleanup" >&2
      print_unit_diagnostics "${RRDCACHED_SERVICE}"
      return 1
    }

    recover_dispatcher_registration() {
      [ "${DISPATCHER_RECOVERY_ENABLED}" = true ] || return 0
      [ -x "${DISPATCHER_RECOVER_PATH}" ] || {
        echo "dispatcher recovery helper is missing or not executable: ${DISPATCHER_RECOVER_PATH}" >&2
        return 1
      }
      unit_is_active librenms.service || {
        echo "librenms.service is not active; refusing to publish a dispatcher registration" >&2
        return 1
      }

      dispatcher_attempt=1
      dispatcher_output=""
      dispatcher_rc=1
      while [ "${dispatcher_attempt}" -le "${DISPATCHER_RECOVERY_ATTEMPTS}" ]; do
        dispatcher_output="$(bounded "${DISPATCHER_RECOVER_PATH}" 2>&1)"
        dispatcher_rc=$?
        [ -z "${dispatcher_output}" ] || printf '%s\n' "${dispatcher_output}"
        case "${dispatcher_output}" in
          *"PyMySQL is unavailable"*|*"Unable to connect to LibreNMS database"*|*"Timed out while restarting librenms.service"*)
            dispatcher_rc=1
            ;;
        esac
        if [ "${dispatcher_rc}" -eq 0 ] && unit_is_active librenms.service; then
          return 0
        fi
        [ "${dispatcher_attempt}" -lt "${DISPATCHER_RECOVERY_ATTEMPTS}" ] && \
          sleep "${DISPATCHER_RECOVERY_DELAY}"
        dispatcher_attempt=$((dispatcher_attempt + 1))
      done

      echo "local dispatcher registration recovery failed after ${DISPATCHER_RECOVERY_ATTEMPTS} attempts (rc=${dispatcher_rc})" >&2
      [ -z "${dispatcher_output}" ] || printf '%s\n' "${dispatcher_output}" >&2
      print_unit_diagnostics librenms.service
      return 1
    }

    mount_fstype() {
      probe findmnt --noheadings --mountpoint "${RRD_PATH}" --output FSTYPE 2>/dev/null || true
    }

    rrd_io_probe() {
      probe_file="${RRD_PATH}/.librenms-fast-repair-probe.$$"
      if probe runuser -u "${LIBRENMS_USER}" -- sh -c '
        probe_file=$1
        printf "%s\n" fast-repair > "${probe_file}" &&
          IFS= read -r probe_value < "${probe_file}" &&
          rm -f -- "${probe_file}" &&
          [ "${probe_value}" = fast-repair ]
      ' _ "${probe_file}"; then
        return 0
      fi
      probe rm -f -- "${probe_file}" >/dev/null 2>&1 || true
      return 1
    }

    mount_is_healthy() {
      probe test -d "${RRD_PATH}" || return 1
      fstype="$(mount_fstype | tr -d '[:space:]')"
      case "${RRD_MODE}" in
        glusterfs)
          case "${fstype}" in
            glusterfs|fuse.glusterfs) ;;
            *) return 1 ;;
          esac
          ;;
        external|external_nfs|nfs)
          case "${fstype}" in
            nfs|nfs4) ;;
            *) return 1 ;;
          esac
          ;;
        *)
          fstype="local"
          ;;
      esac
      rrd_io_probe
    }

    repair_rrd_mount() {
      if [ "${RRD_SHARED}" != true ]; then
        bounded mkdir -p "${RRD_PATH}" || return 1
        mount_is_healthy
        return $?
      fi

      if mount_is_healthy; then
        echo "RRD mount is healthy: ${RRD_PATH} ($(mount_fstype | tr -d '[:space:]'))"
        return 0
      fi
      [ "${REPAIR_MOUNT}" = true ] || {
        echo "RRD mount is not healthy and mount repair is disabled: ${RRD_PATH}" >&2
        return 1
      }

      if unit_is_active rrdcached; then
        systemctl_bounded stop rrdcached >/dev/null 2>&1 || true
        RRD_MOUNT_CHANGED=1
      fi

      current_fstype="$(mount_fstype | tr -d '[:space:]')"
      if [ -n "${current_fstype}" ] && [ "${LAZY_UNMOUNT}" = true ]; then
        echo "detaching stale RRD mount ${RRD_PATH} (${current_fstype})"
        bounded umount --lazy "${RRD_PATH}" || true
        RRD_MOUNT_CHANGED=1
      fi

      bounded mkdir -p "${RRD_PATH}" || return 1
      echo "mounting the configured RRD filesystem at ${RRD_PATH}"
      mount_output="$(bounded mount "${RRD_PATH}" 2>&1)"
      mount_rc=$?
      if [ "${mount_rc}" -ne 0 ]; then
        [ -z "${mount_output}" ] || printf '%s\n' "${mount_output}" >&2
        echo "mount command failed for ${RRD_PATH} (rc=${mount_rc})" >&2
        return "${mount_rc}"
      fi
      [ -z "${mount_output}" ] || printf '%s\n' "${mount_output}"
      RRD_MOUNT_CHANGED=1
      mount_is_healthy
    }

    print_rrd_mount_diagnostics() {
      echo "RRD mount diagnostics for ${RRD_PATH}:" >&2
      echo "--- fstab entry ---" >&2
      probe grep -F "${RRD_PATH}" /etc/fstab >&2 || true
      echo "--- mount table ---" >&2
      probe findmnt --target "${RRD_PATH}" --output TARGET,SOURCE,FSTYPE,OPTIONS >&2 || true
      echo "--- Gluster service ---" >&2
      probe systemctl --no-pager --full status glusterd >&2 || true
      echo "--- Gluster peers ---" >&2
      probe gluster peer status >&2 || true
      echo "--- Gluster volume ---" >&2
      probe gluster volume status "${GLUSTER_VOLUME}" >&2 || true
    }

    if [ "${CONFIRM}" != true ]; then
      echo "Refusing fast repair without -e librenms_fast_repair_confirm=true" >&2
      exit 2
    fi
    case "${RRD_PATH}" in
      ''|/|/opt|/opt/librenms|/var|/home)
        echo "Refusing unsafe RRD repair path: ${RRD_PATH:-<empty>}" >&2
        exit 2
        ;;
    esac

    echo "FAST_REPAIR_HOST=$(hostname)"
    echo "FAST_REPAIR_SCOPE=runtime-only; MariaDB/Galera bootstrap is never attempted"
    echo "systemd jobs before repair:"
    print_jobs

    if ! wait_for_manager; then
      echo "systemd manager is not responsive; refusing to make runtime changes" >&2
      exit 1
    fi

    cancel_stale_jobs
    if ! quiesce_stuck_units; then
      echo "FAST_REPAIR_RESULT=failed" >&2
      exit 1
    fi

    if [ "${RRD_MODE}" = glusterfs ]; then
      if ! ensure_started glusterd; then
        REPAIR_FAILURE=1
      fi
    fi

    RRD_MOUNT_CHANGED=0
    if [ "${RRD_SHARED}" = true ]; then
      if ! repair_rrd_mount; then
        echo "RRD mount repair failed for ${RRD_PATH}" >&2
        print_rrd_mount_diagnostics
        REPAIR_FAILURE=1
      else
        if [ "${RRD_MOUNT_CHANGED}" -ne 0 ]; then
          REPAIR_CHANGED=1
        fi
      fi
    else
      if ! repair_rrd_mount; then
        echo "local RRD directory is not writable: ${RRD_PATH}" >&2
        REPAIR_FAILURE=1
      fi
    fi

    if mount_is_healthy; then
      RRD_READY=true
    else
      if [ "${RRD_SHARED}" = true ]; then
        echo "RRD mount is not healthy; LibreNMS and RRDCacheD will remain stopped" >&2
      else
        echo "local RRD directory is not writable: ${RRD_PATH}" >&2
      fi
      REPAIR_FAILURE=1
    fi

    for unit in nginx haproxy keepalived; do
      if ! ensure_started "${unit}"; then
        REPAIR_FAILURE=1
      fi
    done

    if [ "${REDIS_MODE}" = sentinel ]; then
      for unit in redis-server redis-sentinel; do
        if ! ensure_started "${unit}"; then
          REPAIR_FAILURE=1
        fi
      done
    elif [ "${REDIS_MODE}" = local ]; then
      if ! ensure_started redis-server; then
        REPAIR_FAILURE=1
      fi
    fi

    if [ "${RRD_READY}" = true ]; then
      if [ "${RRDCACHED_REQUIRED}" != true ]; then
        RRDCACHED_READY=true
      elif ensure_rrdcached_started; then
        RRDCACHED_READY=true
      else
        REPAIR_FAILURE=1
      fi
    else
      echo "skipping rrdcached until the RRD mount is healthy" >&2
    fi

    php_units="$(probe systemctl list-unit-files --type=service --no-legend 'php*-fpm.service' 2>/dev/null | awk '{print $1}' || true)"
    for unit in ${php_units}; do
      if ! ensure_started "${unit}"; then
        REPAIR_FAILURE=1
      fi
    done

    if [ "${DB_MODE}" = galera ]; then
      if wait_for_local_galera; then
        GALERA_READY=true
      else
        GALERA_READY=false
        REPAIR_FAILURE=1
      fi
      if ! repair_local_readiness; then
        REPAIR_FAILURE=1
      fi
      if [ "${GALERA_READY}" = true ] && ! reconcile_runtime_db_endpoint; then
        DB_ENDPOINT_READY=false
        REPAIR_FAILURE=1
      fi
    fi

    if ! reconcile_dispatcher_recovery_policy; then
      DB_ENDPOINT_READY=false
      REPAIR_FAILURE=1
    fi

    # The dispatcher ExecStartPre gate checks DB, Redis, and RRDCacheD. Run the
    # same gate before queuing the service so a broken runtime database path
    # cannot leave an unbounded systemd activation job behind.
    if [ "${RRD_READY}" = true ] && [ "${RRDCACHED_READY}" = true ] && \
       [ "${GALERA_READY}" = true ] && [ "${DB_ENDPOINT_READY}" = true ]; then
      if runtime_gate_ready; then
        RUNTIME_READY=true
        if ! refresh_php_fpm_for_runtime_db_change; then
          RUNTIME_READY=false
          REPAIR_FAILURE=1
        fi
      else
        print_database_path_diagnostics
        REPAIR_FAILURE=1
      fi
    fi

    if [ "${RUNTIME_READY}" = true ]; then
      if ensure_started librenms.service; then
        LIBRENMS_READY=true
        if ! recover_dispatcher_registration; then
          LIBRENMS_READY=false
          REPAIR_FAILURE=1
        fi
      else
        REPAIR_FAILURE=1
      fi
    else
      echo "skipping librenms.service until its runtime dependency gate passes" >&2
    fi

    if [ "${LIBRENMS_READY}" = true ]; then
      for timer in \
        librenms-scheduler.timer \
        librenms-ha-startup-repair.timer \
        librenms-dispatcher-ha-recover.timer; do
        if ! ensure_started "${timer}"; then
          REPAIR_FAILURE=1
        fi
      done
    else
      echo "skipping LibreNMS maintenance timers until the dispatcher is active and registered" >&2
    fi

    echo "systemd jobs after repair:"
    print_jobs
    echo "FAST_REPAIR_CHANGED=${REPAIR_CHANGED}"
    if [ "${REPAIR_FAILURE}" -ne 0 ]; then
      echo "FAST_REPAIR_RESULT=failed" >&2
      exit 1
    fi
    echo "FAST_REPAIR_RESULT=ok"
  register: fast_repair_result
  changed_when: "'FAST_REPAIR_CHANGED=1' in fast_repair_result.stdout"
  failed_when: fast_repair_result.rc != 0
