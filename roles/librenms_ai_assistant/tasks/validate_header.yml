---
- name: Validate AI assistant fixed provider header
  ansible.builtin.assert:
    that:
      - ai_header.key is match('^[A-Za-z0-9-]+$')
      - >-
        (ai_header.key | lower)
        not in ['host', 'content-length', 'connection', 'transfer-encoding',
        'authorization', 'x-api-key', 'api-key', 'anthropic-version']
      - ai_header.value is string
      - ai_header.value is match('^[^\r\n]*$')
      - ai_header.value | length <= 8192
    fail_msg: >-
      AI assistant fixed headers must have safe names and bounded single-line
      string values. Transport- and authentication-controlled headers cannot
      be overridden.
  no_log: true
