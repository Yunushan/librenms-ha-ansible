---
- name: Resolve MariaDB version selector
  ansible.builtin.set_fact:
    librenms_mariadb_repository_mode_effective: >-
      {{
        'upstream'
        if ansible_facts.os_family == 'Debian'
        and librenms_mariadb_selection_mode in ['specific', 'lts']
        else librenms_mariadb_repository_mode
      }}
    librenms_mariadb_upstream_series_effective: >-
      {{
        librenms_mariadb_selected_series | string | trim
        if librenms_mariadb_selection_mode == 'specific'
        else librenms_mariadb_lts_series | string | trim
        if librenms_mariadb_selection_mode == 'lts'
        else librenms_mariadb_upstream_series | string | trim
      }}
    librenms_redhat_mariadb_expected_series_effective: >-
      {{
        librenms_mariadb_selected_series | string | trim
        if librenms_mariadb_selection_mode == 'specific'
        else librenms_mariadb_lts_series | string | trim
        if librenms_mariadb_selection_mode == 'lts'
        else librenms_redhat_mariadb_expected_series | string | trim
      }}
  when: librenms_db_mode in ['local', 'galera']

- name: Require supplemental repositories for explicit EL MariaDB stream selection
  ansible.builtin.assert:
    that:
      - librenms_enable_extra_repos | bool
    fail_msg: >-
      RHEL-family MariaDB specific/LTS selection requires
      librenms_enable_extra_repos=true so the selected vendor module stream is
      configured and verified. Refusing to fall back silently to the distro
      default stream.
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_selection_mode in ['specific', 'lts']

- name: Validate MariaDB repository selection
  assert:
    that:
      - librenms_mariadb_selection_mode in ['distro', 'specific', 'lts', 'latest']
      - librenms_mariadb_repository_mode in ['distro', 'upstream']
      - >-
        ansible_facts.os_family == 'RedHat'
        or librenms_mariadb_selection_mode not in ['specific', 'lts']
        or librenms_mariadb_upstream_series_effective in librenms_mariadb_upstream_supported_series
      - >-
        librenms_mariadb_repository_mode_effective != 'upstream'
        or ansible_facts.os_family == 'Debian'
      - >-
        librenms_mariadb_repository_mode_effective != 'upstream'
        or librenms_mariadb_upstream_series_effective in librenms_mariadb_upstream_supported_series
      - >-
        librenms_mariadb_repository_mode_effective != 'upstream'
        or librenms_mariadb_upstream_repo_setup_checksum is match('^sha256:[A-Fa-f0-9]{64}$')
      - >-
        librenms_db_mode != 'galera'
        or librenms_mariadb_repository_mode_effective != 'upstream'
        or librenms_mariadb_upstream_series_effective in librenms_mariadb_upstream_galera_supported_series
    fail_msg: >-
      MariaDB selection is invalid. Debian-family specific/LTS selections use
      the upstream repository and require a supported 11.4, 11.8, or 12.3
      series plus an immutable sha256 checksum for
      librenms_mariadb_upstream_repo_setup_checksum. RHEL-family selections
      use the supported vendor stream map for the current EL major. Galera
      12.3 also requires a compatible galera-4 package from its separately
      validated source.
  when: librenms_db_mode in ['local', 'galera']

- name: Check installed MariaDB server series
  command:
    argv:
      - mariadb
      - --version
  register: librenms_mariadb_version_probe
  changed_when: false
  failed_when: false
  when:
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_repository_mode_effective == 'upstream'

- name: Determine installed MariaDB server series
  set_fact:
    librenms_mariadb_installed_series: >-
      {{
        librenms_mariadb_version_probe.stdout
        | default('')
        | regex_findall('Distrib ([0-9]+\\.[0-9]+)')
        | first
        | default('')
      }}
  when:
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_repository_mode_effective == 'upstream'

- name: Refuse MariaDB major-series changes during normal convergence
  assert:
    that:
      - librenms_mariadb_installed_series == librenms_mariadb_upstream_series_effective
    fail_msg: >-
      Refusing to switch an installed MariaDB {{ librenms_mariadb_installed_series }}
      server to {{ librenms_mariadb_upstream_series_effective }} during site.yml convergence.
      A Galera major upgrade needs an explicit maintenance, off-cluster backup,
      node-by-node upgrade, and rollback workflow. Configure the target series
      only for a fresh install, or use the dedicated upgrade runbook.
  when:
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_repository_mode_effective == 'upstream'
    - librenms_mariadb_installed_series | default('') | length > 0
    - librenms_mariadb_installed_series != librenms_mariadb_upstream_series_effective

- name: Configure MariaDB upstream repository
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/mariadb_repos.yml"
  when:
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_repository_mode_effective == 'upstream'

- name: Install MariaDB packages
  package:
    name: "{{ librenms_db_packages }}"
    state: present
  when:
    - librenms_db_mode in ['local', 'galera']
    - >-
      not (
        ansible_facts.os_family == 'RedHat'
        and ansible_facts.distribution_major_version | int == 8
        and (librenms_rhel8_package_cli_fallback | default(true) | bool)
      )

- name: Install MariaDB packages through native DNF on RHEL 8
  ansible.builtin.command:
    argv: >-
      {{ ['dnf', '-y', 'install'] + librenms_db_packages }}
  register: librenms_rhel8_mariadb_package_install
  changed_when: >-
    'Nothing to do' not in
    ((librenms_rhel8_mariadb_package_install.stdout | default('')) ~
    (librenms_rhel8_mariadb_package_install.stderr | default('')))
  when:
    - librenms_db_mode in ['local', 'galera']
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution_major_version | int == 8
    - librenms_rhel8_package_cli_fallback | default(true) | bool

- name: Update MariaDB packages within the configured Debian repository policy
  ansible.builtin.apt:
    name: "{{ librenms_db_packages }}"
    state: latest
    update_cache: false
  when:
    - ansible_facts.os_family == 'Debian'
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_selection_mode == 'latest'

- name: Update MariaDB packages within the configured RedHat stream
  ansible.builtin.package:
    name: "{{ librenms_db_packages }}"
    state: latest
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_selection_mode == 'latest'
    - >-
      not (
        ansible_facts.distribution_major_version | int == 8
        and (librenms_rhel8_package_cli_fallback | default(true) | bool)
      )

- name: Update MariaDB packages through native DNF on EL 8
  ansible.builtin.command:
    argv: >-
      {{ ['dnf', '-y', 'upgrade'] + librenms_db_packages }}
  register: librenms_rhel8_mariadb_package_update
  changed_when: >-
    'Nothing to do' not in
    ((librenms_rhel8_mariadb_package_update.stdout | default('')) ~
    (librenms_rhel8_mariadb_package_update.stderr | default('')))
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution_major_version | int == 8
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_selection_mode == 'latest'
    - librenms_rhel8_package_cli_fallback | default(true) | bool

- name: Read installed Galera provider package version for MariaDB 12.3
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${Version}"
      - galera-4
  register: librenms_mariadb_12_3_galera_provider_version
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.os_family == 'Debian'
    - librenms_db_mode == 'galera'
    - librenms_mariadb_repository_mode_effective == 'upstream'
    - librenms_mariadb_upstream_series_effective == '12.3'

- name: Check MariaDB 12.3 Galera provider package version
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ librenms_mariadb_12_3_galera_provider_version.stdout | default('0') }}"
      - ge
      - "{{ librenms_mariadb_12_3_galera_min_provider_version }}"
  register: librenms_mariadb_12_3_galera_provider_check
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.os_family == 'Debian'
    - librenms_db_mode == 'galera'
    - librenms_mariadb_repository_mode_effective == 'upstream'
    - librenms_mariadb_upstream_series_effective == '12.3'

- name: Enforce MariaDB 12.3 Galera provider package contract
  ansible.builtin.assert:
    that:
      - librenms_mariadb_12_3_galera_provider_version.rc == 0
      - librenms_mariadb_12_3_galera_provider_check.rc == 0
    fail_msg: >-
      MariaDB 12.3 Galera mode requires galera-4 >=
      {{ librenms_mariadb_12_3_galera_min_provider_version }} from the separate
      official Galera package source. Installed version:
      {{ librenms_mariadb_12_3_galera_provider_version.stdout | default('missing') }}.
      Configure and approve the provider source from mariadb.com/galera-downloads,
      then rerun package installation before starting MariaDB 12.3.
  when:
    - ansible_facts.os_family == 'Debian'
    - librenms_db_mode == 'galera'
    - librenms_mariadb_repository_mode_effective == 'upstream'
    - librenms_mariadb_upstream_series_effective == '12.3'

- name: Detect installed RHEL-family MariaDB server series
  ansible.builtin.command:
    argv:
      - mariadb
      - --version
  register: librenms_redhat_mariadb_version_probe
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_db_mode in ['local', 'galera']

- name: Enforce the supported RHEL-family MariaDB server series
  ansible.builtin.assert:
    that:
      - librenms_redhat_mariadb_version_probe.rc == 0
      - >-
        (
          librenms_redhat_mariadb_version_probe.stdout
          | regex_findall('Distrib ([0-9]+\\.[0-9]+)')
          | first
          | default('')
        ) == (librenms_redhat_mariadb_expected_series_effective | string)
    fail_msg: >-
      RHEL-family MariaDB stream is outside this role's production contract.
      Expected {{ librenms_redhat_mariadb_expected_series_effective }}, found:
      {{ librenms_redhat_mariadb_version_probe.stdout | default('unavailable') }}.
      Select the vendor 10.11 stream or use a separately validated Galera
      upgrade/rollback workflow for a newer stream.
  when:
    - ansible_facts.os_family == 'RedHat'
    - librenms_db_mode in ['local', 'galera']

- name: Detect installed Ubuntu distro MariaDB server series
  ansible.builtin.command:
    argv:
      - mariadb
      - --version
  register: librenms_ubuntu_mariadb_version_probe
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_repository_mode_effective == 'distro'
    - ansible_facts.distribution_major_version in librenms_ubuntu_mariadb_expected_series

- name: Enforce the supported Ubuntu distro MariaDB server series
  ansible.builtin.assert:
    that:
      - librenms_ubuntu_mariadb_version_probe.rc == 0
      - >-
        (
          librenms_ubuntu_mariadb_version_probe.stdout
          | regex_findall('Distrib ([0-9]+\\.[0-9]+)')
          | first
          | default('')
        ) == (librenms_ubuntu_mariadb_expected_series[ansible_facts.distribution_major_version] | string)
    fail_msg: >-
      Ubuntu distro MariaDB stream is outside this role's production contract.
      Ubuntu {{ ansible_facts.distribution_version }} expects MariaDB
      {{ librenms_ubuntu_mariadb_expected_series[ansible_facts.distribution_major_version] }},
      found: {{ librenms_ubuntu_mariadb_version_probe.stdout | default('unavailable') }}.
      Use the matching Ubuntu LTS package stream or select the separately
      validated upstream repository mode on a fresh, non-Galera install.
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - librenms_db_mode in ['local', 'galera']
    - librenms_mariadb_repository_mode_effective == 'distro'
    - ansible_facts.distribution_major_version in librenms_ubuntu_mariadb_expected_series

- name: Deploy MariaDB tuning config
  template:
    src: librenms-mariadb.cnf.j2
    dest: "{{ librenms_mariadb_tuning_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart MariaDB
  when: librenms_db_mode in ['local', 'galera']

- name: Ensure MariaDB service is enabled and started in local mode
  service:
    name: "{{ librenms_mariadb_service_name }}"
    state: started
    enabled: true
  when: librenms_db_mode == 'local'

- name: Wait for MariaDB socket in local mode
  wait_for:
    path: "{{ librenms_mariadb_socket }}"
    timeout: 60
  when: librenms_db_mode == 'local'

- name: Create LibreNMS database in local mode
  ansible.mariadb.mariadb_db:
    name: "{{ librenms_db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: "{{ librenms_mariadb_socket }}"
    check_implicit_admin: true
  when:
    - librenms_db_mode == 'local'
    - inventory_hostname == (groups.get('librenms_db', [inventory_hostname]) | first)

- name: Create LibreNMS database user in local mode
  ansible.mariadb.mariadb_user:
    name: "{{ librenms_db_user }}"
    password: "{{ librenms_db_password }}"
    host: "{{ librenms_db_user_host if librenms_mode != 'standalone' else 'localhost' }}"
    priv: "{{ librenms_db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ librenms_mariadb_socket }}"
    check_implicit_admin: true
  no_log: true
  when:
    - librenms_db_mode == 'local'
    - inventory_hostname == (groups.get('librenms_db', [inventory_hostname]) | first)
