---
- name: Resolve managed host-firewall backend
  ansible.builtin.set_fact:
    librenms_host_firewall_backend_effective: >-
      {{
        ('ufw' if ansible_os_family == 'Debian' else 'firewalld')
        if librenms_host_firewall_backend == 'auto'
        else librenms_host_firewall_backend
      }}

- name: Validate explicit managed host-firewall policy
  ansible.builtin.assert:
    that:
      - >-
        (ansible_os_family == 'Debian' and librenms_host_firewall_backend_effective == 'ufw')
        or
        (ansible_os_family == 'RedHat' and librenms_host_firewall_backend_effective == 'firewalld')
      - librenms_host_firewall_management_sources | length > 0
      - librenms_host_firewall_cluster_sources | length > 0
      - librenms_host_firewall_ssh_port | int > 0
      - librenms_host_firewall_ssh_port | int < 65536
      - librenms_host_firewall_logging in ['off', 'low', 'medium', 'high', 'full']
      - >-
        librenms_host_firewall_management_sources
        | select('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$')
        | list
        | length == librenms_host_firewall_management_sources | length
      - >-
        librenms_host_firewall_cluster_sources
        | select('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$')
        | list
        | length == librenms_host_firewall_cluster_sources | length
      - >-
        librenms_host_firewall_web_sources
        | select('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$')
        | list
        | length == librenms_host_firewall_web_sources | length
      - >-
        librenms_host_firewall_syslog_sources
        | select('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$')
        | list
        | length == librenms_host_firewall_syslog_sources | length
      - >-
        librenms_host_firewall_snmp_sources
        | select('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$')
        | list
        | length == librenms_host_firewall_snmp_sources | length
      - not (librenms_syslog_manage_firewall | bool)
      - not (librenms_gluster_manage_firewall | bool)
    fail_msg: >-
      Host firewall enforcement needs explicit trusted management and cluster
      CIDRs and a backend matching the operating-system family. Leave
      librenms_manage_host_firewall false until those CIDRs are reviewed. Do
      not enable the broad syslog or Gluster firewall helpers alongside this
      source-restricted policy.

- name: Apply source-restricted UFW policy
  ansible.builtin.include_tasks: ufw.yml
  when: librenms_host_firewall_backend_effective == 'ufw'

- name: Apply source-restricted firewalld policy
  ansible.builtin.include_tasks: firewalld.yml
  when: librenms_host_firewall_backend_effective == 'firewalld'
