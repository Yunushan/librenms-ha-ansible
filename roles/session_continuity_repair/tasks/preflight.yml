---
- name: Validate maintenance-safe session repair topology
  ansible.builtin.assert:
    that:
      - librenms_mode == 'ha'
      - librenms_redis_mode == 'sentinel'
      - librenms_redis_persistence_enabled | bool
      - librenms_redis_appendonly | bool
      - >-
        (librenms_session_repair_active_web_nodes | length)
        >= (librenms_session_repair_min_web_nodes | int)
      - >-
        (librenms_session_repair_active_redis_nodes | length)
        >= (librenms_redis_quorum | int)
    fail_msg: >-
      Session repair requires HA Redis Sentinel mode, at least two active web
      nodes, a live Sentinel quorum, and configured AOF persistence. It does
      not weaken the normal three-member production topology guard.
  run_once: true

- name: Validate configured APP_KEY repair authority
  ansible.builtin.assert:
    that:
      - (librenms_session_repair_app_key_effective | length) >= 32
      - "'CHANGE_ME' not in librenms_session_repair_app_key_effective"
    fail_msg: >-
      Session repair requires the existing production APP_KEY from encrypted
      inventory. It never generates or rotates an application key.
  run_once: true

- name: Inspect active web APP_KEY fingerprints
  ansible.builtin.command:
    argv:
      - php
      - -r
      - |-
        $lines = @file($argv[1], FILE_IGNORE_NEW_LINES);
        if ($lines === false) {
            exit(2);
        }
        $values = [];
        foreach ($lines as $line) {
            if (str_starts_with($line, 'APP_KEY=')) {
                $values[] = substr($line, 8);
            }
        }
        if (count($values) !== 1) {
            exit(3);
        }
        $value = trim($values[0]);
        if (
            strlen($value) >= 2
            && (
                ($value[0] === '"' && $value[-1] === '"')
                || ($value[0] === "'" && $value[-1] === "'")
            )
        ) {
            $value = substr($value, 1, -1);
        }
        if ($value === '' || str_contains($value, 'CHANGE_ME')) {
            exit(4);
        }
        echo hash('sha256', $value);
      - "{{ librenms_session_repair_env_path }}"
  register: librenms_session_repair_live_app_key_probe
  changed_when: false
  failed_when: false
  no_log: true
  when: inventory_hostname in librenms_session_repair_active_web_nodes

- name: Confirm active web APP_KEY fingerprints are readable
  ansible.builtin.assert:
    that:
      - librenms_session_repair_live_app_key_probe.rc == 0
      - >-
        (librenms_session_repair_live_app_key_probe.stdout | trim)
        is match('^[a-f0-9]{64}$')
    fail_msg: >-
      {{ inventory_hostname }} does not have exactly one safe APP_KEY in
      {{ librenms_session_repair_env_path }}. No session configuration was
      changed.
  when: inventory_hostname in librenms_session_repair_active_web_nodes

- name: Collect active web APP_KEY fingerprints
  ansible.builtin.set_fact:
    librenms_session_repair_live_app_key_hashes: >-
      {{
        librenms_session_repair_active_web_nodes
        | map('extract', hostvars, 'librenms_session_repair_live_app_key_probe')
        | map(attribute='stdout')
        | map('trim')
        | list
      }}
  no_log: true
  run_once: true

- name: Anchor configured APP_KEY to an active web node
  ansible.builtin.assert:
    that:
      - >-
        (librenms_session_repair_app_key_effective | hash('sha256'))
        in librenms_session_repair_live_app_key_hashes
    fail_msg: >-
      The configured inventory APP_KEY does not match any active web node.
      Refusing to rotate every browser session implicitly. Restore the
      established production key in encrypted inventory before retrying.
  run_once: true

- name: Verify active Redis service before session repair
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ librenms_redis_service_name }}"
  register: librenms_session_repair_redis_service
  changed_when: false
  when: inventory_hostname in librenms_session_repair_active_redis_nodes

- name: Verify local Redis accepts authenticated commands
  ansible.builtin.command:
    argv:
      - "{{ librenms_redis_cli_binary }}"
      - -h
      - 127.0.0.1
      - -p
      - "6379"
      - PING
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_password }}"
  register: librenms_session_repair_redis_ping
  changed_when: false
  no_log: true
  when: inventory_hostname in librenms_session_repair_active_redis_nodes

- name: Verify local Sentinel retains quorum
  ansible.builtin.command:
    argv:
      - "{{ librenms_redis_cli_binary }}"
      - -h
      - 127.0.0.1
      - -p
      - "26379"
      - SENTINEL
      - CKQUORUM
      - "{{ librenms_redis_sentinel_service }}"
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
  register: librenms_session_repair_sentinel_quorum
  changed_when: false
  no_log: true
  when: inventory_hostname in librenms_session_repair_active_redis_nodes

- name: Confirm local Redis and Sentinel preflight
  ansible.builtin.assert:
    that:
      - (librenms_session_repair_redis_service.stdout | trim) == 'active'
      - (librenms_session_repair_redis_ping.stdout | trim) == 'PONG'
      - >-
        (librenms_session_repair_sentinel_quorum.stdout | default(''))
        is search('^OK')
    fail_msg: >-
      {{ inventory_hostname }} does not have an active, writable Redis runtime
      with Sentinel quorum. No AOF or application change was attempted.
  when: inventory_hostname in librenms_session_repair_active_redis_nodes
