---
- name: Deploy LibreNMS shared-session health probe
  ansible.builtin.template:
    src: >-
      {{ role_path }}/../librenms_app/templates/librenms-session-health.php.j2
    dest: "{{ librenms_session_health_probe_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Validate LibreNMS shared-session health probe syntax
  ansible.builtin.command:
    argv:
      - php
      - -l
      - "{{ librenms_session_health_probe_path }}"
  changed_when: false

- name: Inspect repaired LibreNMS runtime session configuration
  ansible.builtin.command:
    argv:
      - timeout
      - 20s
      - "{{ librenms_session_health_probe_path }}"
      - config
  become: true
  become_user: "{{ librenms_user }}"
  register: librenms_session_repair_web_config
  changed_when: false
  failed_when: false

- name: Confirm repaired LibreNMS runtime session configuration
  ansible.builtin.assert:
    that:
      - librenms_session_repair_web_config.rc == 0
      - "'driver=redis' in librenms_session_repair_web_config.stdout_lines"
      - >-
        'connection=sentinel_session'
        in librenms_session_repair_web_config.stdout_lines
    fail_msg: |-
      {{ inventory_hostname }} still has an unsafe LibreNMS session runtime.
      Probe output:
      {{ librenms_session_repair_web_config.stdout | default('') }}
      {{ librenms_session_repair_web_config.stderr | default('') }}
