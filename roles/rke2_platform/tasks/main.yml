---
- name: Validate optional RKE2 request
  ansible.builtin.assert:
    that:
      - librenms_rke2_action in ['preflight', 'bootstrap', 'status', 'remove']
      - librenms_rke2_node_role in ['server', 'agent']
      - >-
        librenms_rke2_action in ['preflight', 'status']
        or librenms_rke2_confirm | bool
      - >-
        librenms_rke2_action != 'bootstrap'
        or librenms_rke2_install_checksum is match('^sha256:[A-Fa-f0-9]{64}$')
      - >-
        librenms_rke2_action != 'bootstrap'
        or librenms_rke2_version | string | trim | length > 0
      - >-
        librenms_rke2_action != 'bootstrap'
        or librenms_rke2_node_role != 'server'
        or (
          librenms_rke2_bootstrap_host | string | trim | length > 0
          and librenms_rke2_bootstrap_host in ansible_play_hosts_all
          and ansible_play_hosts_all[0] == librenms_rke2_bootstrap_host
        )
      - >-
        librenms_rke2_action != 'bootstrap'
        or librenms_rke2_node_role != 'server'
        or inventory_hostname == librenms_rke2_bootstrap_host
        or (
          librenms_rke2_server_url | string | trim | length > 0
          and librenms_rke2_token | string | trim | length > 0
        )
      - >-
        librenms_rke2_action != 'bootstrap'
        or librenms_rke2_node_role != 'server'
        or librenms_rke2_token | string | trim | length > 0
      - >-
        librenms_rke2_action != 'bootstrap'
        or librenms_rke2_node_role != 'agent'
        or (
          librenms_rke2_server_url | string | trim | length > 0
          and librenms_rke2_token | string | trim | length > 0
        )
    fail_msg: >-
      RKE2 is guarded. Bootstrap requires a SHA-256 checksum for the reviewed
      installer. Server bootstrap requires one explicitly named first host;
      all other servers and agent nodes require a server URL and token.
      Bootstrap or removal requires librenms_rke2_confirm=true.

- name: Check whether RKE2 is installed
  ansible.builtin.stat:
    path: "{{ librenms_rke2_binary_path }}"
    follow: false
  register: librenms_rke2_binary

- name: Check the RKE2 installer destination
  ansible.builtin.stat:
    path: "{{ librenms_rke2_install_script_path }}"
    follow: false
  register: librenms_rke2_install_script
  when: librenms_rke2_action == 'bootstrap'

- name: Refuse a symlinked RKE2 installer destination
  ansible.builtin.assert:
    that:
      - not librenms_rke2_install_script.stat.islnk | default(false)
    fail_msg: >-
      RKE2 installer destination must not be a symlink:
      {{ librenms_rke2_install_script_path }}
  when: librenms_rke2_action == 'bootstrap'

- name: Check the RKE2 installer URL
  ansible.builtin.assert:
    that:
      - librenms_rke2_install_url is match('^https://')
    fail_msg: "RKE2 installer URL must use HTTPS: {{ librenms_rke2_install_url }}"
  when: librenms_rke2_action == 'bootstrap'

- name: Download the reviewed RKE2 installer
  ansible.builtin.get_url:
    url: "{{ librenms_rke2_install_url }}"
    dest: "{{ librenms_rke2_install_script_path }}"
    owner: root
    group: root
    mode: "0700"
    checksum: "{{ librenms_rke2_install_checksum }}"
  when: librenms_rke2_action == 'bootstrap'

- name: Create the RKE2 configuration directory
  ansible.builtin.file:
    path: "{{ librenms_rke2_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: librenms_rke2_action == 'bootstrap'

- name: Check the RKE2 configuration destination
  ansible.builtin.stat:
    path: "{{ librenms_rke2_config_path }}"
    follow: false
  register: librenms_rke2_config
  when: librenms_rke2_action == 'bootstrap'

- name: Refuse a symlinked RKE2 configuration destination
  ansible.builtin.assert:
    that:
      - not librenms_rke2_config.stat.islnk | default(false)
    fail_msg: >-
      RKE2 configuration destination must not be a symlink:
      {{ librenms_rke2_config_path }}
  when: librenms_rke2_action == 'bootstrap'

- name: Deploy RKE2 configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ librenms_rke2_config_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: librenms_rke2_action == 'bootstrap'

- name: Install RKE2 from the checked installer
  ansible.builtin.command:
    argv:
      - "{{ librenms_rke2_install_script_path }}"
  environment:
    INSTALL_RKE2_VERSION: "{{ librenms_rke2_version }}"
    INSTALL_RKE2_TYPE: "{{ librenms_rke2_node_role }}"
  when:
    - librenms_rke2_action == 'bootstrap'
    - not librenms_rke2_binary.stat.exists
  changed_when: true
  no_log: true

- name: Enable and start RKE2
  ansible.builtin.systemd_service:
    name: "{{ librenms_rke2_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  when: librenms_rke2_action == 'bootstrap'

- name: Show RKE2 cluster status from a server
  ansible.builtin.command:
    argv:
      - "{{ librenms_rke2_binary_path }}"
      - kubectl
      - get
      - nodes
      - --output=wide
  register: librenms_rke2_status
  changed_when: false
  when:
    - librenms_rke2_action == 'status'
    - librenms_rke2_node_role == 'server'

- name: Gather RKE2 agent service facts
  ansible.builtin.service_facts:
  register: librenms_rke2_agent_service_facts
  when:
    - librenms_rke2_action == 'status'
    - librenms_rke2_node_role == 'agent'

- name: Verify RKE2 agent service status
  ansible.builtin.assert:
    that:
      - >-
        (
          librenms_rke2_agent_service_facts.ansible_facts.services
          | default({})
        ).get(
          librenms_rke2_service_name ~ '.service', {}
        ).get('state', '') == 'running'
    fail_msg: >-
      RKE2 agent service {{ librenms_rke2_service_name }} is not active on
      {{ inventory_hostname }}.
  when:
    - librenms_rke2_action == 'status'
    - librenms_rke2_node_role == 'agent'

- name: Check RKE2 uninstall script
  ansible.builtin.stat:
    path: "{{ librenms_rke2_uninstall_path }}"
    follow: false
  register: librenms_rke2_uninstall
  when: librenms_rke2_action == 'remove'

- name: Require the RKE2 uninstall script
  ansible.builtin.assert:
    that:
      - librenms_rke2_uninstall.stat.isreg | default(false)
      - not librenms_rke2_uninstall.stat.islnk | default(false)
    fail_msg: "RKE2 uninstall script is missing: {{ librenms_rke2_uninstall_path }}"
  when: librenms_rke2_action == 'remove'

- name: Remove RKE2 from the node
  ansible.builtin.command:
    argv:
      - "{{ librenms_rke2_uninstall_path }}"
  when: librenms_rke2_action == 'remove'
  changed_when: true

- name: Report RKE2 adapter result
  ansible.builtin.debug:
    msg:
      - "RKE2 action: {{ librenms_rke2_action }}"
      - "RKE2 node role: {{ librenms_rke2_node_role }}"
      - "RKE2 binary present: {{ librenms_rke2_binary.stat.exists | default(false) }}"
      - "{{ librenms_rke2_status.stdout | default('') }}"
      - >-
        RKE2 agent service state:
        {{
          (
            librenms_rke2_agent_service_facts.ansible_facts.services
            | default({})
          ).get(
            librenms_rke2_service_name ~ '.service', {}
          ).get('state', 'missing')
        }}
