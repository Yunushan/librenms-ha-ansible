---
- name: Load OS-specific service variables
  include_vars:
    file: "{{ lookup('first_found', librenms_production_readiness_vars_lookup) }}"
  vars:
    librenms_production_readiness_vars_lookup:
      files:
        - "{{ ansible_distribution | replace(' ', '') }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ playbook_dir }}/../roles/common/vars"

- name: Build production readiness host lists
  set_fact:
    librenms_production_active_db_nodes: >-
      {{ groups.get('librenms_db', []) | difference(librenms_inactive_inventory_nodes) }}
    librenms_production_active_redis_nodes: >-
      {{ groups.get('librenms_redis', []) | difference(librenms_inactive_inventory_nodes) }}
    librenms_production_active_lb_nodes: >-
      {{ groups.get('lb_nodes', []) | difference(librenms_inactive_inventory_nodes) }}
    librenms_production_active_web_nodes: >-
      {{ groups.get('librenms_web', groups.get('librenms_nodes', [])) | difference(librenms_inactive_inventory_nodes) }}

- name: Determine effective HAProxy web health-check host for production probes
  set_fact:
    librenms_production_haproxy_web_check_host: >-
      {{
        librenms_haproxy_web_check_host
        if librenms_haproxy_web_check_host | length > 0
        else (
          librenms_fqdn
          if librenms_fqdn | length > 0
          and librenms_fqdn != librenms_default_fqdn_placeholder
          else (
            librenms_vip_ip
            if librenms_vip_enabled | bool and librenms_vip_ip | length > 0
            else inventory_hostname
          )
        )
      }}
- name: Require production-safe HA configuration
  assert:
    that:
      - librenms_app_key | length > 20
      - not (librenms_app_key is search('CHANGE_ME'))
      - librenms_db_password | length > 20
      - not (librenms_db_password is search('CHANGE_ME'))
      - librenms_mariadb_repository_mode == 'distro' or librenms_mariadb_upstream_repo_setup_checksum is match('^sha256:[A-Fa-f0-9]{64}$')
      - not (librenms_mode == 'ha') or librenms_daily_global_lock_enabled | bool
      - not (librenms_mode == 'ha') or librenms_daily_global_lock_backend == 'shared_file'
      - not (librenms_mode == 'ha') or librenms_daily_global_lock_shared_file | length > 0
      - not (librenms_mode == 'ha') or librenms_daily_canary_enabled | bool
      - >-
        not (librenms_mode == 'ha')
        or librenms_daily_canary_host in librenms_production_active_web_nodes
      - not (librenms_mode == 'ha') or librenms_daily_canary_state_path | length > 0
      - >-
        not (librenms_mode == 'ha')
        or (librenms_daily_canary_wait_timeout | int) > 0
      - not (librenms_mode == 'ha') or librenms_backup_offsite_enabled | bool
      - not (librenms_mode == 'ha') or librenms_backup_offsite_required | bool
      - not (librenms_mode == 'ha') or librenms_backup_offsite_rsync_target | length > 0
      - not (librenms_mode == 'ha') or librenms_backup_include_database | bool
      - not (librenms_mode == 'ha') or librenms_backup_include_config | bool
      - not (librenms_mode == 'ha') or (librenms_backup_lock_timeout | int) > 0
      - >-
        not (librenms_mode == 'ha')
        or not (librenms_production_readiness_require_scheduled_daily_backup | bool)
        or librenms_manage_scheduled_backups | bool
      - >-
        not (librenms_mode == 'ha')
        or not (librenms_production_readiness_require_scheduled_daily_backup | bool)
        or librenms_backup_daily_enabled | bool
      - >-
        not (librenms_mode == 'ha')
        or librenms_backup_scheduled_host in librenms_production_active_db_nodes
      - librenms_db_bind_address not in ['0.0.0.0', '::', '']
      - not (librenms_mode == 'ha') or (librenms_production_active_db_nodes | length) >= 3
      - >-
        not (librenms_mode == 'ha' and librenms_redis_mode == 'sentinel')
        or (librenms_production_active_redis_nodes | length) >= 3
      - not (librenms_mode == 'ha') or (librenms_production_active_lb_nodes | length) >= 2
      - not (librenms_mode == 'ha') or (librenms_production_active_web_nodes | length) >= 2
      - >-
        not (librenms_mode == 'ha')
        or not (librenms_production_readiness_require_status_alert_routing | bool)
        or (librenms_status_alerts_enabled | default(false)) | bool
      - >-
        not (librenms_mode == 'ha')
        or not (librenms_production_readiness_require_status_alert_routing | bool)
        or (librenms_status_alert_webhook_url | default('')) is match('^https://')
      - >-
        not (librenms_mode == 'ha')
        or not (librenms_production_readiness_require_status_alert_routing | bool)
        or (librenms_status_alert_webhook_validate_certs | default(true)) | bool
      - >-
        not (librenms_mode == 'ha')
        or (librenms_production_readiness_max_failover_recovery_seconds | int) > 0
      - >-
        not (librenms_mode == 'ha')
        or not (librenms_production_readiness_verify_database_restore | bool)
        or (librenms_production_readiness_max_database_restore_seconds | int) > 0
      - >-
        not (librenms_production_readiness_evidence_integrity_enabled | bool)
        or librenms_production_readiness_write_evidence | bool
      - >-
        not (librenms_production_readiness_evidence_hmac_enabled | bool)
        or librenms_production_readiness_evidence_integrity_enabled | bool
    fail_msg: >-
      Production readiness configuration is incomplete. Use vault-encrypted values
      for all secrets, require an off-cluster DB/config backup target, retain
      the HA daily database lock and scheduled backup, bind MariaDB to a managed
      address, configure certificate-validated HTTPS status alert routing, and
      provide at least two web/LB nodes plus three Galera nodes for HA mode.
  no_log: true
  run_once: true

- name: Require a declared production secret source
  assert:
    that:
      - librenms_production_readiness_secret_source in ['ansible_vault', 'external']
      - >-
        librenms_production_readiness_secret_source != 'external'
        or librenms_production_readiness_external_secret_provider | length > 0
      - >-
        librenms_production_readiness_secret_source != 'external'
        or librenms_production_readiness_external_secret_reference | length > 0
      - >-
        librenms_production_readiness_secret_source != 'external'
        or (librenms_production_readiness_external_secret_validation_command | length) > 0
    fail_msg: >-
      Production readiness requires either an encrypted Ansible Vault file or an
      explicitly named external secret provider, credential reference, and a
      no-output provider validation command.
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when: librenms_production_readiness_require_encrypted_vault | bool

- name: Verify external production secret provider access
  command:
    argv: "{{ librenms_production_readiness_external_secret_validation_command }}"
    expand_argument_vars: false
  environment: "{{ librenms_production_readiness_external_secret_validation_environment }}"
  changed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - librenms_production_readiness_require_encrypted_vault | bool
    - librenms_production_readiness_secret_source == 'external'

- name: Inspect the configured Ansible Vault secret file
  stat:
    path: "{{ librenms_production_readiness_ansible_vault_file }}"
  register: librenms_production_vault_file
  changed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - librenms_production_readiness_require_encrypted_vault | bool
    - librenms_production_readiness_secret_source == 'ansible_vault'

- name: Read the configured Ansible Vault secret file header
  slurp:
    src: "{{ librenms_production_readiness_ansible_vault_file }}"
  register: librenms_production_vault_content
  changed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - librenms_production_readiness_require_encrypted_vault | bool
    - librenms_production_readiness_secret_source == 'ansible_vault'
    - librenms_production_vault_file.stat.exists | bool

- name: Require an encrypted Ansible Vault secret file for production
  assert:
    that:
      - librenms_production_vault_file.stat.exists | bool
      - >-
        (librenms_production_vault_content.content | b64decode)
        .startswith('$ANSIBLE_VAULT;')
    fail_msg: >-
      The configured production vault file is missing or is not Ansible Vault
      encrypted: {{ librenms_production_readiness_ansible_vault_file }}.
      Generate secrets into that file and encrypt it with ansible-vault, or set
      librenms_production_readiness_secret_source=external with a documented
      external provider and credential reference.
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - librenms_production_readiness_require_encrypted_vault | bool
    - librenms_production_readiness_secret_source == 'ansible_vault'

- name: Check for retained HA failover drill evidence
  stat:
    path: "{{ librenms_production_readiness_failover_evidence_dir }}"
  delegate_to: localhost
  become: true
  register: librenms_production_failover_evidence_directory
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool

- name: Inspect UFW state for the managed host-firewall policy
  command:
    argv:
      - ufw
      - status
  register: librenms_production_ufw_status
  changed_when: false
  when: librenms_production_readiness_require_host_firewall | bool

- name: Require active UFW when the managed host-firewall policy is enabled
  assert:
    that:
      - librenms_production_ufw_status.rc == 0
      - librenms_production_ufw_status.stdout is search('Status: active')
    fail_msg: >-
      UFW is not active on {{ inventory_hostname }} although
      librenms_manage_host_firewall is enabled. Run playbooks/firewall.yml
      after reviewing the explicit management, cluster, web, syslog, and SNMP
      source CIDRs.
  when: librenms_production_readiness_require_host_firewall | bool

- name: Inspect scheduled daily backup timer health
  command:
    argv:
      - systemctl
      - show
      - librenms-backup-daily.timer
      - --property=ActiveState
      - --property=NextElapseUSecRealtime
      - --value
  register: librenms_production_daily_backup_timer
  changed_when: false
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_scheduled_daily_backup | bool

- name: Inspect last scheduled daily backup service result
  command:
    argv:
      - systemctl
      - is-failed
      - librenms-backup-daily.service
  register: librenms_production_daily_backup_service
  changed_when: false
  failed_when: false
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_scheduled_daily_backup | bool

- name: Require scheduled daily backup health
  assert:
    that:
      - librenms_production_daily_backup_timer.stdout_lines | length >= 2
      - librenms_production_daily_backup_timer.stdout_lines[0] == 'active'
      - librenms_production_daily_backup_timer.stdout_lines[1] | length > 0
      - librenms_production_daily_backup_service.stdout | trim != 'failed'
    fail_msg: >-
      The managed daily backup timer is inactive, has no next scheduled run, or
      its last service execution is failed on {{ librenms_backup_scheduled_host }}.
      Repair librenms-backup-daily.timer/service before declaring the HA cluster
      production-ready.
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_scheduled_daily_backup | bool

- name: Require a retained HA failover drill evidence directory
  assert:
    that:
      - librenms_production_failover_evidence_directory.stat.isdir | default(false)
    fail_msg: >-
      Production readiness requires a successful HA failover drill from the
      last {{ librenms_production_readiness_failover_evidence_max_age_days }}
      days, but its controller evidence directory is absent:
      {{ librenms_production_readiness_failover_evidence_dir }}. Run
      playbooks/ha-failover-test.yml with explicit confirmation, then rerun
      this gate.
  delegate_to: localhost
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool

- name: Find recent successful HA failover drill evidence
  find:
    paths: "{{ librenms_production_readiness_failover_evidence_dir }}"
    patterns: "failover-drill-*.json"
    age: "-{{ librenms_production_readiness_failover_evidence_max_age_days | int }}d"
    age_stamp: mtime
    file_type: file
    recurse: false
  delegate_to: localhost
  become: true
  register: librenms_production_recent_failover_evidence
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool

- name: Require a recent HA failover drill evidence record
  assert:
    that:
      - (librenms_production_recent_failover_evidence.matched | default(0) | int) > 0
    fail_msg: >-
      Production readiness requires a successful HA failover drill evidence
      record no older than
      {{ librenms_production_readiness_failover_evidence_max_age_days }} days.
      Run playbooks/ha-failover-test.yml with explicit confirmation, then rerun
      this gate.
  delegate_to: localhost
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool

- name: Select the newest HA failover drill evidence record
  set_fact:
    librenms_production_latest_failover_evidence_path: >-
      {{
        (
          librenms_production_recent_failover_evidence.files
          | sort(attribute='mtime', reverse=true)
          | map(attribute='path')
          | list
          | first
        )
        | default('')
      }}
  delegate_to: localhost
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool

- name: Read newest HA failover drill evidence record
  slurp:
    src: "{{ librenms_production_latest_failover_evidence_path }}"
  delegate_to: localhost
  become: true
  register: librenms_production_latest_failover_evidence_raw
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool

- name: Inspect newest HA failover drill evidence checksum
  stat:
    path: "{{ librenms_production_latest_failover_evidence_path }}.sha256"
  delegate_to: localhost
  become: true
  register: librenms_production_latest_failover_evidence_checksum_file
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool
    - librenms_production_readiness_require_failover_evidence_integrity | bool

- name: Require HA failover drill evidence checksum
  assert:
    that:
      - >-
        librenms_production_latest_failover_evidence_checksum_file.stat.exists
        | default(false)
        | bool
    fail_msg: >-
      The newest HA failover evidence record has no checksum sidecar. Run a new
      confirmed failover drill so production readiness can verify evidence
      integrity.
  delegate_to: localhost
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool
    - librenms_production_readiness_require_failover_evidence_integrity | bool

- name: Read newest HA failover drill evidence checksum
  slurp:
    src: "{{ librenms_production_latest_failover_evidence_path }}.sha256"
  delegate_to: localhost
  become: true
  register: librenms_production_latest_failover_evidence_checksum_raw
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool
    - librenms_production_readiness_require_failover_evidence_integrity | bool

- name: Calculate newest HA failover drill evidence digest
  set_fact:
    librenms_production_latest_failover_evidence_checksum: >-
      {{ librenms_production_latest_failover_evidence_raw.content | b64decode | hash('sha256') }}
    librenms_production_latest_failover_evidence_expected_checksum: >-
      {{
        librenms_production_latest_failover_evidence_checksum_raw.content
        | b64decode
        | trim
        | regex_replace('\\s+.*$', '')
      }}
  delegate_to: localhost
  no_log: true
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool
    - librenms_production_readiness_require_failover_evidence_integrity | bool

- name: Require HA failover drill evidence checksum matches
  assert:
    that:
      - >-
        librenms_production_latest_failover_evidence_expected_checksum
        is match('^[0-9a-f]{64}$')
      - >-
        librenms_production_latest_failover_evidence_expected_checksum
        == librenms_production_latest_failover_evidence_checksum
    fail_msg: >-
      The newest HA failover evidence checksum is malformed or does not match
      its JSON record. Discard the record and run a new confirmed drill.
  delegate_to: localhost
  no_log: true
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool
    - librenms_production_readiness_require_failover_evidence_integrity | bool

- name: Parse newest HA failover drill evidence record
  set_fact:
    librenms_production_latest_failover_evidence: >-
      {{ librenms_production_latest_failover_evidence_raw.content | b64decode | from_json }}
  delegate_to: localhost
  no_log: true
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool

- name: Require the recent HA failover drill covers essential cases
  assert:
    that:
      - librenms_production_latest_failover_evidence.result | default('') == 'passed'
      - librenms_production_latest_failover_evidence.completed_at | default('') | length > 0
      - >-
        (librenms_production_latest_failover_evidence.mode | default(''))
        == librenms_mode
      - >-
        (librenms_production_latest_failover_evidence.vip | default(''))
        == librenms_vip_ip
      - >-
        (librenms_production_latest_failover_evidence.elapsed_seconds
        | default(-1) | int) >= 0
      - >-
        (librenms_production_latest_failover_evidence.elapsed_seconds
        | default(-1) | int)
        <= (librenms_production_readiness_max_failover_recovery_seconds | int)
      - >-
        (
          librenms_production_readiness_required_failover_cases
          | difference(librenms_production_latest_failover_evidence.cases | default([]))
          | length
        ) == 0
    fail_msg: >-
      The newest HA failover evidence is incomplete, belongs to a different
      HA configuration, did not pass, or exceeded the configured
      {{ librenms_production_readiness_max_failover_recovery_seconds }}-second
      recovery objective. It must prove the required cases:
      {{ librenms_production_readiness_required_failover_cases | join(', ') }}.
  delegate_to: localhost
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_require_recent_failover_evidence | bool

- name: Verify HA maintenance lock uses the shared GlusterFS mount
  command:
    argv:
      - findmnt
      - -n
      - -o
      - FSTYPE
      - --target
      - "{{ librenms_daily_global_lock_shared_file }}"
  register: librenms_production_shared_lock_filesystem
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_daily_global_lock_backend == 'shared_file'

- name: Require a GlusterFS-backed HA maintenance lock
  assert:
    that:
      - librenms_production_shared_lock_filesystem.stdout | trim == 'fuse.glusterfs'
    fail_msg: >-
      The HA maintenance lock must live on the shared GlusterFS mount. It is
      currently on {{ librenms_production_shared_lock_filesystem.stdout | trim
      | default('an unavailable filesystem', true) }}.
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_daily_global_lock_backend == 'shared_file'

- name: Verify daily-update canary state uses the shared GlusterFS mount
  command:
    argv:
      - findmnt
      - -n
      - -o
      - FSTYPE
      - --target
      - "{{ librenms_daily_canary_state_path }}"
  register: librenms_production_canary_state_filesystem
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_daily_canary_enabled | bool

- name: Require a GlusterFS-backed daily-update canary state
  assert:
    that:
      - librenms_production_canary_state_filesystem.stdout | trim == 'fuse.glusterfs'
    fail_msg: >-
      The daily-update canary state must live on the shared GlusterFS mount.
      It is currently on {{ librenms_production_canary_state_filesystem.stdout
      | trim | default('an unavailable filesystem', true) }}.
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_daily_canary_enabled | bool

- name: Verify each HA web node has a GlusterFS-backed RRD directory
  command:
    argv:
      - findmnt
      - -n
      - -o
      - FSTYPE
      - --target
      - "{{ librenms_gluster_mountpoint }}"
  register: librenms_production_rrd_filesystem
  changed_when: false
  when:
    - librenms_mode == 'ha'
    - librenms_rrd_mode == 'glusterfs'
    - inventory_hostname in librenms_production_active_web_nodes

- name: Require a GlusterFS-backed RRD directory on every HA web node
  assert:
    that:
      - librenms_production_rrd_filesystem.stdout | trim == 'fuse.glusterfs'
    fail_msg: >-
      The LibreNMS RRD directory on {{ inventory_hostname }} must be mounted
      from GlusterFS. {{ librenms_gluster_mountpoint }} currently reports
      {{ librenms_production_rrd_filesystem.stdout | trim
      | default('an unavailable filesystem', true) }}.
  when:
    - librenms_mode == 'ha'
    - librenms_rrd_mode == 'glusterfs'
    - inventory_hostname in librenms_production_active_web_nodes

- name: Schedule a simultaneous shared maintenance lock probe
  set_fact:
    librenms_production_shared_lock_probe_epoch: >-
      {{
        ansible_date_time.epoch | int
        + librenms_production_readiness_shared_lock_probe_start_delay | int
      }}
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_shared_lock | bool
    - librenms_daily_global_lock_backend == 'shared_file'

- name: Launch shared maintenance lock probes on every web node
  command:
    argv:
      - /bin/sh
      - -c
      - >-
        while [ "$(date +%s)" -lt "$1" ]; do sleep 1; done;
        flock -n "$2" /bin/sh -c 'sleep "$1"; printf acquired' -- "$3"
      - --
      - "{{ librenms_production_shared_lock_probe_epoch }}"
      - "{{ librenms_daily_global_lock_shared_file }}"
      - "{{ librenms_production_readiness_shared_lock_probe_hold | int }}"
  async: "{{ librenms_production_readiness_shared_lock_probe_timeout | int }}"
  poll: 0
  loop: "{{ librenms_production_active_web_nodes }}"
  delegate_to: "{{ item }}"
  register: librenms_production_shared_lock_jobs
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_shared_lock | bool
    - librenms_daily_global_lock_backend == 'shared_file'

- name: Collect shared maintenance lock probe results
  async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ librenms_production_shared_lock_jobs.results | default([]) }}"
  delegate_to: "{{ item.item }}"
  register: librenms_production_shared_lock_probe_results
  until: librenms_production_shared_lock_probe_results.finished | default(false)
  retries: "{{ librenms_production_readiness_shared_lock_probe_timeout | int }}"
  delay: 1
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_shared_lock | bool
    - librenms_daily_global_lock_backend == 'shared_file'

- name: Require exactly one shared maintenance lock probe winner
  assert:
    that:
      - >-
        (
          librenms_production_shared_lock_probe_results.results
          | selectattr('rc', 'equalto', 0)
          | list
          | length
        ) == 1
      - >-
        (
          librenms_production_shared_lock_probe_results.results
          | selectattr('stdout', 'equalto', 'acquired')
          | list
          | length
        ) == 1
    fail_msg: >-
      The shared HA maintenance lock did not exclude every other web node.
      Check GlusterFS locking before allowing automatic LibreNMS updates.
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_shared_lock | bool
    - librenms_daily_global_lock_backend == 'shared_file'

- name: Gather production readiness service facts
  service_facts:

- name: Require active LibreNMS runtime services
  assert:
    that:
      - ansible_facts.services['librenms-scheduler.timer'].state == 'running'
      - ansible_facts.services['librenms-daily.timer'].state == 'running'
    fail_msg: >-
      LibreNMS scheduler or daily maintenance timer is not active on
      {{ inventory_hostname }}.
  when:
    - inventory_hostname in (groups.get('librenms_nodes', []) | difference(librenms_inactive_inventory_nodes))

- name: Require active HA database service
  assert:
    that:
      - ansible_facts.services[librenms_mariadb_service_name + '.service'].state == 'running'
    fail_msg: "MariaDB is not active on {{ inventory_hostname }}."
  when:
    - librenms_mode == 'ha'
    - inventory_hostname in (groups.get('librenms_db', []) | difference(librenms_inactive_inventory_nodes))

- name: Query Galera health on every active database node
  command:
    argv:
      - mysql
      - --protocol=socket
      - "--socket={{ librenms_mariadb_socket }}"
      - -Nse
      - >-
        SHOW GLOBAL STATUS WHERE Variable_name IN
        ('wsrep_cluster_status', 'wsrep_ready', 'wsrep_local_state_comment',
        'wsrep_cluster_size');
  register: librenms_production_galera_status
  changed_when: false
  when:
    - librenms_mode == 'ha'
    - inventory_hostname in (groups.get('librenms_db', []) | difference(librenms_inactive_inventory_nodes))

- name: Require every Galera node to be in the primary synced component
  assert:
    that:
      - librenms_production_galera_status.rc == 0
      - librenms_production_galera_status.stdout is search('wsrep_cluster_status[ \\t]+Primary')
      - librenms_production_galera_status.stdout is search('wsrep_ready[ \\t]+ON')
      - librenms_production_galera_status.stdout is search('wsrep_local_state_comment[ \\t]+Synced')
      - >-
        librenms_production_galera_status.stdout is search(
        'wsrep_cluster_size[ \\t]+' ~
        ((groups.get('librenms_db', []) | difference(librenms_inactive_inventory_nodes) | length) | string)
        )
    fail_msg: >-
      Galera is not fully ready on {{ inventory_hostname }}. Every production
      database node must be Primary, wsrep_ready, Synced, and report the
      expected active cluster size.
  when:
    - librenms_mode == 'ha'
    - inventory_hostname in (groups.get('librenms_db', []) | difference(librenms_inactive_inventory_nodes))

- name: Require active Galera HAProxy readiness agent sockets
  assert:
    that:
      - ansible_facts.services[librenms_galera_readiness_agent_socket_unit].state == 'running'
    fail_msg: >-
      The Galera readiness agent socket is not active on {{ inventory_hostname }}.
      HAProxy must use the agent so a MariaDB listener that is not Primary/Synced
      cannot receive LibreNMS database traffic.
  when:
    - librenms_mode == 'ha'
    - librenms_galera_readiness_agent_enabled | bool
    - inventory_hostname in (groups.get('librenms_db', []) | difference(librenms_inactive_inventory_nodes))

- name: Query the local Galera HAProxy readiness agent
  command:
    argv:
      - timeout
      - "{{ librenms_haproxy_timeout_check }}"
      - /bin/bash
      - -c
      - >-
        exec 3<>/dev/tcp/"$1"/"$2";
        IFS= read -r response <&3;
        test "${response}" = 'up'
      - --
      - "{{ ansible_host | default(ansible_default_ipv4.address) }}"
      - "{{ librenms_galera_readiness_agent_port }}"
  register: librenms_production_galera_readiness_agent
  changed_when: false
  when:
    - librenms_mode == 'ha'
    - librenms_galera_readiness_agent_enabled | bool
    - inventory_hostname in (groups.get('librenms_db', []) | difference(librenms_inactive_inventory_nodes))

- name: Require every Galera readiness agent to report an eligible backend
  assert:
    that:
      - librenms_production_galera_readiness_agent.rc == 0
    fail_msg: >-
      The Galera readiness agent on {{ inventory_hostname }} did not return up.
      HAProxy must not route database connections to this node until it reports
      Primary/Synced readiness.
  when:
    - librenms_mode == 'ha'
    - librenms_galera_readiness_agent_enabled | bool
    - inventory_hostname in (groups.get('librenms_db', []) | difference(librenms_inactive_inventory_nodes))

- name: Require HAProxy database backends to use Galera readiness agent checks
  command:
    argv:
      - grep
      - -Fq
      - "agent-check agent-port {{ librenms_galera_readiness_agent_port }}"
      - /etc/haproxy/haproxy.cfg
  changed_when: false
  when:
    - librenms_mode == 'ha'
    - librenms_galera_readiness_agent_enabled | bool
    - inventory_hostname in (groups.get('lb_nodes', []) | difference(librenms_inactive_inventory_nodes))

- name: Prove fresh LibreNMS database connections through the HAProxy VIP
  shell: |-
    set -o pipefail
    for attempt in $(seq 1 {{ librenms_production_readiness_db_proxy_probe_count | int }}); do
      mysql --protocol=TCP --connect-timeout=5 \
        --host="{{ librenms_vip_ip }}" \
        --port="{{ librenms_haproxy_db_port }}" \
        --user="{{ librenms_db_user }}" \
        --batch --skip-column-names --execute='SELECT 1' | grep -qx '1'
    done
  args:
    executable: /bin/bash
  environment:
    MYSQL_PWD: "{{ librenms_db_password }}"
  no_log: true
  changed_when: false
  when:
    - librenms_mode == 'ha'
    - librenms_vip_enabled | bool
    - inventory_hostname in (groups.get('librenms_nodes', []) | difference(librenms_inactive_inventory_nodes))

- name: Require active HA cache services
  assert:
    that:
      - ansible_facts.services[librenms_redis_service_name + '.service'].state == 'running'
      - ansible_facts.services[librenms_redis_sentinel_service_name_effective + '.service'].state == 'running'
    fail_msg: >-
      Redis or Redis Sentinel is not active on {{ inventory_hostname }}.
  when:
    - librenms_mode == 'ha'
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname in (groups.get('librenms_redis', []) | difference(librenms_inactive_inventory_nodes))

- name: Query every Redis Sentinel for its master endpoint
  no_log: true
  command: >-
    redis-cli -h 127.0.0.1 -p 26379
    {% if librenms_redis_sentinel_username | length > 0 %}
    --user {{ librenms_redis_sentinel_username | quote }}
    {% endif %}
    SENTINEL get-master-addr-by-name {{ librenms_redis_sentinel_service | quote }}
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_sentinel_password }}"
  loop: "{{ librenms_production_active_redis_nodes }}"
  delegate_to: "{{ item }}"
  ignore_unreachable: true
  register: librenms_production_redis_sentinel_queries
  changed_when: false
  failed_when: false
  when:
    - librenms_mode == 'ha'
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == (librenms_production_active_redis_nodes | last)

- name: Initialize Redis Sentinel production readiness reports
  set_fact:
    librenms_production_redis_master_reports: []
  no_log: true
  when:
    - librenms_mode == 'ha'
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == (librenms_production_active_redis_nodes | last)

- name: Record reachable Redis Sentinel master reports
  set_fact:
    librenms_production_redis_master_reports: >-
      {{
        librenms_production_redis_master_reports
        + [item.stdout_lines[0] ~ ':' ~ item.stdout_lines[1]]
      }}
  no_log: true
  loop: "{{ librenms_production_redis_sentinel_queries.results | default([]) }}"
  when:
    - librenms_mode == 'ha'
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == (librenms_production_active_redis_nodes | last)
    - item.rc == 0
    - (item.stdout_lines | default([]) | length) >= 2

- name: Require Redis Sentinel quorum agreement
  assert:
    that:
      - >-
        (librenms_production_redis_master_reports | length)
        >= (librenms_redis_quorum | int)
      - (librenms_production_redis_master_reports | unique | list | length) == 1
      - >-
        (librenms_production_redis_master_reports | first | default(''))
        is match('^[^:]+:[0-9]+$')
    fail_msg: >-
      Redis Sentinel does not have quorum agreement on one usable master
      endpoint. Run playbooks/site.yml to repair the cache cluster, then rerun
      this production gate.
  no_log: true
  when:
    - librenms_mode == 'ha'
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == (librenms_production_active_redis_nodes | last)

- name: Set Redis Sentinel consensus endpoint for readiness write check
  set_fact:
    librenms_production_redis_master_host: >-
      {{ (librenms_production_redis_master_reports | first).split(':')[0] }}
    librenms_production_redis_master_port: >-
      {{ (librenms_production_redis_master_reports | first).split(':')[1] }}
  no_log: true
  when:
    - librenms_mode == 'ha'
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == (librenms_production_active_redis_nodes | last)

- name: Require Redis Sentinel consensus master to accept a cache write
  no_log: true
  command: >-
    redis-cli -h {{ librenms_production_redis_master_host | quote }}
    -p {{ librenms_production_redis_master_port | quote }}
    {% if librenms_redis_username | length > 0 %}
    --user {{ librenms_redis_username | quote }}
    {% endif %}
    SET librenms:production-readiness {{ inventory_hostname | quote }} EX 30
  environment:
    REDISCLI_AUTH: "{{ librenms_redis_password }}"
  register: librenms_production_redis_write_check
  changed_when: false
  until: >-
    (librenms_production_redis_write_check.stdout | default('') | trim) == 'OK'
  retries: "{{ librenms_redis_sentinel_consensus_retries | int }}"
  delay: "{{ librenms_redis_sentinel_consensus_delay | int }}"
  when:
    - librenms_mode == 'ha'
    - librenms_redis_mode == 'sentinel'
    - inventory_hostname == (librenms_production_active_redis_nodes | last)

- name: Run LibreNMS validation on each application node
  command:
    argv:
      - runuser
      - -u
      - librenms
      - --
      - "{{ librenms_install_dir }}/validate.php"
  register: librenms_production_validate
  changed_when: false
  failed_when: "'[FAIL]' in librenms_production_validate.stdout"
  when:
    - inventory_hostname in (groups.get('librenms_nodes', []) | difference(librenms_inactive_inventory_nodes))

- name: Require LibreNMS application validation dependencies
  assert:
    that:
      - "'[OK]    Database Connected' in librenms_production_validate.stdout"
      - "'[OK]    Redis is functional' in librenms_production_validate.stdout"
      - "'[OK]    Dispatcher Service is enabled' in librenms_production_validate.stdout"
      - "'[OK]    Connected to rrdcached' in librenms_production_validate.stdout"
    fail_msg: >-
      LibreNMS validation did not confirm database, Redis, dispatcher, and RRD
      dependencies on {{ inventory_hostname }}. Inspect validate.php output and
      rerun playbooks/site.yml before declaring production readiness.
  when:
    - inventory_hostname in (groups.get('librenms_nodes', []) | difference(librenms_inactive_inventory_nodes))

- name: Query LibreNMS revision on every application node
  command:
    argv:
      - runuser
      - -u
      - librenms
      - --
      - git
      - -C
      - "{{ librenms_install_dir }}"
      - rev-parse
      - HEAD
  loop: "{{ groups.get('librenms_nodes', []) | difference(librenms_inactive_inventory_nodes) }}"
  delegate_to: "{{ item }}"
  register: librenms_production_git_revisions
  changed_when: false
  run_once: true

- name: Require one LibreNMS revision across every application node
  assert:
    that:
      - >-
        (
          librenms_production_git_revisions.results
          | map(attribute='stdout')
          | map('trim')
          | unique
          | list
          | length
        ) == 1
    fail_msg: >-
      LibreNMS application nodes are running different Git revisions. Finish a
      controlled cluster update and rerun the gate before accepting browser
      traffic from every backend.
  run_once: true

- name: Query LibreNMS working-tree state on every application node
  command:
    argv:
      - runuser
      - -u
      - librenms
      - --
      - git
      - -C
      - "{{ librenms_install_dir }}"
      - status
      - --porcelain
  loop: "{{ groups.get('librenms_nodes', []) | difference(librenms_inactive_inventory_nodes) }}"
  delegate_to: "{{ item }}"
  register: librenms_production_git_worktrees
  changed_when: false
  run_once: true

- name: Require clean LibreNMS working trees on every application node
  assert:
    that:
      - >-
        (
          librenms_production_git_worktrees.results
          | map(attribute='stdout')
          | map('trim')
          | select
          | list
          | length
        ) == 0
    fail_msg: >-
      One or more LibreNMS working trees contain uncommitted changes. Keep
      local application changes in a reviewed deployment branch or revert them
      before enabling unattended updates.
  run_once: true

- name: Verify VIP TLS certificate with its configured SNI hostname
  command:
    argv:
      - python3
      - -c
      - >-
        import os, socket, ssl; raw = socket.create_connection(
        (os.environ['LIBRENMS_TLS_VIP'], int(os.environ['LIBRENMS_TLS_PORT'])),
        timeout=10); tls = ssl.create_default_context().wrap_socket(
        raw, server_hostname=os.environ['LIBRENMS_TLS_SERVER_NAME']);
        print(tls.version()); tls.close()
  environment:
    LIBRENMS_TLS_VIP: "{{ librenms_vip_ip }}"
    LIBRENMS_TLS_PORT: "{{ librenms_haproxy_https_port | string }}"
    LIBRENMS_TLS_SERVER_NAME: "{{ librenms_production_haproxy_web_check_host }}"
  register: librenms_production_vip_tls_verify
  changed_when: false
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_vip_enabled | bool
    - librenms_haproxy_tls_enabled | bool
    - librenms_production_readiness_verify_vip_tls | bool

- name: Require a trusted VIP TLS certificate
  assert:
    that:
      - librenms_production_vip_tls_verify.rc == 0
    fail_msg: >-
      TLS certificate verification failed for the LibreNMS VIP using SNI host
      {{ librenms_production_haproxy_web_check_host }}. Install a trusted
      certificate whose DNS names include this host, then rerun the production
      readiness gate.
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_vip_enabled | bool
    - librenms_haproxy_tls_enabled | bool
    - librenms_production_readiness_verify_vip_tls | bool

- name: Verify VIP PHP-FPM health endpoint
  uri:
    url: >-
      {{ 'https' if librenms_haproxy_tls_enabled | bool else 'http' }}://{{ librenms_vip_ip }}{{
      ':' ~ librenms_haproxy_https_port
      if librenms_haproxy_tls_enabled | bool and librenms_haproxy_https_port | int != 443
      else (
        ':' ~ librenms_haproxy_web_port
        if not librenms_haproxy_tls_enabled | bool and librenms_haproxy_web_port | int != 80
        else ''
      )
      }}{{ librenms_php_fpm_ping_path }}
    headers:
      Host: "{{ librenms_production_haproxy_web_check_host }}"
    method: GET
    return_content: true
    status_code: 200
    timeout: 10
    validate_certs: "{{ librenms_vip_app_probe_validate_certs | bool }}"
  register: librenms_production_vip_php_fpm_ping
  changed_when: false
  retries: "{{ librenms_production_readiness_vip_probe_retries | int }}"
  delay: "{{ librenms_production_readiness_vip_probe_delay | int }}"
  until:
    - librenms_production_vip_php_fpm_ping.status | default(0) == 200
    - "'pong' in (librenms_production_vip_php_fpm_ping.content | default(''))"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_vip_enabled | bool

- name: Verify database runtime health on every active LibreNMS web node
  uri:
    url: >-
      http://{{
      hostvars[item].ansible_host
      | default(hostvars[item].ansible_default_ipv4.address | default(item))
      }}{{ librenms_nginx_runtime_health_check_path }}
    headers:
      Host: "{{ librenms_production_haproxy_web_check_host }}"
    method: GET
    return_content: true
    status_code: 200
    timeout: 10
  loop: "{{ groups.get('librenms_nodes', []) | difference(librenms_inactive_inventory_nodes) }}"
  delegate_to: "{{ item }}"
  register: librenms_production_runtime_web_health
  changed_when: false
  retries: "{{ librenms_production_readiness_vip_probe_retries | int }}"
  delay: "{{ librenms_production_readiness_vip_probe_delay | int }}"
  until:
    - librenms_production_runtime_web_health.status | default(0) == 200
    - "'ok' in (librenms_production_runtime_web_health.content | default(''))"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_runtime_web_health | bool

- name: Verify LibreNMS application response through the VIP
  uri:
    url: >-
      {{ 'https' if librenms_haproxy_tls_enabled | bool else 'http' }}://{{ librenms_vip_ip }}{{
      ':' ~ librenms_haproxy_https_port
      if librenms_haproxy_tls_enabled | bool and librenms_haproxy_https_port | int != 443
      else (
        ':' ~ librenms_haproxy_web_port
        if not librenms_haproxy_tls_enabled | bool and librenms_haproxy_web_port | int != 80
        else ''
      )
      }}{{ librenms_app_probe_path }}
    headers:
      Host: "{{ librenms_production_haproxy_web_check_host }}"
    method: GET
    status_code: "{{ librenms_app_probe_success_statuses }}"
    timeout: "{{ librenms_app_probe_timeout | int }}"
    follow_redirects: "{{ librenms_app_probe_follow_redirects }}"
    validate_certs: "{{ librenms_vip_app_probe_validate_certs | bool }}"
  register: librenms_production_vip_app_probe
  changed_when: false
  retries: "{{ librenms_production_readiness_vip_probe_retries | int }}"
  delay: "{{ librenms_production_readiness_vip_probe_delay | int }}"
  until:
    - >-
      (librenms_production_vip_app_probe.status | default(0) | int)
      in librenms_app_probe_success_statuses
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_vip_enabled | bool

- name: Prove the scheduled backup also reaches the offsite target
  command:
    argv:
      - "{{ librenms_backup_wrapper_path }}"
      - "{{ librenms_production_readiness_backup_category }}"
  register: librenms_production_offsite_backup
  changed_when: true
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Record the generated production readiness backup directory
  set_fact:
    librenms_production_backup_dir: >-
      {{
        librenms_production_offsite_backup.stdout
        | regex_findall('backup completed at (.+)')
        | last
        | default('')
      }}
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Require a generated production readiness backup directory
  assert:
    that:
      - librenms_production_backup_dir | length > 0
    fail_msg: >-
      The scheduled backup completed without reporting its backup directory, so
      its manifest and artifacts cannot be verified.
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Read the production readiness backup manifest
  slurp:
    src: "{{ librenms_production_backup_dir }}/{{ librenms_backup_manifest_filename }}"
  register: librenms_production_backup_manifest_raw
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Parse the production readiness backup manifest
  set_fact:
    librenms_production_backup_manifest: >-
      {{ librenms_production_backup_manifest_raw.content | b64decode | from_yaml }}
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Require database and configuration artifacts in the generated backup
  assert:
    that:
      - librenms_production_backup_manifest.database.included | default(false) | bool
      - librenms_production_backup_manifest.database.file | default('') | length > 0
      - librenms_production_backup_manifest.config.included | default(false) | bool
      - librenms_production_backup_manifest.config.file | default('') | length > 0
    fail_msg: >-
      The generated backup manifest does not contain the required database and
      configuration artifacts.
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Calculate generated database backup SHA-256 checksum
  stat:
    path: >-
      {{ librenms_production_backup_dir }}/{{
      librenms_production_backup_manifest.database.file }}
    checksum_algorithm: sha256
  register: librenms_production_database_backup_stat
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Calculate generated configuration backup SHA-256 checksum
  stat:
    path: >-
      {{ librenms_production_backup_dir }}/{{
      librenms_production_backup_manifest.config.file }}
    checksum_algorithm: sha256
  register: librenms_production_config_backup_stat
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Require generated backup manifest SHA-256 checksums to match
  assert:
    that:
      - >-
        (librenms_production_backup_manifest.database.checksum_sha256
        | default('')) is match('^[A-Fa-f0-9]{64}$')
      - >-
        librenms_production_database_backup_stat.stat.checksum | default('')
        == librenms_production_backup_manifest.database.checksum_sha256
      - >-
        (librenms_production_backup_manifest.config.checksum_sha256
        | default('')) is match('^[A-Fa-f0-9]{64}$')
      - >-
        librenms_production_config_backup_stat.stat.checksum | default('')
        == librenms_production_backup_manifest.config.checksum_sha256
    fail_msg: >-
      The production backup artifact checksums are missing or do not match the
      manifest. Do not accept the offsite backup until a new verified backup
      completes successfully.
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Verify generated database backup gzip integrity
  command:
    argv:
      - gzip
      - -t
      - >-
        {{ librenms_production_backup_dir }}/{{
        librenms_production_backup_manifest.database.file }}
  changed_when: false
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Define disposable database restore verification name
  set_fact:
    librenms_production_restore_database: >-
      librenms_restore_verify_{{ ansible_date_time.epoch }}
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_production_readiness_verify_database_restore | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Record disposable database restore verification start time
  set_fact:
    librenms_production_database_restore_started_epoch: >-
      {{ now(utc=true, fmt='%s') | int }}
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_production_readiness_verify_database_restore | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Verify generated database backup can be imported safely
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_production_readiness_verify_database_restore | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool
  block:
    - name: Create disposable database restore target
      ansible.mysql.mysql_db:
        name: "{{ librenms_production_restore_database }}"
        state: present
        login_unix_socket: >-
          {{
            hostvars[librenms_backup_scheduled_host].librenms_mariadb_socket
            | default(librenms_mariadb_socket)
          }}
        check_implicit_admin: true
      delegate_to: "{{ librenms_backup_scheduled_host }}"

    - name: Import generated database backup into disposable target
      ansible.mysql.mysql_db:
        name: "{{ librenms_production_restore_database }}"
        state: import
        target: >-
          {{ librenms_production_backup_dir }}/{{
          librenms_production_backup_manifest.database.file }}
        login_unix_socket: >-
          {{
            hostvars[librenms_backup_scheduled_host].librenms_mariadb_socket
            | default(librenms_mariadb_socket)
          }}
        check_implicit_admin: true
      delegate_to: "{{ librenms_backup_scheduled_host }}"
  always:
    - name: Remove disposable database restore target
      ansible.mysql.mysql_db:
        name: "{{ librenms_production_restore_database }}"
        state: absent
        login_unix_socket: >-
          {{
            hostvars[librenms_backup_scheduled_host].librenms_mariadb_socket
            | default(librenms_mariadb_socket)
          }}
        check_implicit_admin: true
      delegate_to: "{{ librenms_backup_scheduled_host }}"
      when: librenms_production_restore_database | default('') | length > 0

- name: Calculate disposable database restore verification duration
  set_fact:
    librenms_production_database_restore_elapsed_seconds: >-
      {{
        (now(utc=true, fmt='%s') | int)
        - (librenms_production_database_restore_started_epoch | int)
      }}
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_production_readiness_verify_database_restore | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Require disposable database restore verification within its objective
  assert:
    that:
      - >-
        (librenms_production_database_restore_elapsed_seconds | int)
        <= (librenms_production_readiness_max_database_restore_seconds | int)
    fail_msg: >-
      Disposable database restore verification took
      {{ librenms_production_database_restore_elapsed_seconds }} seconds,
      exceeding the configured
      {{ librenms_production_readiness_max_database_restore_seconds }}-second
      recovery objective.
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_production_readiness_verify_database_restore | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Verify generated configuration backup archive integrity
  command:
    argv:
      - tar
      - -tzf
      - >-
        {{ librenms_production_backup_dir }}/{{
        librenms_production_backup_manifest.config.file }}
  changed_when: false
  delegate_to: "{{ librenms_backup_scheduled_host }}"
  run_once: true
  when:
    - librenms_mode == 'ha'
    - librenms_production_readiness_verify_offsite_backup | bool
    - librenms_backup_offsite_enabled | bool
    - librenms_backup_offsite_required | bool

- name: Set production readiness completion timestamp
  set_fact:
    librenms_production_readiness_completed_at: >-
      {{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
    librenms_production_readiness_evidence_filename: >-
      production-readiness-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.json
  run_once: true

- name: Create controller-side production readiness evidence directory
  file:
    path: "{{ librenms_production_readiness_evidence_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  delegate_to: localhost
  become: true
  run_once: true
  when: librenms_production_readiness_write_evidence | bool

- name: Install controller-side production readiness evidence verifier
  copy:
    src: librenms-production-readiness-evidence-verify.py
    dest: "{{ librenms_production_readiness_evidence_verifier_path }}"
    owner: root
    group: root
    mode: "0750"
  delegate_to: localhost
  become: true
  run_once: true
  when: librenms_production_readiness_write_evidence | bool

- name: Find expired production readiness evidence records
  find:
    paths: "{{ librenms_production_readiness_evidence_dir }}"
    patterns:
      - "production-readiness-*.json"
      - "production-readiness-*.json.sha256"
      - "production-readiness-*.json.hmac"
    age: "{{ librenms_production_readiness_evidence_retention_days | int }}d"
    age_stamp: mtime
    file_type: file
  delegate_to: localhost
  register: librenms_production_readiness_expired_evidence
  changed_when: false
  run_once: true
  when: librenms_production_readiness_write_evidence | bool

- name: Remove expired production readiness evidence records
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ librenms_production_readiness_expired_evidence.files | default([]) }}"
  delegate_to: localhost
  become: true
  run_once: true
  when: librenms_production_readiness_write_evidence | bool

- name: Write successful production readiness evidence
  copy:
    dest: >-
      {{ librenms_production_readiness_evidence_dir }}/{{
      librenms_production_readiness_evidence_filename }}
    content: >-
      {{
        {
          'completed_at': librenms_production_readiness_completed_at,
          'result': 'passed',
          'mode': librenms_mode,
          'vip': librenms_vip_ip,
          'vip_tls_verified': librenms_production_readiness_verify_vip_tls | bool,
          'network_tcp_matrix_verified':
            librenms_production_readiness_network_tcp_checks_enabled | bool,
          'shared_lock_verified':
            librenms_production_readiness_verify_shared_lock | bool,
          'offsite_backup_verified':
            librenms_production_readiness_verify_offsite_backup | bool,
          'database_restore_verified':
            librenms_production_readiness_verify_database_restore | bool,
          'database_restore_elapsed_seconds':
            librenms_production_database_restore_elapsed_seconds | default(-1) | int,
          'database_restore_objective_seconds':
            librenms_production_readiness_max_database_restore_seconds | int,
          'scheduled_daily_backup_verified':
            librenms_production_readiness_require_scheduled_daily_backup | bool,
          'runtime_web_health_verified':
            librenms_production_readiness_verify_runtime_web_health | bool,
          'recent_failover_evidence_verified':
            librenms_production_readiness_require_recent_failover_evidence | bool,
          'failover_evidence_path':
            librenms_production_latest_failover_evidence_path | default(''),
          'failover_elapsed_seconds':
            (librenms_production_latest_failover_evidence | default({})).elapsed_seconds
            | default(-1) | int,
          'failover_recovery_objective_seconds':
            librenms_production_readiness_max_failover_recovery_seconds | int,
          'database_nodes': librenms_production_active_db_nodes,
          'redis_nodes': librenms_production_active_redis_nodes,
          'load_balancer_nodes': librenms_production_active_lb_nodes,
          'web_nodes': librenms_production_active_web_nodes
        }
        | to_nice_json
      }}
    owner: root
    group: root
    mode: "0640"
  delegate_to: localhost
  become: true
  register: librenms_production_readiness_evidence
  run_once: true
  when: librenms_production_readiness_write_evidence | bool

- name: Calculate generated production readiness evidence SHA-256 checksum
  stat:
    path: "{{ librenms_production_readiness_evidence.dest }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: true
  register: librenms_production_readiness_evidence_stat
  changed_when: false
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_integrity_enabled | bool

- name: Write production readiness evidence checksum sidecar
  copy:
    dest: "{{ librenms_production_readiness_evidence.dest }}.sha256"
    content: |
      {{ librenms_production_readiness_evidence_stat.stat.checksum }}  {{
      librenms_production_readiness_evidence.dest | basename }}
    owner: root
    group: root
    mode: "0640"
  delegate_to: localhost
  become: true
  no_log: true
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_integrity_enabled | bool

- name: Verify production readiness evidence checksum sidecar
  command:
    argv:
      - sha256sum
      - --check
      - "{{ librenms_production_readiness_evidence.dest }}.sha256"
  delegate_to: localhost
  become: true
  changed_when: false
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_integrity_enabled | bool

- name: Calculate authenticated production readiness evidence digest
  command:
    argv:
      - python3
      - -c
      - >-
        import hashlib, hmac, os, pathlib, sys; evidence = pathlib.Path(sys.argv[1]);
        key = os.environ["LIBRENMS_PRODUCTION_READINESS_EVIDENCE_HMAC_KEY"].encode();
        digest = hmac.new(key, evidence.read_bytes(), hashlib.sha256).hexdigest();
        print(f"{digest}  {evidence.name}")
      - "{{ librenms_production_readiness_evidence.dest }}"
  environment:
    LIBRENMS_PRODUCTION_READINESS_EVIDENCE_HMAC_KEY: "{{ librenms_app_key }}"
  delegate_to: localhost
  become: true
  no_log: true
  register: librenms_production_readiness_evidence_hmac
  changed_when: false
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_hmac_enabled | bool

- name: Write authenticated production readiness evidence sidecar
  copy:
    dest: "{{ librenms_production_readiness_evidence.dest }}.hmac"
    content: |
      {{ librenms_production_readiness_evidence_hmac.stdout | trim }}
    owner: root
    group: root
    mode: "0640"
  delegate_to: localhost
  become: true
  no_log: true
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_hmac_enabled | bool

- name: Read authenticated production readiness evidence sidecar
  slurp:
    src: "{{ librenms_production_readiness_evidence.dest }}.hmac"
  delegate_to: localhost
  become: true
  no_log: true
  register: librenms_production_readiness_evidence_hmac_sidecar
  changed_when: false
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_hmac_enabled | bool

- name: Recalculate authenticated production readiness evidence digest after write
  command:
    argv:
      - python3
      - -c
      - >-
        import hashlib, hmac, os, pathlib, sys; evidence = pathlib.Path(sys.argv[1]);
        key = os.environ["LIBRENMS_PRODUCTION_READINESS_EVIDENCE_HMAC_KEY"].encode();
        digest = hmac.new(key, evidence.read_bytes(), hashlib.sha256).hexdigest();
        print(f"{digest}  {evidence.name}")
      - "{{ librenms_production_readiness_evidence.dest }}"
  environment:
    LIBRENMS_PRODUCTION_READINESS_EVIDENCE_HMAC_KEY: "{{ librenms_app_key }}"
  delegate_to: localhost
  become: true
  no_log: true
  register: librenms_production_readiness_evidence_hmac_after_write
  changed_when: false
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_hmac_enabled | bool

- name: Require authenticated production readiness evidence sidecar matches
  assert:
    that:
      - >-
        (librenms_production_readiness_evidence_hmac_sidecar.content
        | b64decode | trim) is match('^[a-f0-9]{64}  .+$')
      - >-
        (librenms_production_readiness_evidence_hmac_sidecar.content
        | b64decode | trim)
        == (librenms_production_readiness_evidence_hmac_after_write.stdout | trim)
    fail_msg: >-
      Production readiness evidence HMAC verification failed. The readiness
      record was not accepted as a passing certification artifact.
  delegate_to: localhost
  no_log: true
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_hmac_enabled | bool

- name: Verify generated production readiness evidence with controller verifier
  command:
    argv:
      - "{{ librenms_production_readiness_evidence_verifier_path }}"
      - --evidence
      - "{{ librenms_production_readiness_evidence.dest }}"
      - --app-env
      - "{{ librenms_install_dir }}/.env"
  delegate_to: localhost
  become: true
  no_log: true
  changed_when: false
  run_once: true
  when:
    - librenms_production_readiness_write_evidence | bool
    - librenms_production_readiness_evidence_hmac_enabled | bool

- name: Publish production readiness result for controller job records
  set_stats:
    data:
      librenms_production_readiness:
        completed_at: "{{ librenms_production_readiness_completed_at }}"
        result: passed
        vip: "{{ librenms_vip_ip }}"
        failover_elapsed_seconds: >-
          {{
            (librenms_production_latest_failover_evidence | default({}))
            .elapsed_seconds | default(-1) | int
          }}
        database_restore_elapsed_seconds: >-
          {{ librenms_production_database_restore_elapsed_seconds | default(-1) | int }}
        evidence_path: >-
          {{
            librenms_production_readiness_evidence.dest
            | default('controller evidence disabled')
          }}
        evidence_checksum_path: >-
          {{
            (librenms_production_readiness_evidence.dest | default(''))
            ~ '.sha256'
            if librenms_production_readiness_evidence_integrity_enabled | bool
            and librenms_production_readiness_write_evidence | bool
            else 'evidence integrity disabled'
          }}
        evidence_hmac_path: >-
          {{
            (librenms_production_readiness_evidence.dest | default(''))
            ~ '.hmac'
            if librenms_production_readiness_evidence_hmac_enabled | bool
            and librenms_production_readiness_write_evidence | bool
            else 'evidence HMAC disabled'
          }}
  run_once: true

- name: Report successful production readiness verification
  debug:
    msg: >-
      Production readiness checks passed: Galera, Redis Sentinel, LibreNMS
      validation, VIP routing, recent failover evidence, network TCP matrix,
      and required offsite backup with database/config archive integrity plus a
      disposable database restore.
      Evidence: {{ librenms_production_readiness_evidence.dest
      | default('controller evidence disabled') }}
  run_once: true
