---
name: lint

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-package-matrix:
    name: platform-packages (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: ubuntu-26.04
            image: ubuntu:26.04
          - name: rocky-8
            image: rockylinux/rockylinux:8
          - name: rocky-9
            image: rockylinux/rockylinux:9
          - name: rocky-10
            image: rockylinux/rockylinux:10
          - name: almalinux-8
            image: almalinux:8
          - name: almalinux-9
            image: almalinux:9
          - name: almalinux-10
            image: almalinux:10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve supported platform package set
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          "${{ matrix.image }}"
          bash /workspace/tests/platform/package-smoke.sh

  python-314-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install the pinned CI toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement requirements-ci.txt
          python -m pip check

      - name: Run Python 3.14 smoke checks
        run: python scripts/ci-python-smoke.py

  ansible-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement requirements-ci.txt
          python -m pip check

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ~/.ansible/collections

      - name: Run Python smoke checks
        run: python scripts/ci-python-smoke.py

      - name: Run yamllint
        run: yamllint .

      - name: Run Ansible syntax checks
        run: python scripts/ci-ansible-syntax-check.py

      - name: Test Galera readiness decisions
        run: make test-galera-readiness

      - name: Test Galera bootstrap guardrails
        run: make test-galera-bootstrap-guardrails

      - name: Test MariaDB series guardrails
        run: make test-mariadb-series-guardrails

      - name: Test runtime support guardrails
        run: make test-runtime-support-guardrails

      - name: Test platform support guardrails
        run: make test-platform-support-guardrails

      - name: Test daily maintenance drain guardrails
        run: make test-daily-maintenance-guardrails

      - name: Test runtime web-health guardrails
        run: make test-runtime-web-health-guardrails

      - name: Test failover recovery guardrails
        run: make test-failover-recovery-guardrails

      - name: Test load-balancer rollout guardrails
        run: make test-load-balancer-rollout-guardrails

      - name: Test production readiness evidence guardrails
        run: make test-production-readiness-evidence-guardrails

      - name: Test AWX strict-status schedule guardrails
        run: make test-awx-status-schedule-guardrails

      - name: Test host-firewall guardrails
        run: make test-host-firewall-guardrails

      - name: Test Gluster RRD mount guardrails
        run: make test-gluster-rrd-mount-guardrails

      - name: Run ansible-lint
        run: ansible-lint

  controller-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build Ansible controller image
        run: docker compose build ansible

      - name: Run quality gates in controller image
        run: docker compose run --rm --no-deps ansible make ci

      - name: Exercise managed-host runtime compatibility
        run: |
          bash tests/platform/managed-runtime-smoke.sh ubuntu:22.04 3.10 ubuntu-22
          bash tests/platform/managed-runtime-smoke.sh ubuntu:24.04 3.12 ubuntu-24
          bash tests/platform/managed-runtime-smoke.sh ubuntu:26.04 3.14 ubuntu-26
          bash tests/platform/managed-runtime-smoke.sh rockylinux/rockylinux:8 3.11 rocky-8
          bash tests/platform/managed-runtime-smoke.sh rockylinux/rockylinux:9 3.9 rocky-9
          bash tests/platform/managed-runtime-smoke.sh rockylinux/rockylinux:10 3.12 rocky-10
          bash tests/platform/managed-runtime-smoke.sh almalinux:8 3.11 alma-8
          bash tests/platform/managed-runtime-smoke.sh almalinux:9 3.9 alma-9
          bash tests/platform/managed-runtime-smoke.sh almalinux:10 3.12 alma-10

  haproxy-web-failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run HAProxy web failover integration test
        run: make integration-haproxy-web

  galera-failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run Galera quorum and rejoin integration test
        run: make integration-galera

  docker-ha-galera-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate Docker Galera example configuration
        run: make test-docker-ha-galera-config

  redis-sentinel-failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run Redis Sentinel failover integration test
        run: make integration-redis-sentinel
