---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # The controller image is intentionally pinned to Python 3.12. Python
      # 3.14 compatibility is exercised by the dedicated CI runtime job, but
      # changing the reproducible image remains an intentional change.
      - dependency-name: python
        versions: [">= 3.13"]
